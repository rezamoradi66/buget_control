<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سامانه مدیریت بودجه سرمایه‌ای</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   سامانه مدیریت بودجه سرمایه‌ای — نسخه مستقل (تک‌فایل)
   طراحی: سازمانی، مینیمال، RTL، واکنش‌گرا
   ============================================================ */
:root{
  --primary:#0d3b66;
  --primary-2:color-mix(in srgb, var(--primary), #000 22%);
  --primary-3:color-mix(in srgb, var(--primary), #fff 12%);
  --accent:#1f7ae0;
  --accent-soft:#e8f1fc;
  --bg:#f2f5f9;
  --card:#ffffff;
  --text:#1c2b3a;
  --muted:#64748b;
  --line:#e2e8f0;
  --green:#16a34a;--green-soft:#e7f6ed;
  --red:#dc2626;--red-soft:#fdeaea;
  --amber:#b45309;--amber-soft:#fdf3e3;
  --orange:#c2410c;--orange-soft:#fdeee2;
  --info:#0369a1;--info-soft:#e3f2fb;
  --violet:#7c3aed;--violet-soft:#f1eafd;
  --radius:14px;
  --shadow:0 1px 3px rgba(15,23,42,.05), 0 10px 26px -14px rgba(15,23,42,.16);
  --shadow-lg:0 24px 60px -20px rgba(8,25,45,.35);
  --hdr-img:none;
  --font:'Vazirmatn','Vazir','IRANSansX','IRANSans',Tahoma,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14.5px;line-height:1.75;min-height:100vh}
button,input,select,textarea{font-family:var(--font);font-size:14px;color:var(--text)}
button{cursor:pointer}
a{color:var(--accent);text-decoration:none}
.hidden{display:none!important}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#c3cede;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#9fb0c6}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- دکمه‌ها ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:10px;padding:9px 18px;font-weight:600;font-size:13.5px;transition:filter .15s, background .15s, transform .05s;white-space:nowrap;line-height:1.6}
.btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px;flex-shrink:0}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-2)}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:hover{filter:brightness(1.08)}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover{filter:brightness(1.08)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{filter:brightness(1.08)}
.btn-warn{background:#d97706;color:#fff}
.btn-warn:hover{filter:brightness(1.08)}
.btn-ghost{background:#eef2f7;color:#334155}
.btn-ghost:hover{background:#e2e8f0}
.btn-outline{background:#fff;border:1.5px solid var(--line);color:#334155}
.btn-outline:hover{border-color:#cbd5e1;background:#f8fafc}
.btn-sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.btn-sm svg{width:14px;height:14px}
.icon-btn{width:38px;height:38px;border-radius:10px;border:none;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:#475569;position:relative;transition:background .15s}
.icon-btn:hover{background:#eef2f7}
.icon-btn svg{width:20px;height:20px}

/* ---------- نشان وضعیت و چیپ ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2.5px 11px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap;line-height:1.9}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.st-gray{background:#eef2f7;color:#475569}
.st-amber{background:#fdf3e3;color:#b45309}
.st-violet{background:#f1eafd;color:#7c3aed}
.st-info{background:#e3f2fb;color:#0369a1}
.st-green{background:#e7f6ed;color:#15803d}
.st-red{background:#fdeaea;color:#b91c1c}
.st-orange{background:#fdeee2;color:#c2410c}
.chip-soft{background:#eef2f7;color:#475569;font-weight:600}

/* ---------- فرم‌ها ---------- */
.field{margin-bottom:15px}
.field>label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#334155}
.field>label .req-star{color:var(--red);margin-inline-start:3px}
.input,textarea.input{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 13px;transition:border-color .15s, box-shadow .15s}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,122,224,.13)}
.input::placeholder{color:#9aa8bb}
textarea.input{resize:vertical;min-height:88px;line-height:1.9}
.input[readonly]{background:#f8fafc;color:#64748b}
.input:disabled{background:#f1f5f9;cursor:not-allowed}
.err-msg{display:none;color:var(--red);font-size:12px;margin-top:5px;font-weight:500}
.field.has-err .err-msg{display:block}
.field.has-err .input{border-color:var(--red)}
.field.has-err .dd-btn{border-color:var(--red)}
.hint{font-size:11.5px;color:#8ea0b5;margin-top:5px}
.char-count{font-size:11px;color:#8ea0b5;text-align:left;margin-top:4px;transition:color .15s}
.char-count.low{color:var(--red);font-weight:700}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 18px}
.form-grid .full{grid-column:1/-1}
@media(max-width:640px){.form-grid{grid-template-columns:1fr}}
fieldset.frm-sec{border:1.5px solid var(--line);border-radius:12px;padding:16px 16px 2px;margin-bottom:18px}
fieldset.frm-sec legend{font-size:13px;font-weight:800;color:var(--primary);padding:0 8px}

/* ---------- Dropdown سفارشی ---------- */
.dd{position:relative}
.dd-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:8.5px 13px;text-align:right;transition:border-color .15s, box-shadow .15s;min-height:41px}
.dd-btn:hover{border-color:#cbd5e1}
.dd.open .dd-btn{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,122,224,.13)}
.dd-btn .dd-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-btn .dd-label.ph{color:#9aa8bb;font-weight:400}
.dd-btn .dd-caret{width:16px;height:16px;color:#8ea0b5;transition:transform .18s;flex-shrink:0}
.dd.open .dd-caret{transform:rotate(180deg)}
.dd-btn:disabled{background:#f1f5f9;cursor:not-allowed;color:#94a3b8}
.dd-menu{position:absolute;top:calc(100% + 6px);inset-inline:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);z-index:65;overflow:hidden;animation:ddIn .14s ease}
@keyframes ddIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.dd-search{padding:8px;border-bottom:1px solid var(--line)}
.dd-search input{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;background:#f8fafc}
.dd-search input:focus{outline:none;border-color:var(--accent);background:#fff}
.dd-list{max-height:250px;overflow:auto;padding:5px}
.dd-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 11px;border-radius:8px;cursor:pointer;font-size:13.5px}
.dd-item:hover,.dd-item.hov{background:var(--accent-soft)}
.dd-item.sel{color:var(--accent);font-weight:700;background:var(--accent-soft)}
.dd-item svg{width:15px;height:15px;flex-shrink:0}
.dd-empty{padding:14px;text-align:center;color:#94a3b8;font-size:12.5px}
.dd.up .dd-menu{top:auto;bottom:calc(100% + 6px)}

/* ---------- DatePicker شمسی ---------- */
.dp-wrap{position:relative}
.dp-pop{position:absolute;top:calc(100% + 6px);inset-inline-start:0;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);z-index:80;padding:12px;width:284px;animation:ddIn .14s ease}
.dp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:4px}
.dp-title{font-weight:800;font-size:13.5px;color:var(--primary);min-width:110px;text-align:center}
.dp-nav{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;color:#475569}
.dp-nav:hover{background:var(--accent-soft)}
.dp-nav svg{width:14px;height:14px}
.dp-navgrp{display:flex;gap:3px}
.dp-wk,.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp-wk span{text-align:center;font-size:10.5px;color:#8ea0b5;font-weight:700;padding:3px 0}
.dp-day{height:31px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12.5px;cursor:pointer;border:none;background:transparent}
.dp-day:hover{background:var(--accent-soft)}
.dp-day.empty{cursor:default}
.dp-day.sel{background:var(--primary);color:#fff;font-weight:800}
.dp-day.today{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent);font-weight:700}
.dp-day.today.sel{color:#fff}
.dp-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.dp-foot button{border:none;background:none;color:var(--accent);font-size:12px;font-weight:600}
</style>
<style>
/* ---------- چیدمان کلی ---------- */
:root{--hdr-strip:none}
#loginPage{min-height:100vh}
#app{display:none;min-height:100vh}
#app.on{display:block}
#sidebar{position:fixed;top:0;bottom:0;inset-inline-start:0;width:262px;z-index:50;display:flex;flex-direction:column;background:var(--sb-grad,linear-gradient(180deg,#0d3a85 0%,#0a2e68 55%,#082351 100%));transition:transform .28s ease;overflow-y:auto;overflow-x:hidden}
.side-brand{display:flex;align-items:center;gap:11px;padding:20px 18px 14px;flex-shrink:0}
.brand-logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent),#fff 38%));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:19px;box-shadow:0 6px 16px -6px color-mix(in srgb,var(--accent) 62%,transparent);flex-shrink:0}
.brand-t{font-weight:800;color:#fff;font-size:14px;line-height:1.5}
.brand-s{font-size:10.5px;color:#8fb0d4}
.side-nav{flex:1;padding-bottom:10px}
.side-sec{font-size:10.5px;color:#7f9cba;margin:16px 22px 6px;font-weight:700;letter-spacing:.4px}
.side-item{display:flex;align-items:center;gap:12px;padding:10.5px 16px;margin:2px 10px;border-radius:11px;color:#c7d7ea;font-size:13.5px;cursor:pointer;transition:background .15s,color .15s;position:relative;border:none;background:transparent;width:calc(100% - 20px);text-align:right;font-weight:500}
.side-item svg{width:19px;height:19px;flex-shrink:0;opacity:.9}
.side-item:hover{background:rgba(255,255,255,.07);color:#fff}
.side-item.active{background:rgba(255,255,255,.14);color:#fff;font-weight:700}
.side-item.active::before{content:'';position:absolute;inset-inline-start:-10px;top:9px;bottom:9px;width:4px;border-radius:4px;background:var(--gold,#e9b75a)}
.side-item .cnt{margin-inline-start:auto;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;min-width:20px;height:20px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.side-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:10.5px;color:#7f9cba;flex-shrink:0}
#sideOverlay{position:fixed;inset:0;background:rgba(8,22,40,.5);z-index:45;opacity:0;pointer-events:none;transition:opacity .25s}
body.side-open #sideOverlay{opacity:1;pointer-events:auto}
.main-wrap{margin-inline-start:262px;min-height:100vh;display:flex;flex-direction:column}
/* ---------- سربرگ اصلی با تصویر پالایشگاه گاز ---------- */
/* ارتفاع سربرگ مطابق نسبت ابعاد تصویر بنر (۱۹۸۲×۱۸۴) است؛ --hdr-ar در applySettings تنظیم می‌شود */
#topbar{position:sticky;top:0;z-index:40;border-bottom:1px solid rgba(255,255,255,.18);display:flex;align-items:center;gap:12px;padding:10px 22px;min-height:64px;aspect-ratio:var(--hdr-ar,10.77);
  background-image:var(--tb-grad,linear-gradient(90deg,rgba(4,22,46,.94) 0%,rgba(6,28,58,.86) 45%,rgba(9,40,84,.55) 100%)),var(--hdr-strip),linear-gradient(90deg,color-mix(in srgb,var(--primary),#000 62%),var(--primary));
  background-size:cover,cover,cover;background-position:center,center,center;
  box-shadow:0 8px 24px -14px rgba(3,16,32,.6)}
#topbar::after{content:'';position:absolute;inset-inline:0;bottom:-1px;height:2.5px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--gold,#e9b75a) 68%,transparent),transparent);pointer-events:none}
.tb-burger{display:none}
.tb-title{font-weight:800;font-size:15.5px;color:#fff;text-shadow:0 1px 3px rgba(3,14,28,.55)}
.tb-sub{font-size:11px;color:#b9cfe6;text-shadow:0 1px 2px rgba(3,14,28,.5)}
.tb-spacer{flex:1}
.tb-user{display:flex;align-items:center;gap:9px;padding:5px 6px 5px 12px;border-radius:12px;cursor:default}
.avatar{width:37px;height:37px;border-radius:50%;background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--accent),#fff 18%));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0;border:2px solid rgba(255,255,255,.35)}
.tb-user .un{font-size:13px;font-weight:700;line-height:1.4;color:#fff}
.tb-user .ur{font-size:11px;color:#b9cfe6}
#topbar .icon-btn{color:#dce9f6}
#topbar .icon-btn:hover{background:rgba(255,255,255,.14)}
#topbar .avatar img{border-radius:50%}
.notif-wrap{position:relative}
.notif-pop{position:absolute;top:calc(100% + 8px);inset-inline-end:0;width:min(350px,92vw);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);z-index:70;overflow:hidden;animation:ddIn .15s ease}
.notif-head{padding:11px 16px;border-bottom:1px solid var(--line);font-weight:800;font-size:13.5px;display:flex;justify-content:space-between;align-items:center}
.notif-list{max-height:330px;overflow:auto}
.notif-item{display:flex;gap:10px;padding:11px 16px;border-bottom:1px solid #f1f5f9;cursor:pointer;transition:background .12s}
.notif-item:hover{background:#f6faff}
.notif-item:last-child{border-bottom:none}
.notif-item .ni-ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.notif-item .ni-ic svg{width:17px;height:17px}
.notif-item .ni-t{font-size:12.5px;font-weight:600;line-height:1.6}
.notif-item .ni-m{font-size:11px;color:var(--muted)}
.main-content{padding:22px 26px;flex:1;width:100%;max-width:1500px;margin:0 auto}
.app-foot{text-align:center;font-size:11px;color:#94a3b8;padding:14px;border-top:1px solid var(--line);background:#fff}

/* ---------- سربرگ صفحه ---------- */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.page-head h2{font-size:19px;font-weight:800;color:var(--primary);display:flex;align-items:center;gap:9px}
.page-head h2 svg{width:22px;height:22px;color:var(--accent)}
.page-head .ph-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- کارت آماری ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px 17px;display:flex;gap:13px;align-items:center;border:1px solid #eef2f7;transition:transform .15s}
.stat:hover{transform:translateY(-2px)}
.stat .ic{width:47px;height:47px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat .ic svg{width:22px;height:22px}
.stat .v{font-size:18.5px;font-weight:800;line-height:1.5;white-space:nowrap}
.stat .t{font-size:12px;color:var(--muted);font-weight:600}
.stat .s{font-size:10.5px;color:#94a3b8;margin-top:1px}
.ic-blue{background:var(--accent-soft);color:var(--accent)}
.ic-green{background:var(--green-soft);color:var(--green)}
.ic-red{background:var(--red-soft);color:var(--red)}
.ic-amber{background:var(--amber-soft);color:#d97706}
.ic-info{background:var(--info-soft);color:var(--info)}
.ic-violet{background:var(--violet-soft);color:var(--violet)}
.ic-orange{background:var(--orange-soft);color:#ea580c}
.ic-gray{background:#eef2f7;color:#64748b}

/* ---------- پنل ---------- */
.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid #eef2f7;margin-bottom:18px}
.panel-h{padding:13px 18px;border-bottom:1px solid #eef2f7;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel-t{font-weight:800;font-size:14.5px;color:#1e3a5f;display:flex;align-items:center;gap:8px}
.panel-t svg{width:18px;height:18px;color:var(--accent)}
.panel-b{padding:18px}
.panel-b.tight{padding:0}

/* ---------- جدول ---------- */
.tbl-scroll{overflow:auto;max-width:100%}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
.tbl th{background:#f8fafc;color:#52627a;font-weight:700;text-align:right;padding:10px 12px;font-size:12px;border-bottom:1.5px solid var(--line);position:sticky;top:0;z-index:5}
.tbl td{padding:10px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.tbl tbody tr{transition:background .1s}
.tbl tbody tr:hover{background:#f6faff}
.tbl .num{font-weight:700}
.tbl .ttl-cell{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.tbl .act-cell{display:flex;gap:4px}
.th-sort{cursor:pointer;user-select:none}
.th-sort:hover{color:var(--accent)}
.th-sort .arr{display:inline-block;margin-inline-start:4px;font-size:9px;opacity:.5}
.th-sort.asc .arr,.th-sort.desc .arr{opacity:1;color:var(--accent)}
.tbl tfoot td{background:#f8fafc;font-weight:800;border-top:2px solid var(--line)}
.empty{padding:42px 20px;text-align:center;color:var(--muted)}
.empty svg{width:44px;height:44px;opacity:.3;margin-bottom:10px}
.empty .e-t{font-weight:700;font-size:14px;margin-bottom:3px}
.empty .e-s{font-size:12.5px}

/* ---------- صفحه‌بندی ---------- */
.pgn{display:flex;gap:5px;align-items:center;padding:12px 16px;flex-wrap:wrap;justify-content:flex-end}
.pgn button{min-width:33px;height:33px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;color:#475569}
.pgn button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.pgn button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.pgn button:disabled{opacity:.4;cursor:default}
.pgn .pg-info{font-size:12px;color:var(--muted);margin-inline-end:auto}

/* ---------- نوار فیلتر ---------- */
.fbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end}
.fbar .field{margin-bottom:0}

/* ---------- مودال ---------- */
#modalRoot .modal-overlay{position:fixed;inset:0;background:rgba(8,20,35,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;z-index:100;overflow-y:auto;opacity:0;transition:opacity .18s}
#modalRoot .modal-overlay.show{opacity:1}
.modal{width:min(780px,100%);background:#fff;border-radius:18px;box-shadow:var(--shadow-lg);animation:mIn .2s ease;display:flex;flex-direction:column;max-height:92vh;margin-bottom:4vh}
@keyframes mIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.modal.lg{width:min(1060px,100%)}
.modal.sm{width:min(450px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;border-bottom:1px solid var(--line);flex-shrink:0}
.modal-head h3{font-size:15.5px;font-weight:800;color:var(--primary)}
.modal-head h3 svg{width:19px;height:19px;flex-shrink:0}
.modal-body{padding:20px;overflow-y:auto}
.modal-foot{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;flex-shrink:0;background:#fbfcfe;border-radius:0 0 18px 18px}
.confirm-msg{font-size:14px;line-height:2;padding:4px 2px}
.confirm-ic{width:52px;height:52px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center}
.confirm-ic svg{width:26px;height:26px}

/* ---------- Toast ---------- */
#toastRoot{position:fixed;bottom:18px;inset-inline-end:18px;z-index:300;display:flex;flex-direction:column;gap:9px;max-width:min(370px,90vw)}
.toast{display:flex;align-items:flex-start;gap:9px;background:#0f172a;color:#fff;padding:12px 15px;border-radius:13px;box-shadow:var(--shadow-lg);animation:tIn .22s ease;font-size:13px;line-height:1.7;cursor:pointer;border-inline-start:4px solid var(--accent)}
.toast svg{width:18px;height:18px;flex-shrink:0;margin-top:2px}
.toast.t-success{border-color:var(--green)}
.toast.t-error{border-color:var(--red)}
.toast.t-warn{border-color:#f59e0b}
.toast.out{opacity:0;transform:translateY(8px);transition:all .3s}
@keyframes tIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- مراحل ویزارد ---------- */
.stepper{display:flex;margin-bottom:22px;overflow-x:auto;padding:4px 2px 10px;gap:0}
.step{flex:1;min-width:118px;text-align:center;position:relative}
.step::before{content:'';position:absolute;top:19px;inset-inline-start:calc(-50% + 19px);width:calc(100% - 38px);height:3px;background:#e2e8f0;border-radius:3px}
.step:first-child::before{display:none}
.step.done::before{background:var(--green)}
.step.active::before{background:var(--accent)}
.step-dot{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#e2e8f0;color:#64748b;font-weight:800;position:relative;z-index:2;border:3px solid var(--bg);transition:all .2s;font-size:13.5px}
.step.done .step-dot{background:var(--green);color:#fff}
.step.active .step-dot{background:var(--primary);color:#fff;transform:scale(1.1);box-shadow:0 0 0 4px rgba(13,59,102,.15)}
.step-title{font-size:11.5px;margin-top:7px;font-weight:700;color:#64748b;line-height:1.5}
.step.active .step-title{color:var(--primary)}
.step.done .step-title{color:var(--green)}
.step-sub{font-size:9.5px;color:#a4b3c6}
.wiz-nav{display:flex;gap:9px;justify-content:space-between;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.wiz-nav .wn-l,.wiz-nav .wn-r{display:flex;gap:9px;flex-wrap:wrap}

/* ---------- شبکه ماه‌های جذب ---------- */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.mcell{border:1.5px solid var(--line);border-radius:12px;padding:9px 10px 11px;background:#fbfdff;transition:border-color .15s}
.mcell:focus-within{border-color:var(--accent);background:#fff}
.mcell .ml{font-size:11.5px;font-weight:800;color:var(--primary);margin-bottom:6px;text-align:center}
.mcell .mhi{font-size:9.5px;color:#94a3b8;text-align:center;display:block}
.mcell input{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;text-align:center;font-weight:600;background:#fff}
.mcell input:focus{outline:none;border-color:var(--accent)}
.sum-bar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;background:#f8fafc;border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:14px}
.sum-bar .sb-item{font-size:13px}
.sum-bar .sb-item b{font-size:14.5px}
.sum-ok{color:var(--green)}
.sum-bad{color:var(--red)}
.warn-box{display:flex;gap:9px;align-items:flex-start;background:var(--amber-soft);border:1.5px solid #f6d9a8;color:#92400e;border-radius:12px;padding:12px 14px;font-size:12.5px;line-height:1.8;margin-top:12px}
.warn-box svg{width:18px;height:18px;flex-shrink:0;margin-top:3px}
.err-box{display:flex;gap:9px;align-items:flex-start;background:var(--red-soft);border:1.5px solid #f5c2c2;color:#991b1b;border-radius:12px;padding:12px 14px;font-size:12.5px;line-height:1.8;margin-top:12px}
.err-box svg{width:18px;height:18px;flex-shrink:0;margin-top:3px}
.ok-box{display:flex;gap:9px;align-items:flex-start;background:var(--green-soft);border:1.5px solid #bbe3c8;color:#166534;border-radius:12px;padding:12px 14px;font-size:12.5px;line-height:1.8;margin-top:12px}
.ok-box svg{width:18px;height:18px;flex-shrink:0;margin-top:3px}

/* ---------- تایم‌لاین تاریخچه ---------- */
.tl{position:relative;padding-inline-start:26px}
.tl::before{content:'';position:absolute;inset-inline-start:8px;top:8px;bottom:8px;width:2px;background:var(--line);border-radius:2px}
.tl-item{position:relative;padding-bottom:19px}
.tl-item:last-child{padding-bottom:4px}
.tl-dot{position:absolute;inset-inline-start:-26px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;border:4.5px solid var(--accent);box-shadow:0 0 0 3px #fff}
.tl-head{font-weight:800;font-size:13px;color:#1e3a5f}
.tl-meta{font-size:11.5px;color:var(--muted);margin-top:1px}
.tl-comment{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:7px;font-size:12.5px;color:#334155;line-height:1.9}
.tl-stage{font-size:11px;color:#64748b;margin-top:3px}
.tl-sig{display:inline-flex;align-items:center;gap:7px;margin-top:6px;background:#fff;border:1px dashed #cbd5e1;border-radius:9px;padding:4px 9px}
.tl-sig img{max-width:110px;max-height:34px;object-fit:contain;display:block}
.tl-sig span{font-size:10px;color:#64748b;font-weight:700}

/* ---------- انتخاب امضا هنگام تأیید ---------- */
.sig-pick{display:flex;gap:10px;flex-wrap:wrap}
.sig-card{position:relative;display:flex;flex-direction:column;gap:6px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;cursor:pointer;min-width:132px;background:#fff;transition:border-color .15s}
.sig-card:hover{border-color:var(--accent)}
.sig-card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.sig-card.dis{opacity:.5;cursor:not-allowed}
.sig-card input{position:absolute;opacity:0;pointer-events:none}
.sig-card .sc-box{width:120px;height:42px;display:flex;align-items:center;justify-content:center;background:#f8fafc;border-radius:7px;overflow:hidden}
.sig-card .sc-box img{max-width:110px;max-height:36px;object-fit:contain}
.sig-card .sc-none{font-size:10.5px;color:#94a3b8;font-weight:700}
.sig-card .sc-l{font-size:11.5px;font-weight:800;color:#1e3a5f}

/* ---------- مدیریت امضای کاربران (مدیریت سایت) ---------- */
.sig-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:13px}
.sig-user{border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;background:#fff}
.sig-user .su-head{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.sig-user .su-n{font-weight:800;font-size:13.5px;color:#1e3a5f}
.sig-user .su-p{font-size:11px;color:var(--muted)}
.sig-user .su-slots{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.sig-slot{border:1px dashed #cbd5e1;border-radius:11px;padding:9px;display:flex;flex-direction:column;gap:7px}
.sig-slot .ssl-l{font-size:11px;font-weight:800;color:var(--primary)}
.sig-slot .ssl-box{height:44px;background:#f8fafc;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.sig-slot .ssl-box img{max-width:100%;max-height:40px;object-fit:contain}
.sig-slot .ssl-none{font-size:10px;color:#94a3b8;font-weight:700}
.sig-slot .ssl-acts{display:flex;gap:5px;flex-wrap:wrap}
@media(max-width:640px){ .sig-user .su-slots{grid-template-columns:1fr} }

/* ---------- انتخاب چندنقشی کاربر ---------- */
.role-checks{display:flex;gap:8px;flex-wrap:wrap}
.rc-item{position:relative;display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);border-radius:10px;padding:7px 11px;cursor:pointer;background:#fff;transition:border-color .15s;font-size:12.5px;font-weight:700;color:#334155}
.rc-item:hover{border-color:var(--accent)}
.rc-item.on{border-color:var(--accent);background:var(--accent-soft);color:var(--primary)}
.rc-item input{position:absolute;opacity:0;pointer-events:none}
.rc-item .rc-box{width:15px;height:15px;border:1.5px solid #cbd5e1;border-radius:4px;display:flex;align-items:center;justify-content:center;background:#fff;color:transparent;flex-shrink:0}
.rc-item .rc-box svg{width:11px;height:11px}
.rc-item.on .rc-box{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- تب‌ها ---------- */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{padding:9px 16px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;background:none;border-top:none;border-inline:none;font-size:13.5px;border-radius:8px 8px 0 0}
.tab:hover{color:var(--primary);background:#f6f9fd}
.tab.active{color:var(--primary);border-bottom-color:var(--accent);background:var(--accent-soft)}

/* ---------- نمودارها ---------- */
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
.chart-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid #eef2f7;padding:16px 18px}
.chart-card h4{font-size:13.5px;font-weight:800;color:#1e3a5f;margin-bottom:4px;display:flex;align-items:center;gap:7px}
.chart-card h4 svg{width:16px;height:16px;color:var(--accent)}
.chart-card .ch-sub{font-size:11px;color:#94a3b8;margin-bottom:12px}
.chart-flex{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.chart-flex canvas{flex:1;min-width:170px}
.legend{display:flex;flex-direction:column;gap:7px;min-width:150px;flex:1}
.lg-item{display:flex;align-items:center;gap:8px;font-size:12px;cursor:default;border-radius:7px;padding:1px 5px;margin:-1px -5px;transition:background .12s}
.lg-item:hover{background:#eef5fd}
.lg-item .lg-c{width:11px;height:11px;border-radius:3.5px;flex-shrink:0}
.lg-item .lg-l{color:#475569;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-item .lg-v{font-weight:700;color:#1e293b;white-space:nowrap}
canvas.ch{width:100%;display:block}
#mainContent canvas{display:block;width:100%}

/* ---------- کارتابل ---------- */
.cart-item{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid #eef2f7;border-radius:14px;box-shadow:var(--shadow);padding:15px 17px;margin-bottom:12px;flex-wrap:wrap}
.cart-item .ci-main{flex:1;min-width:230px}
.cart-item .ci-t{font-weight:800;font-size:14.5px;color:#1e3a5f;cursor:pointer;display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.cart-item .ci-t:hover{color:var(--accent)}
.cart-item .ci-meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.cart-item .ci-meta svg{width:13px;height:13px}
.cart-item .ci-amt{font-weight:800;color:var(--primary)}
.cart-item .ci-actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.cart-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}
.cart-tab{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:8px 13px;font-size:12.5px;font-weight:700;color:#475569;cursor:pointer;transition:all .14s;font-family:inherit}
.cart-tab svg{width:14px;height:14px;color:#94a3b8;flex-shrink:0}
.cart-tab:hover{border-color:var(--accent);color:var(--primary)}
.cart-tab.on{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:var(--shadow)}
.cart-tab.on svg{color:#fff}
.cart-tab .ct-n{background:#eef2f7;color:#475569;border-radius:20px;font-size:11px;font-weight:800;padding:1px 8px;min-width:22px;text-align:center}
.cart-tab.on .ct-n{background:rgba(255,255,255,.22);color:#fff}
.cart-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;margin-bottom:14px}
.cart-tile{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:11px 13px;cursor:pointer;transition:all .14s;font-family:inherit;text-align:right}
.cart-tile:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.cart-tile.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.cart-tile .ct-ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cart-tile .ct-ic svg{width:17px;height:17px}
.cart-tile .ct-v{display:block;font-size:17px;font-weight:800;color:#1e293b;line-height:1.25}
.cart-tile .ct-t{display:block;font-size:11px;color:#64748b;font-weight:700}
.cart-item .ci-wait{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:8px;padding:3px 9px;font-weight:700;font-size:11.5px}
.cart-item .ci-wait-red{background:#fef2f2;border-color:#fecaca;color:#b91c1c}

/* --- کارتابل: انتخاب گروهی، نوار اقدام گروهی، اعلان‌های اخیر --- */
.ci-check{display:flex;align-items:center;padding-top:4px;flex-shrink:0}
.ci-check input{width:17px;height:17px;accent-color:var(--primary);cursor:pointer}
.bulk-bar{position:fixed;bottom:18px;right:50%;transform:translateX(50%);z-index:880;display:none;gap:9px;align-items:center;background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--primary),#000 20%));color:#fff;border-radius:15px;padding:11px 16px;box-shadow:0 14px 36px rgba(10,30,70,.4);flex-wrap:wrap;max-width:min(94vw,780px);animation:bIn .18s ease}
.bulk-bar.on{display:flex}
.bulk-bar .bb-n{font-weight:800;font-size:13px;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.bulk-bar .bb-n svg{width:16px;height:16px}
.bulk-bar .bb-n b{background:rgba(255,255,255,.22);border-radius:20px;padding:2px 11px;font-size:13px}
.bulk-bar .btn-b{background:rgba(255,255,255,.16);color:#fff;font-weight:700;border:1px solid rgba(255,255,255,.15)}
.bulk-bar .btn-b:hover{background:rgba(255,255,255,.3)}
.bulk-bar .btn-b svg{width:14px;height:14px}
@keyframes bIn{from{opacity:0;transform:translateX(50%) translateY(12px)}to{opacity:1;transform:translateX(50%) translateY(0)}}
@keyframes bInM{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
body.bulk-on #mainContent{padding-bottom:104px}
@media(max-width:640px){.bulk-bar{left:10px;right:10px;transform:none;bottom:10px;padding:9px 11px;gap:6px;max-width:none;width:auto;justify-content:center;animation:bInM .18s ease}.bulk-bar .btn{padding:7px 10px;font-size:11.5px}.bulk-bar .bb-n{font-size:12px}}
.notif-mini{display:flex;gap:11px;align-items:flex-start;padding:11px 8px;border-bottom:1px dashed #e8eef5;cursor:pointer;border-radius:10px}
.notif-mini:last-child{border-bottom:none}
.notif-mini:hover{background:#f6f9fc}
.notif-mini.unread{background:#f0f7ff}
.notif-mini .nm-ic{width:33px;height:33px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.notif-mini .nm-ic svg{width:16px;height:16px}
.notif-mini .nm-t{font-size:12.5px;color:#334155;font-weight:600;line-height:1.8}
.notif-mini .nm-m{font-size:11px;color:var(--muted);margin-top:3px}

/* ---------- ورود (پس‌زمینه تصویر پالایشگاه گاز) ---------- */
.login-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background-image:var(--lg-grad,linear-gradient(165deg,rgba(5,24,48,.72) 0%,rgba(7,30,60,.6) 45%,rgba(9,38,76,.55) 100%)),var(--hdr-img),linear-gradient(150deg,color-mix(in srgb,var(--primary),#000 45%) 0%,var(--primary) 50%,color-mix(in srgb,var(--primary),#fff 22%) 100%);
  background-size:cover,cover,cover;background-position:center,center,center;
  background-attachment:fixed,fixed,fixed}
.login-card{width:min(430px,100%);background:#fff;border-radius:22px;box-shadow:var(--shadow-lg);padding:34px 32px 26px;animation:mIn .3s ease}
.login-logo{width:66px;height:66px;border-radius:18px;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 12px 26px -10px color-mix(in srgb,var(--accent) 58%,transparent)}
.lg-welcome{text-align:center;font-size:12.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:7px 12px;margin:0 0 14px;line-height:1.9}
.login-card h1{font-size:18px;font-weight:800;text-align:center;color:var(--primary)}
.login-card .lg-sub{text-align:center;font-size:12px;color:var(--muted);margin:5px 0 22px}
.login-note{font-size:10.5px;color:#94a3b8;text-align:center;margin-top:16px;line-height:1.9}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(6px)}50%{transform:translateX(-6px)}75%{transform:translateX(4px)}}

/* ---------- مرور نهایی / جزئیات ---------- */
.kv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.kv{background:#f8fafc;border:1px solid #eef2f7;border-radius:11px;padding:10px 13px}
.kv .k{font-size:11px;color:#7d8da1;font-weight:600;margin-bottom:2px}
.kv .v{font-size:13px;font-weight:700;color:#1e293b;line-height:1.7;word-break:break-word}
.desc-block{background:#f8fafc;border:1px solid #eef2f7;border-radius:11px;padding:12px 15px;margin-top:10px}
.desc-block .db-l{font-size:11.5px;font-weight:800;color:var(--primary);margin-bottom:4px}
.desc-block .db-v{font-size:13px;color:#334155;line-height:2;white-space:pre-wrap}
.micro-acc{border:1.5px solid var(--line);border-radius:13px;margin-bottom:12px;overflow:hidden;background:#fff}
.micro-acc .ma-head{display:flex;align-items:center;gap:10px;padding:12px 15px;background:#f8fafc;cursor:pointer;flex-wrap:wrap}
.micro-acc .ma-head > svg{width:17px;height:17px;flex-shrink:0;color:#94a3b8;margin-inline-start:auto}
.micro-acc .ma-head:hover{background:#f1f6fc}
.micro-acc .ma-title{font-weight:800;font-size:13.5px;color:#1e3a5f;flex:1;min-width:160px}
.micro-acc .ma-body{border-top:1px solid var(--line);padding:15px}
.mrow-plan{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mrow-plan .mp-cell{background:#f8fafc;border:1px solid #eef2f7;border-radius:9px;padding:7px 10px;text-align:center}
.mrow-plan .mp-cell .k{font-size:10.5px;color:#7d8da1;font-weight:700}
.mrow-plan .mp-cell .v{font-size:12.5px;font-weight:800;color:#1e293b}

/* ---------- چاپ ---------- */
#printRoot{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body.printing>*:not(#printRoot){display:none!important}
  body.printing #printRoot{display:block!important}
  body.printing{background:#fff}
  #printRoot{display:block;font-family:var(--font);color:#111;padding-bottom:18mm}
  .pr-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2.5px solid #0d3b66;padding-bottom:10px;margin-bottom:16px}
  .pr-head h1{font-size:17px;color:#0d3b66}
  .pr-meta{font-size:10.5px;color:#555;text-align:left}
  .pr-doc table{width:100%;border-collapse:collapse;font-size:10.5px;margin-bottom:14px}
  .pr-doc th,.pr-doc td{border:1px solid #94a3b8;padding:5px 7px;text-align:right}
  .pr-doc th{background:#e8f0fa!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pr-doc .pr-sec{font-size:13px;font-weight:800;color:#0d3b66;margin:14px 0 8px;border-inline-start:4px solid #0d3b66;padding-inline-start:8px}
  .pr-doc .pr-note{font-size:10px;color:#666}
  .pr-doc img.pr-sig{max-width:82px;max-height:30px;vertical-align:middle}
  .pr-logo{width:58px;height:58px;max-width:84px;max-height:84px;object-fit:contain;margin-inline-end:12px}
  .pr-org{font-size:11px;color:#555;margin-top:2px}
  .pr-foot{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-between;gap:14px;border-top:1.2px solid #777;padding-top:5px;font-size:9.5px;color:#444;background:#fff}
  .pr-sigrow{display:flex;gap:20px;margin-top:30px;page-break-inside:avoid;break-inside:avoid}
  .pr-sigcell{flex:1;text-align:center;font-size:10.5px;color:#111}
  .pr-sigcell .ln{border-top:1.2px dotted #333;margin-top:40px;padding-top:4px;font-weight:700;color:#333}
}
@media print{ body:not(.printing) #printRoot{display:none} }

/* ---------- واکنش‌گرا ---------- */
@media(max-width:1023px){
  html,body{overflow-x:hidden}
  #sidebar{transform:translateX(100%);box-shadow:var(--shadow-lg)}
  body.side-open #sidebar{transform:translateX(0)}
  .main-wrap{margin-inline-start:0}
  .tb-burger{display:inline-flex}
  .main-content{padding:14px 12px}
  .tb-sub{display:none}
  .tb-user .un,.tb-user .ur{display:none}
  .stat .v{font-size:16px}
}
@media(max-width:640px){
  .stat-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .stat{padding:12px}
  .stat .ic{width:38px;height:38px}
  .stat .ic svg{width:18px;height:18px}
  .stat .v{font-size:14px;white-space:normal}
  .chart-grid{grid-template-columns:1fr}
  .page-head h2{font-size:16px}
  .mgrid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr))}
}
/* ---------- لوگوی تصویری ---------- */
.brand-logo img,.login-logo img{width:100%;height:100%;object-fit:contain;display:block;border-radius:inherit}
.brand-logo.has-img{background:#fff;padding:4px;box-shadow:0 6px 16px -8px rgba(15,40,80,.45)}
.login-logo.has-img{background:#fff;padding:6px}
.logo-prev{width:158px;height:80px;border:1.5px dashed #b6c6d9;border-radius:12px;background:#fff center/contain no-repeat;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.logo-prev img{max-width:136px;max-height:64px;object-fit:contain}
.logo-prev .ph-lg{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:21px}

/* ---------- ظاهر و تم (مدیریت سایت) ---------- */
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:11px}
.theme-card{position:relative;border:2px solid var(--line);border-radius:13px;background:#fff;padding:12px 13px 11px;text-align:right;cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s;display:flex;flex-direction:column;gap:9px}
.theme-card:hover{border-color:#b9d4f3;transform:translateY(-2px)}
.theme-card.active{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.theme-card.active::after{content:'✓';position:absolute;top:9px;inset-inline-start:10px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.tc-name{font-weight:800;font-size:12.5px;color:#1e3a5f}
.tc-dots{display:flex;gap:5px}
.tc-dots span{width:22px;height:22px;border-radius:7px;box-shadow:inset 0 0 0 1px rgba(15,30,60,.12)}
.tc-sb{height:26px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(15,30,60,.12)}
.ap-imgrow{display:flex;gap:15px;align-items:flex-start;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:13px;padding:13px 14px;background:#fbfdff;margin-bottom:12px}
.ap-thumb{width:190px;height:74px;border-radius:10px;border:1.5px solid var(--line);background:#eef2f7 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#94a3b8;flex-shrink:0;overflow:hidden}
.ap-thumb svg{width:24px;height:24px;opacity:.5}
.ap-imgrow .ap-meta{flex:1;min-width:230px}
.ap-imgrow .ap-t{font-weight:800;font-size:13px;color:#1e3a5f;margin-bottom:3px}
.ap-imgrow .ap-d{font-size:11.5px;color:var(--muted);line-height:1.8;margin-bottom:8px}
.ap-state{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:7px;padding:2px 9px;background:#eef2f7;color:#64748b}
.ap-state.def{background:var(--accent-soft);color:var(--accent)}
.ap-state.none{background:#f1f5f9;color:#94a3b8}
.ov-row{display:flex;align-items:center;gap:12px;background:#f8fafc;border:1.5px solid var(--line);border-radius:12px;padding:11px 15px;margin-top:2px;flex-wrap:wrap}
.ov-row > svg{width:20px;height:20px;color:var(--accent);flex-shrink:0}
.ov-row input[type=range]{flex:1;min-width:180px;accent-color:var(--accent);height:5px;cursor:pointer}
.ov-row .ov-val{font-weight:800;font-size:12.5px;color:var(--primary);min-width:44px;text-align:center}
.seg{display:inline-flex;background:#eef2f7;border-radius:11px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;border-radius:9px;padding:6px 16px;font-size:12.5px;font-weight:700;color:#64748b;transition:background .13s,color .13s}
.seg button.on{background:#fff;color:var(--primary);box-shadow:0 1px 4px rgba(15,30,60,.14)}
.ap-reset-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:4px}

/* ---------- اولویت‌بندی AHP ---------- */
.crit-q{font-size:12.5px;font-weight:600;color:#334155;margin:2px 0 9px}
.crit-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.crit-opt{position:relative;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:10px;padding:8px 11px;cursor:pointer;background:#fff;transition:border-color .13s,background .13s;user-select:none}
.crit-opt:hover{border-color:#b9d4f3}
.crit-opt.on{border-color:var(--accent);background:var(--accent-soft)}
.crit-opt input{position:absolute;opacity:0;pointer-events:none}
.co-box{width:17px;height:17px;border:2px solid #cbd5e1;border-radius:5px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:#fff;transition:all .12s}
.crit-opt input[type=radio]+.co-box{border-radius:50%}
.crit-opt.on .co-box{border-color:var(--accent);background:var(--accent)}
.crit-opt.on .co-box::after{content:'';width:9px;height:9px;background:#fff;display:block}
.crit-opt input[type=radio]+.co-box::after{border-radius:50%}
.crit-opt input[type=checkbox]+.co-box::after{border-radius:2.5px}
.co-t{flex:1;font-size:12.5px;font-weight:600;color:#1e293b;line-height:1.6}
.crit-opt.on .co-t{color:var(--primary)}
.co-v{font-size:10.5px;font-weight:800;color:#94a3b8;background:#f1f5f9;border-radius:6px;padding:1px 7px;flex-shrink:0}
.crit-opt.on .co-v{background:#fff;color:var(--accent)}
.ahp-done{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#f8fafc;border:1.5px solid var(--line);border-radius:11px;padding:10px 14px;margin-top:4px}
.mx-tbl{width:100%;border-collapse:collapse;font-size:12px}
.mx-tbl th{background:#f8fafc;color:#52627a;font-weight:700;padding:8px 6px;border:1px solid var(--line);font-size:11px;text-align:center}
.mx-tbl th.mx-crit{min-width:130px;text-align:right;padding-right:10px}
.mx-tbl td{border:1px solid var(--line);padding:4px 6px;text-align:center}
.mx-tbl td.mx-name{text-align:right;font-weight:600;color:#1e3a5f;font-size:11.5px;white-space:nowrap}
.mx-tbl td.mx-diag{background:#f1f5f9;color:#94a3b8;font-weight:800}
.mx-tbl select{width:100%;min-width:74px;border:1px solid var(--line);border-radius:7px;padding:3px 4px;font-size:11.5px;background:#fff;font-family:var(--font);cursor:pointer}
.mx-tbl select:focus{outline:none;border-color:var(--accent)}
.mx-tbl td.mx-w{background:#fbfdff;min-width:120px}
.mx-val{font-weight:800;font-size:12px;color:var(--primary)}
.wt-bar{height:6px;border-radius:4px;background:#e8eef6;margin-top:4px;overflow:hidden}
.wt-bar span{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent),#fff 30%))}
.mx-legend{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.mx-legend .lg-mx{font-size:10.5px;background:#f1f5f9;color:#475569;border-radius:7px;padding:2px 9px;font-weight:600}
.score-bar{height:8px;border-radius:5px;background:#e8eef6;overflow:hidden;min-width:90px}
.score-bar span{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),#22c55e)}
.score-cell{display:flex;align-items:center;gap:8px}
.score-cell .sc-num{font-weight:800;font-size:12.5px;color:var(--primary);min-width:44px}
.rank-badge{width:30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;background:#eef2f7;color:#64748b}
.rank-badge.r1{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff}
.rank-badge.r2{background:linear-gradient(135deg,#cbd5e1,#94a3b8);color:#fff}
.rank-badge.r3{background:linear-gradient(135deg,#d97706,#b45309);color:#fff}
.ahp-parts{margin-top:10px;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.ahp-parts table{width:100%;border-collapse:collapse;font-size:11.5px}
.ahp-parts th{background:#f8fafc;padding:6px 9px;font-weight:700;color:#52627a;border-bottom:1px solid var(--line)}
.ahp-parts td{padding:6px 9px;border-bottom:1px solid #f1f5f9}
.ahp-parts tr:last-child td{border-bottom:none}
.ans-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ans-chips .an-chip{font-size:10.5px;font-weight:600;background:#f1f5f9;color:#475569;border-radius:7px;padding:2.5px 9px}
.ans-chips .an-chip b{color:var(--primary)}
.ahp-crit-card{border:1.5px solid var(--line);border-radius:13px;background:#fff;margin-bottom:12px;overflow:hidden}
.ahp-crit-card.off{opacity:.62;background:#fbfcfe;border-style:dashed}
.ac-head{display:flex;gap:10px;align-items:center;padding:11px 13px;background:#f8fafc;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ac-body{padding:12px 13px}
.ac-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;margin-top:9px}
.ac-opt{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:6px 8px;background:#fbfdff}
.ac-opt input.op-l{flex:1;min-width:0;border:none;background:transparent;font-size:12px;font-weight:600;padding:3px 5px}
.ac-opt input.op-v{width:64px;border:1px solid var(--line);border-radius:7px;padding:3px 5px;font-size:11.5px;text-align:center}
.ac-opt button{border:none;background:none;color:var(--red);cursor:pointer;padding:2px}
.ac-opt button svg{width:14px;height:14px}

/* ---------- ورود گروهی کاربران از اکسل ---------- */
.imp-drop{border:2px dashed #b6c6d9;border-radius:14px;background:#f8fafc;padding:28px 16px;text-align:center;color:var(--muted);cursor:pointer;transition:background .15s,border-color .15s}
.imp-drop:hover,.imp-drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--primary)}
.imp-drop svg{width:30px;height:30px;margin-bottom:8px}
.imp-drop .d-t{font-weight:800;font-size:14px;color:#1e3a5f;margin-bottom:4px}
.imp-drop .d-s{font-size:12px}
.imp-head-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.imp-map{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px 16px;margin:10px 0 6px}
.imp-map .field{margin:0}
.imp-map select.input{padding:7px 10px;font-size:12.5px}
.imp-sums{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
.imp-note{font-size:11.5px;color:var(--muted);line-height:1.9}
.imp-optbox{display:flex;gap:14px;flex-wrap:wrap;align-items:center;background:#f8fafc;border:1px solid #eef2f7;border-radius:12px;padding:10px 14px;margin:12px 0}
.imp-optbox label{display:flex;gap:7px;align-items:center;cursor:pointer;font-size:12.5px;font-weight:600;color:#1e3a5f}
.imp-optbox input[type="checkbox"]{width:16px;height:16px;accent-color:var(--primary)}
.imp-optbox input[type="text"]{width:110px;padding:5px 9px}

/* ---------- عکس پروفایل ---------- */
.avatar img,.u-ava img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.u-ava{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--accent),#fff 18%));color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;overflow:hidden;flex-shrink:0}
.av-tools{display:flex;gap:7px;flex-wrap:wrap}
.bav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:14px}
.bav-item{display:flex;gap:11px;align-items:flex-start;border:1.5px solid var(--line);border-radius:13px;padding:11px;background:#fbfdff}
.bav-item.ok{border-color:#bbe3c8;background:#f7fcf9}
.bav-item.bad{border-color:#f5c2c2;background:#fffafa}
.bav-thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;flex-shrink:0;border:1px solid var(--line);background:#fff}
.bav-meta{flex:1;min-width:0}
.bav-fn{font-size:11px;color:var(--muted);direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bav-meta select.input{padding:6px 9px;font-size:12.5px;margin-top:6px}
.bav-chiprow{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}

/* ---------- اندازه آیکون تب‌ها (رفع بهم‌ریختگی آیکون‌ها) ---------- */
.tab svg{width:17px;height:17px;flex-shrink:0;vertical-align:-3px}

/* ---------- تب‌های کارتی مدیریت سایت ---------- */
.site-nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;margin-bottom:18px}
.site-nav-card{display:flex;flex-direction:column;align-items:flex-start;gap:7px;background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:13px 14px 12px;text-align:right;transition:border-color .15s,transform .15s,box-shadow .15s;box-shadow:var(--shadow)}
.site-nav-card:hover{border-color:#b9d4f3;transform:translateY(-2px)}
.site-nav-card.active{border-color:var(--accent);background:linear-gradient(180deg,#f4f9ff,#fff);box-shadow:0 0 0 3px rgba(31,122,224,.09)}
.snc-ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.snc-ic svg{width:19px;height:19px}
.snc-t{font-weight:800;font-size:13px;color:#1e3a5f;line-height:1.4}
.site-nav-card.active .snc-t{color:var(--accent)}
.snc-s{font-size:10.5px;color:#94a3b8;line-height:1.6}

/* ---------- کلید فعال/غیرفعال ---------- */
.sw{position:relative;width:46px;height:25px;flex-shrink:0;display:inline-block}
.sw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer;z-index:2}
.sw .tr{position:absolute;inset:0;background:#cbd5e1;border-radius:99px;transition:background .18s}
.sw .tr::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(2,20,40,.3);transition:transform .18s}
.sw input:checked + .tr{background:var(--green)}
.sw input:checked + .tr::after{transform:translateX(-21px)}
.sw input:disabled + .tr{opacity:.5;cursor:not-allowed}

/* ---------- کارت‌های بخش‌های سامانه ---------- */
.sec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(305px,1fr));gap:12px}
.sec-card{display:flex;gap:13px;align-items:flex-start;border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:15px 16px;box-shadow:var(--shadow);transition:border-color .15s}
.sec-card.off{background:#fbfcfe;border-style:dashed}
.sec-card .sc-main{flex:1;min-width:0}
.sec-card .sc-t{font-weight:800;font-size:13.5px;color:#1e3a5f;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec-card .sc-s{font-size:11.5px;color:var(--muted);line-height:1.8;margin-top:3px}

/* ---------- آیتم غیرفعال سایدبار (نمای مدیر) ---------- */
.side-item.off{opacity:.62}
.side-item.off .off-chip{margin-inline-start:auto;background:rgba(255,255,255,.16);color:#cfe0f2;font-size:9.5px;font-weight:700;padding:1px 8px;border-radius:99px}

/* ---------- چیدمان گزارشات ---------- */
.rep-layout{display:grid;grid-template-columns:292px minmax(0,1fr);gap:16px;align-items:start}
.rep-side{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px;position:sticky;top:82px;max-height:calc(100vh - 98px);overflow:auto}
.rep-side-h{font-weight:800;font-size:13px;color:#1e3a5f;padding:6px 8px 10px;border-bottom:1px solid var(--line);margin-bottom:6px;display:flex;align-items:center;gap:7px}
.rep-side-h svg{width:16px;height:16px;color:var(--accent)}
.rep-group{font-size:10px;font-weight:800;color:#94a3b8;margin:10px 8px 4px;letter-spacing:.3px}
.rep-item{display:flex;gap:9px;align-items:center;width:100%;padding:8px 9px;border-radius:11px;border:1.5px solid transparent;background:none;text-align:right;transition:background .13s,border-color .13s;margin-bottom:2px}
.rep-item:hover{background:#f6faff}
.rep-item.active{background:var(--accent-soft);border-color:#c9e0f7}
.ri-ic{width:30px;height:30px;border-radius:9px;background:#eef2f7;color:#64748b;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .13s}
.ri-ic svg{width:15px;height:15px}
.rep-item.active .ri-ic{background:var(--accent);color:#fff}
.ri-t{font-size:12.5px;font-weight:700;color:#334155;line-height:1.55;flex:1;min-width:0}
.rep-item.active .ri-t{color:var(--primary)}
.ri-n{font-size:10px;font-weight:800;color:#94a3b8;min-width:18px;text-align:center}
.rep-badge{display:inline-flex;align-items:center;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:800;border-radius:8px;padding:2.5px 10px}
.rep-fmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:#64748b}
.rep-fmeta .fm-chip{background:#f1f5f9;border-radius:7px;padding:2px 9px;font-weight:600}
.rep-chart{border:1.5px solid var(--line);border-radius:13px;padding:14px 16px;background:#fbfdff;margin-bottom:15px}
.rep-chart .rc-t{font-size:12px;font-weight:800;color:#475569;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.rep-chart .rc-t svg{width:14px;height:14px;color:var(--accent)}
@media(max-width:980px){.rep-layout{grid-template-columns:1fr}.rep-layout > *{min-width:0}.rep-side{position:static;max-height:none;min-width:0}}

/* ---------- Tooltip سربرگ (نمایش نام بخش با نگه‌داشتن نشانگر) ---------- */
.tb-tip{position:relative}
.tb-tip::after{content:attr(data-tip);position:absolute;top:calc(100% + 9px);inset-inline-start:50%;transform:translateX(50%);background:#0f172a;color:#fff;font-size:11px;font-weight:600;padding:4px 11px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:95;box-shadow:var(--shadow-lg)}
.tb-tip::before{content:'';position:absolute;top:calc(100% + 3px);inset-inline-start:50%;transform:translateX(50%) rotate(45deg);width:9px;height:9px;background:#0f172a;border-radius:2px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:95}
.tb-tip:hover::after,.tb-tip:hover::before{opacity:1}

/* ---------- Tooltip نمودارها ---------- */

/* ================================================================
   بخش ۱ — ابزارهای عمومی، اعداد فارسی، تقویم شمسی (بدون وابستگی خارجی)
   ================================================================ */
const $  = (s, c) => (c || document).querySelector(s);
const $$ = (s, c) => Array.from((c || document).querySelectorAll(s));
function el(html){ const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function esc(v){ return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function debounce(fn, ms){ let t; return function(){ clearTimeout(t); const a = arguments, s = this; t = setTimeout(() => fn.apply(s, a), ms); }; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function uid(){ return 'id-' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); }
function pad2(n){ return String(n).padStart(2, '0'); }

/* ---- اعداد فارسی و مبالغ ---- */
const FA_D = '۰۱۲۳۴۵۶۷۸۹';
function toFa(v){ return String(v === null || v === undefined ? '' : v).replace(/[0-9]/g, d => FA_D[+d]); }
function toEn(v){ return String(v === null || v === undefined ? '' : v)
  .replace(/[۰-۹]/g, d => String(FA_D.indexOf(d)))
  .replace(/[٠-٩]/g, d => String('٠١٢٣٤٥٦٧٨٩'.indexOf(d))); }
function fmtDec(x){ return toFa(String(x).replace('.', '٫')); }
function trim1(n){ const r = Math.round(n * 10) / 10; return Number.isInteger(r) ? String(r) : r.toFixed(1); }
function fmtInt(n){
  if (n === null || n === undefined || isNaN(n)) return toFa(0);
  n = Math.round(Number(n));
  const neg = n < 0, s = String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '٬');
  return (neg ? '-' : '') + toFa(s);
}
function parseMoney(v){
  if (v === null || v === undefined) return null;
  let s = toEn(String(v)).replace(/[٬,،\s\u066C]/g, '').trim();
  if (s === '' || s === '-') return null;
  if (!/^-?\d+(\.\d+)?$/.test(s)) return NaN;
  return Math.round(parseFloat(s));
}
function shortNum(n){
  const a = Math.abs(Number(n) || 0);
  if (a >= 1e9)  return fmtDec(trim1(n / 1e9)) + ' میلیارد';
  if (a >= 1e6)  return fmtDec(trim1(n / 1e6)) + ' میلیون';
  if (a >= 1e3)  return fmtDec(trim1(n / 1e3)) + ' هزار';
  return fmtInt(n);
}
function shortMoney(n){ return shortNum(n) + ' ' + CUR(); }

/* ================================================================
   تقویم شمسی — الگوریتم استاندارد جلالی (معتبر و بدون وابستگی)
   ================================================================ */
function jDiv(a, b){ return ~~(a / b); }
function jMod(a, b){ return a - ~~(a / b) * b; }
function jalCal(jy){
  const breaks = [-61, 9, 38, 199, 426, 686, 756, 818, 1111, 1181, 1210, 1635, 2060, 2097, 2192, 2262, 2324, 2394, 2456, 3178];
  const gy = jy + 621;
  let leapJ = -14, jp = breaks[0], jm, jump = 0, n, i;
  for (i = 1; i < breaks.length; i++){
    jm = breaks[i]; jump = jm - jp;
    if (jy < jm) break;
    leapJ = leapJ + jDiv(jump, 33) * 8 + jDiv(jMod(jump, 33), 4);
    jp = jm;
  }
  n = jy - jp;
  leapJ = leapJ + jDiv(n, 33) * 8 + jDiv(jMod(n, 33) + 3, 4);
  if (jMod(jump, 33) === 4 && jump - n === 4) leapJ += 1;
  const leapG = jDiv(gy, 4) - jDiv((jDiv(gy, 100) + 1) * 3, 4) - 150;
  const march = 20 + leapJ - leapG;
  if (jump - n < 6) n = n - jump + jDiv(jump + 4, 33) * 33;
  let leap = jMod(jMod(n + 1, 33) - 1, 4);
  if (leap === -1) leap = 4;
  return { leap, gy, march };
}
function g2d(gy, gm, gd){
  let d = jDiv((gy + jDiv(gm - 8, 6) + 100100) * 1461, 4)
        + jDiv(153 * jMod(gm + 9, 12) + 2, 5) + gd - 34840408;
  d = d - jDiv(jDiv(gy + 100100 + jDiv(gm - 8, 6), 100) * 3, 4) + 752;
  return d;
}
function d2g(jdn){
  let j = 4 * jdn + 139361631;
  j = j + jDiv(jDiv(4 * jdn + 183187720, 146097) * 3, 4) * 4 - 3908;
  const i = jDiv(jMod(j, 1461), 4) * 5 + 308;
  const gd = jDiv(jMod(i, 153), 5) + 1;
  const gm = jMod(jDiv(i, 153), 12) + 1;
  const gy = jDiv(j, 1461) - 100100 + jDiv(8 - gm, 6);
  return { gy, gm, gd };
}
function j2d(jy, jm, jd){
  const r = jalCal(jy);
  return g2d(r.gy, 3, r.march) + (jm - 1) * 31 - jDiv(jm, 7) * (jm - 7) + jd - 1;
}
function d2j(jdn){
  const gy = d2g(jdn).gy;
  let jy = gy - 621;
  const r = jalCal(jy);
  const jdn1f = g2d(gy, 3, r.march);
  let jd, jm, k = jdn - jdn1f;
  if (k >= 0){
    if (k <= 185){ jm = 1 + jDiv(k, 31); jd = jMod(k, 31) + 1; return { jy, jm, jd }; }
    k -= 186;
  } else { jy -= 1; k += 179; if (r.leap === 1) k += 1; }
  jm = 7 + jDiv(k, 30); jd = jMod(k, 30) + 1;
  return { jy, jm, jd };
}
function isLeapJ(jy){ return jalCal(jy).leap === 0; }
function jMonthLen(jy, jm){ if (jm <= 6) return 31; if (jm <= 11) return 30; return isLeapJ(jy) ? 30 : 29; }

function jToGDate(jy, jm, jd){ const g = d2g(j2d(jy, jm, jd)); return new Date(g.gy, g.gm - 1, g.gd); }

const J_MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];

function fmtJ(o){ return o ? toFa(o.jy + '/' + pad2(o.jm) + '/' + pad2(o.jd)) : '—'; }

function jStr(o){ return o.jy + '/' + pad2(o.jm) + '/' + pad2(o.jd); }
function todayJStr(){ return jStr(todayJ()); }
function parseJ(str){
  if (!str) return null;
  const s = toEn(str).trim().replace(/[-.]/g, '/');
  const m = s.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);
  if (!m) return null;
  const jy = +m[1], jm = +m[2], jd = +m[3];
  if (jm < 1 || jm > 12) return null;
  if (jd < 1 || jd > jMonthLen(jy, jm)) return null;
  return { jy, jm, jd };
}
function parseYM(str){
  if (!str) return null;
  const s = toEn(str).trim().replace(/[-.]/g, '/');
  const m = s.match(/^(\d{4})\/(\d{1,2})$/);
  if (!m) return null;
  const y = +m[1], mo = +m[2];
  if (mo < 1 || mo > 12) return null;
  return { y, m: mo };
}
function ymStr(o){ return o.y + '/' + pad2(o.m); }
function monthKey(y, m){ return y + '-' + pad2(m); }
function monthLabel(y, m){ return J_MONTHS[m - 1] + ' ' + toFa(y); }
function cmpYM(a, b){ return (a.y - b.y) * 12 + (a.m - b.m); }
function monthRange(a, b){
  const out = []; let y = a.y, m = a.m, guard = 0;
  while ((y < b.y || (y === b.y && m <= b.m)) && guard < 1200){ out.push({ y, m }); m++; if (m > 12){ m = 1; y++; } guard++; }
  return out;
}
function fmtDT(dateStr, timeStr){ return fmtJStr(dateStr) + (timeStr ? ' ساعت ' + toFa(timeStr) : ''); }

/* ---- هش ساده نمایشی برای رمز عبور (فقط نسخه نمایشی — امنیت واقعی نیست) ---- */
function hashStr(str, seed){
  seed = seed || 7;
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed, i, ch;
  str = String(str);
  for (i = 0; i < str.length; i++){
    ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
}

/* ---------------- سیستم مودال (پشته‌ای، Escape، فوکوس) ---------------- */
const modalStack = [];
function openModal(cfg){
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  const size = cfg.size ? ' ' + cfg.size : '';
  let footHTML = '';
  if (cfg.footerButtons){
    footHTML = '<div class="modal-foot">' + cfg.footerButtons.map((b, i) =>
      '<button type="button" class="btn ' + (b.cls || 'btn-ghost') + '" data-mbtn="' + i + '">' + (b.icon || '') + '<span>' + esc(b.label) + '</span></button>'
    ).join('') + '</div>';
  } else if (cfg.footer !== false){
    footHTML = '<div class="modal-foot"><button type="button" class="btn btn-ghost" data-mclose>بستن</button></div>';
  }
  ov.innerHTML = '<div class="modal' + size + '" role="dialog" aria-modal="true">' +
    '<div class="modal-head"><h3>' + (cfg.icon ? '<span style="display:inline-flex;vertical-align:-4px;margin-inline-end:6px">' + cfg.icon + '</span>' : '') + esc(cfg.title || '') + '</h3>' +
    '<button type="button" class="icon-btn" data-mclose aria-label="بستن">' + I.x + '</button></div>' +
    '<div class="modal-body"></div>' + footHTML + '</div>';
  $('#modalRoot').appendChild(ov);
  const entry = { ov, cfg, lastFocus: document.activeElement, resolved: false };
  modalStack.push(entry);
  const body = $('.modal-body', ov);
  if (typeof cfg.body === 'string') body.innerHTML = cfg.body;
  else if (cfg.body) body.appendChild(cfg.body);
  if (cfg.footerButtons){
    cfg.footerButtons.forEach((b, i) => {
      $('[data-mbtn="' + i + '"]', ov).addEventListener('click', () => b.onClick && b.onClick());
    });
  }
  $$('[data-mclose]', ov).forEach(x => x.addEventListener('click', () => requestCloseModal()));
  ov.addEventListener('mousedown', e => { if (e.target === ov) requestCloseModal(); });
  cfg.onMount && cfg.onMount(body, ov);
  requestAnimationFrame(() => ov.classList.add('show'));
  setTimeout(() => {
    const f = $('input,select,textarea,button.btn', body) || $('[data-mclose]', ov);
    f && f.focus && f.focus({ preventScroll: true });
  }, 60);
  return ov;
}
function requestCloseModal(force){
  const top = modalStack[modalStack.length - 1];
  if (!top) return;
  if (!force && typeof top.cfg.dirty === 'function' && top.cfg.dirty()){
    confirmDlg({
      title: 'تغییرات ذخیره‌نشده', danger: true, okLabel: 'بستن بدون ذخیره',
      msg: 'شما تغییرات ذخیره‌نشده‌ای دارید. آیا مطمئنید که می‌خواهید بدون ذخیره ببندید؟'
    }).then(ok => { if (ok){ top.cfg.onDiscard && top.cfg.onDiscard(); closeTopModal(true); } });
    return;
  }
  closeTopModal(true);
}
function closeTopModal(force){
  const top = modalStack.pop();
  if (!top) return;
  top.resolved = true;
  top.ov.classList.remove('show');
  setTimeout(() => top.ov.remove(), 190);
  top.cfg.onClose && top.cfg.onClose();
  if (top.lastFocus && top.lastFocus.focus) try { top.lastFocus.focus({ preventScroll: true }); } catch (e) {}
}
function closeAllModals(){ while (modalStack.length) closeTopModal(true); }
function confirmDlg(c){
  return new Promise(res => {
    let done = false;
    const finish = v => { if (!done){ done = true; res(v); } };
    const ic = '<div class="confirm-ic" style="background:' + (c.danger ? 'var(--red-soft)' : 'var(--accent-soft)') + ';color:' + (c.danger ? 'var(--red)' : 'var(--accent)') + '">' + (c.danger ? I.alert : I.help) + '</div>';
    openModal({
      title: c.title || 'تأیید عملیات', size: 'sm',
      body: ic + '<p class="confirm-msg" style="text-align:center">' + c.msg + '</p>',
      footerButtons: [
        { label: c.okLabel || 'تأیید', cls: c.danger ? 'btn-danger' : 'btn-primary', icon: c.okIcon || I.check, onClick: () => { finish(true); closeTopModal(true); } },
        { label: c.cancelLabel || 'انصراف', cls: 'btn-ghost', onClick: () => { finish(false); closeTopModal(true); } }
      ],
      onClose: () => finish(false)
    });
  });
}

/* ---------------- Dropdown سفارشی (باز/بسته شدن، جستجو، کیبورد) ---------------- */
let openDD = null;
function closeOpenDD(){ if (openDD){ openDD.classList.remove('open'); const m = $('.dd-menu', openDD); m && m.classList.add('hidden'); openDD = null; } }
function makeDD(root, cfg){
  root.classList.add('dd');
  root.innerHTML = '<button type="button" class="dd-btn"' + (cfg.disabled ? ' disabled' : '') + '><span class="dd-label ph">' + esc(cfg.placeholder || 'انتخاب کنید...') + '</span>' + I.chevD.replace('<svg', '<svg class="dd-caret"') + '</button>' +
    '<div class="dd-menu hidden"><div class="dd-search hidden"><input type="text" placeholder="جستجوی گزینه..."></div><div class="dd-list" role="listbox"></div></div>';
  const st = { value: cfg.value !== undefined && cfg.value !== null ? cfg.value : '', options: (cfg.options || []).slice(), disabled: !!cfg.disabled, hovIdx: -1 };
  const btn = $('.dd-btn', root), menu = $('.dd-menu', root), list = $('.dd-list', root), searchWrap = $('.dd-search', root), search = $('input', searchWrap), label = $('.dd-label', root);
  function filtered(q){
    if (!q) return st.options;
    q = toEn(q).trim().toLowerCase();
    return st.options.filter(o => String(o.label).toLowerCase().indexOf(q) !== -1 || String(toFa(o.label)).indexOf(q) !== -1);
  }
  function renderList(){
    const q = search.value;
    const items = filtered(q);
    if (!st.options.length){ list.innerHTML = '<div class="dd-empty">گزینه‌ای تعریف نشده است</div>'; return; }
    if (!items.length){ list.innerHTML = '<div class="dd-empty">موردی یافت نشد</div>'; return; }
    list.innerHTML = items.map(o =>
      '<div class="dd-item' + (String(o.v) === String(st.value) ? ' sel' : '') + '" data-v="' + esc(o.v) + '" role="option">' +
      '<span>' + esc(o.label) + '</span>' + (String(o.v) === String(st.value) ? I.check : '') + '</div>').join('');
  }
  function updateLabel(){
    const cur = st.options.find(o => String(o.v) === String(st.value));
    if (cur){ label.textContent = cur.label; label.classList.remove('ph'); }
    else { label.textContent = cfg.placeholder || 'انتخاب کنید...'; label.classList.add('ph'); }
  }
  function setOpen(v){
    if (st.disabled) return;
    if (v){
      if (openDD && openDD !== root) closeOpenDD();
      openDD = root; root.classList.add('open'); menu.classList.remove('hidden');
      if (st.options.length > 7){ searchWrap.classList.remove('hidden'); search.value = ''; } else searchWrap.classList.add('hidden');
      st.hovIdx = -1; renderList();
      const sel = $('.dd-item.sel', list);
      if (sel) sel.scrollIntoView({ block: 'nearest' });
    } else closeOpenDD();
  }
  btn.addEventListener('click', () => { if (openDD === root) closeOpenDD(); else setOpen(true); });
  btn.addEventListener('keydown', e => {
    if (st.disabled) return;
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown'){ e.preventDefault(); setOpen(true); }
  });
  search.addEventListener('input', () => { st.hovIdx = -1; renderList(); });
  search.addEventListener('keydown', e => {
    const items = $$('.dd-item', list);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault();
      if (!items.length) return;
      st.hovIdx = e.key === 'ArrowDown' ? Math.min(st.hovIdx + 1, items.length - 1) : Math.max(st.hovIdx - 1, 0);
      items.forEach((it, i) => it.classList.toggle('hov', i === st.hovIdx));
      items[st.hovIdx].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter'){
      e.preventDefault();
      if (st.hovIdx >= 0 && items[st.hovIdx]) items[st.hovIdx].click();
      else if (items.length === 1) items[0].click();
    } else if (e.key === 'Escape'){ e.stopPropagation(); closeOpenDD(); }
  });
  list.addEventListener('click', e => {
    const it = e.target.closest('.dd-item');
    if (!it) return;
    api.set(it.getAttribute('data-v'), true);
    closeOpenDD();
  });
  const api = {
    root,
    get value(){ return st.value; },
    get text(){ const c = st.options.find(o => String(o.v) === String(st.value)); return c ? c.label : ''; },
    set(v, fire){
      st.value = v === null ? '' : String(v);
      updateLabel();
      if (fire && cfg.onChange) cfg.onChange(st.value);
    },
    setOptions(opts, keepValue){
      st.options = (opts || []).slice();
      if (!keepValue && !st.options.find(o => String(o.v) === String(st.value))) st.value = '';
      renderList(); updateLabel();
    },
    setPlaceholder(t){ cfg.placeholder = t || 'انتخاب کنید...'; updateLabel(); },
    disable(b){ st.disabled = !!b; btn.disabled = st.disabled; }
  };
  api.set(st.value, false);
  renderList();
  return api;
}

/* ---------------- DatePicker شمسی ---------------- */
let openDP = null;
function closeDP(){ if (openDP){ openDP.pop.remove(); openDP = null; } }
function attachDP(input, cfg){
  cfg = cfg || {};
  const wrap = input.closest('.dp-wrap') || input.parentElement;
  if (!wrap.classList.contains('dp-wrap')){ wrap.classList.add('dp-wrap'); }
  let st = { y: null, m: null };
  function initial(){
    const p = parseJ(input.value);
    if (p) return { y: p.jy, m: p.jm };
    const t = todayJ();
    return { y: t.jy, m: t.jm };
  }
  function render(){
    if (!st.y){ Object.assign(st, initial()); }
    const firstDow = (jToGDate(st.y, st.m, 1).getDay() + 1) % 7; // شنبه = ۰
    const len = jMonthLen(st.y, st.m);
    const sel = parseJ(input.value);
    const tj = todayJ();
    let cells = '';
    for (let i = 0; i < firstDow; i++) cells += '<button type="button" class="dp-day empty" tabindex="-1"></button>';
    for (let d = 1; d <= len; d++){
      const isSel = sel && sel.jy === st.y && sel.jm === st.m && sel.jd === d;
      const isToday = tj.jy === st.y && tj.jm === st.m && tj.jd === d;
      cells += '<button type="button" class="dp-day' + (isSel ? ' sel' : '') + (isToday && !isSel ? ' today' : '') + '" data-d="' + d + '">' + toFa(d) + '</button>';
    }
    openDP.pop.innerHTML =
      '<div class="dp-head">' +
      '<div class="dp-navgrp"><button type="button" class="dp-nav" data-nav="py" title="سال قبل">' + I.chevR + '</button><button type="button" class="dp-nav" data-nav="pm" title="ماه قبل">' + I.chevR + '</button></div>' +
      '<div class="dp-title">' + J_MONTHS[st.m - 1] + ' ' + toFa(st.y) + '</div>' +
      '<div class="dp-navgrp"><button type="button" class="dp-nav" data-nav="nm" title="ماه بعد">' + I.chevL + '</button><button type="button" class="dp-nav" data-nav="ny" title="سال بعد">' + I.chevL + '</button></div>' +
      '</div>' +
      '<div class="dp-wk">' + J_WEEK.map(w => '<span>' + w + '</span>').join('') + '</div>' +
      '<div class="dp-grid">' + cells + '</div>' +
      '<div class="dp-foot"><button type="button" data-act="today">امروز</button><button type="button" data-act="clear">پاک کردن</button></div>';
  }
  function open(){
    closeDP();
    st = initial();
    const pop = document.createElement('div');
    pop.className = 'dp-pop';
    wrap.appendChild(pop);
    openDP = { pop, input, cfg };
    render();
    pop.addEventListener('click', e => {
      const day = e.target.closest('.dp-day[data-d]');
      if (day){
        const v = st.y + '/' + pad2(st.m) + '/' + pad2(+day.getAttribute('data-d'));
        input.value = fmtJ(parseJ(v));
        input.dispatchEvent(new Event('change', { bubbles: true }));
        input.dispatchEvent(new Event('input', { bubbles: true }));
        closeDP();
        return;
      }
      const nav = e.target.closest('[data-nav]');
      if (nav){
        const n = nav.getAttribute('data-nav');
        if (n === 'pm'){ st.m--; if (st.m < 1){ st.m = 12; st.y--; } }
        if (n === 'nm'){ st.m++; if (st.m > 12){ st.m = 1; st.y++; } }
        if (n === 'py') st.y--;
        if (n === 'ny') st.y++;
        render(); return;
      }
      const act = e.target.closest('[data-act]');
      if (act){
        const a = act.getAttribute('data-act');
        if (a === 'today'){ const t = todayJ(); input.value = fmtJ(t); input.dispatchEvent(new Event('change', { bubbles: true })); closeDP(); }
        if (a === 'clear'){ input.value = ''; input.dispatchEvent(new Event('change', { bubbles: true })); closeDP(); }
      }
    });
  }
  input.readOnly = false;
  input.setAttribute('autocomplete', 'off');
  input.addEventListener('focus', () => { if (!openDP || openDP.input !== input) open(); });
  input.addEventListener('click', () => { if (!openDP || openDP.input !== input) open(); });
  input.addEventListener('input', () => {
    const p = parseJ(input.value);
    input.classList.toggle('err-input', !!(input.value && !p));
  });
}

    const upd = () => {
      const rem = max - t.value.length;
      c.textContent = toFa(Math.max(rem, 0)) + ' کاراکتر باقی‌مانده';
      c.classList.toggle('low', rem < max * 0.15);
      if (rem < 0) c.textContent = toFa(-rem) + ' کاراکتر بیش از حد مجاز!';
    };
    t.addEventListener('input', upd);
    upd();
  });
}

/* ---------------- ورودی مبلغ (فرمت خودکار) ---------------- */
function bindMoneyInputs(ctx, onChange){
  $$('.money-in', ctx).forEach(inp => {
    inp.setAttribute('inputmode', 'numeric');
    inp.setAttribute('autocomplete', 'off');
    inp.addEventListener('input', () => { if (onChange) onChange(inp); });
    inp.addEventListener('blur', () => {
      const v = parseMoney(inp.value);
      if (v === null) inp.value = '';
      else if (!isNaN(v)) inp.value = fmtInt(Math.max(v, 0));
    });
  });
}

/* ---------------- CSV و چاپ ---------------- */
function exportCSV(name, headers, rows){
  const q = c => { c = String(c === null || c === undefined ? '' : c); return /[",\n\r]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; };
  const lines = [headers, ...rows].map(r => r.map(q).join(','));
  const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('فایل «' + name + '» دانلود شد', 'success');
}
function downloadJSON(name, obj){
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

function printDef(){
  return {
    logoMode: 'site', logo: '', orgTitle: '',
    showDate: true, showTime: true, showUser: false,
    footerText: 'چاپ‌شده از سامانه مدیریت بودجه سرمایه‌ای (نسخه نمایشی محلی)', footAll: true,
    paper: 'A4', orient: 'portrait', margin: 12,
