/* ---------- مرحله ۳ مودال: معیارهای اولویت‌بندی AHP ---------- */
function mmEnsureAhp(){
  if (!mm.data.ahp || typeof mm.data.ahp !== 'object')
    mm.data.ahp = { answers: {}, status: 'pending', score: null, rank: null, by: '', byId: '', date: '', time: '', comment: '' };
  if (!mm.data.ahp.answers || typeof mm.data.ahp.answers !== 'object') mm.data.ahp.answers = {};
  return mm.data.ahp;
}
function ahpAnswerLabel(c, a){
  if (c.type === 'checkbox'){
    if (!Array.isArray(a) || !a.length) return '—';
    const labs = a.map(v => { const o = (c.opts || []).find(x => Math.abs(x.val - v) < 1e-9); return o ? o.label : toFa(v); });
    return labs.join(' + ');
  }
  const o = (c.opts || []).find(x => Math.abs(x.val - (+a)) < 1e-9);
  return o ? o.label : (a === undefined || a === '' ? '—' : toFa(a));
}
function renderMMStep3(root){
  const a = mmEnsureAhp();
  const crits = ahpCritCfg();
  let h =
    '<div class="ok-box" style="margin:0 0 14px">' + I.flag + '<span>پاسخ‌های این بخش ورودی <b>اولویت‌بندی بودجه</b> هستند و در بخش «اولویت‌بندی بودجه» با وزن معیارها ترکیب و رتبه‌بندی می‌شوند. تکمیل <b>همه معیارها</b> برای ورود ریزتقاضا به رتبه‌بندی ضروری است. امتیاز هر گزینه (درصد اثر) کنار آن نمایش داده می‌شود.</span></div>';
  crits.forEach(c => {
    h += '<fieldset class="frm-sec" style="margin-bottom:14px"><legend>' + esc(c.title) +
      ' <span class="chip chip-soft" style="margin-inline-start:6px">وزن: ' + fmtDec(trim1(c.w)) + '٪</span></legend>' +
      '<div class="crit-q">' + esc(c.q || '') + '</div>';
    if (c.type === 'dropdown'){
      h += '<div id="ahpdd-' + c.key + '" style="max-width:330px"></div>';
    } else {
      h += '<div class="crit-opts">' + (c.opts || []).map(o => {
        const checked = c.type === 'checkbox'
          ? (Array.isArray(a.answers[c.key]) && a.answers[c.key].some(v => Math.abs(v - o.val) < 1e-9))
          : (+a.answers[c.key] === o.val);
        return '<label class="crit-opt' + (checked ? ' on' : '') + '">' +
          '<input type="' + c.type + '" name="ahp-' + c.key + '" data-ck="' + c.key + '" data-val="' + o.val + '"' + (checked ? ' checked' : '') + (mm.readonly ? ' disabled' : '') + '>' +
          '<span class="co-box"></span><span class="co-t">' + esc(o.label) + '</span><span class="co-v">' + fmtDec(trim1(o.val * 100)) + '٪</span></label>';
      }).join('') + '</div>';
    }
    h += '</fieldset>';
  });
  h += '<div class="ahp-done" id="ahpDone"></div>';
  root.innerHTML = h;
  crits.filter(c => c.type === 'dropdown').forEach(c => {
    const cur = a.answers[c.key];
    mm.dd['ahp-' + c.key] = makeDD($('#ahpdd-' + c.key), {
      options: (c.opts || []).map(o => ({ v: String(o.val), label: o.label + ' (' + fmtDec(trim1(o.val * 100)) + '٪)' })),
      value: (cur === undefined || cur === '' || Array.isArray(cur)) ? '' : String(cur),
      placeholder: 'انتخاب کنید', disabled: mm.readonly,
      onChange: v => { a.answers[c.key] = v === '' ? undefined : +v; mm.dirty = true; ahpDoneBar(); }
    });
  });
  $$('[data-ck]', root).forEach(inp => inp.addEventListener('change', () => {
    const k = inp.getAttribute('data-ck'), v = +inp.getAttribute('data-val');
    const c = crits.find(x => x.key === k);
    if (c.type === 'checkbox'){
      const cur = Array.isArray(a.answers[k]) ? a.answers[k].slice() : [];
      const i = cur.findIndex(x => Math.abs(x - v) < 1e-9);
      if (inp.checked && i === -1) cur.push(v);
      if (!inp.checked && i > -1) cur.splice(i, 1);
      a.answers[k] = cur;
    } else {
      a.answers[k] = v;
    }
    mm.dirty = true;
    $$('[data-ck="' + k + '"]', root).forEach(x => x.closest('.crit-opt').classList.toggle('on', x.checked));
    ahpDoneBar();
  }));
  ahpDoneBar();
}
function ahpDoneBar(){
  const holder = $('#ahpDone'); if (!holder) return;
  const st = ahpScoreMicro(mm.data);
  const total = st.total;
  let inner = '<span style="font-weight:800;font-size:12.5px;color:var(--primary)">تکمیل معیارها:</span>' +
    '<span class="chip ' + (st.complete ? 'st-green' : 'st-amber') + '">' + toFa(st.answered) + ' از ' + toFa(total) + ' معیار</span>';
  if (st.complete){
    inner += '<span style="font-size:12px;color:#334155">نمره اولیه اولویت‌بندی: <b>' + fmtDec(trim1(st.score * 100)) + ' از ۱۰۰</b></span><span class="chip st-info">قابل ورود به رتبه‌بندی</span>';
  } else {
    inner += '<span style="font-size:11.5px;color:#92400e">برای محاسبه نمره و ورود به رتبه‌بندی، همه معیارها را تکمیل کنید.</span>';
  }
  holder.innerHTML = inner;
}

/* ---------- مرحله ۴ مودال: جذب ماهانه ---------- */
function mmMonths(){
  const a = parseJ(mm.data.start), b = parseJ(mm.data.end);
  if (!a || !b || cmpYM({ y: b.jy, m: b.jm }, { y: a.jy, m: a.jm }) < 0) return null;
  return monthRange({ y: a.jy, m: a.jm }, { y: b.jy, m: b.jm });
}
function renderMMStep4(root){
  const d = mm.data;
  root.innerHTML =
    '<div class="form-grid">' +
    fieldHTML('m-start', 'پیش‌بینی شروع جذب بودجه', true, '<input class="input" id="mmStart" value="' + esc(d.start ? toFa(d.start) : '') + '" placeholder="۱۴۰۵/۰۳/۰۱" autocomplete="off">', 'ماه شروع در محاسبه لحاظ می‌شود') +
    fieldHTML('m-end', 'پیش‌بینی پایان جذب بودجه', true, '<input class="input" id="mmEnd" value="' + esc(d.end ? toFa(d.end) : '') + '" placeholder="۱۴۰۶/۰۶/۳۱" autocomplete="off">', 'ماه پایان در محاسبه لحاظ می‌شود') +
    '</div><div id="mmGridArea"></div>';
  attachDP($('#mmStart'));
  attachDP($('#mmEnd'));
  $('#mmStart').addEventListener('change', mmDatesChanged);
  $('#mmEnd').addEventListener('change', mmDatesChanged);
  mmRenderGrid();
}
function mmDatesChanged(){
  const d = mm.data;
  const s = $('#mmStart').value.trim(), e = $('#mmEnd').value.trim();
  const a = parseJ(s), b = parseJ(e);
  setFieldError($('#mmBody'), 'm-start', s && !a ? 'تاریخ شروع معتبر نیست' : '');
  setFieldError($('#mmBody'), 'm-end', e && !b ? 'تاریخ پایان معتبر نیست' : '');
  if (!a || !b) return;
  if (cmpYM({ y: b.jy, m: b.jm }, { y: a.jy, m: a.jm }) < 0){
    setFieldError($('#mmBody'), 'm-end', 'پایان جذب نمی‌تواند قبل از شروع جذب باشد');
    return;
  }
  const months = monthRange({ y: a.jy, m: a.jm }, { y: b.jy, m: b.jm });
  if (months.length > (db.settings.maxSpan || 36)){
    setFieldError($('#mmBody'), 'm-end', 'حداکثر بازه جذب ' + toFa(db.settings.maxSpan || 36) + ' ماه مجاز است');
    return;
  }
  const oldPlan = d.plan || {};
  const newPlan = {};
  months.forEach(mo => { newPlan[monthKey(mo.y, mo.m)] = oldPlan[monthKey(mo.y, mo.m)] || 0; });
  const removed = Object.keys(oldPlan).filter(k => !(k in newPlan) && oldPlan[k] > 0);
  const apply = () => { d.start = s; d.end = e; d.plan = newPlan; mm.dirty = true; renderMMStep4($('#mmBody')); mmRenderFooter(); };
  if (removed.length){
    confirmDlg({
      title: 'حذف مقادیر جذب', danger: true, okLabel: 'حذف و ادامه',
      msg: 'با تغییر بازه جذب، مقادیر ثبت‌شده <b>' + toFa(removed.length) + ' ماه</b> حذف می‌شود (مقادیر ماه‌های مشترک حفظ می‌شود). آیا ادامه می‌دهید؟'
    }).then(ok => { if (ok) apply(); else { $('#mmStart').value = mm.prevStart ? toFa(mm.prevStart) : ''; $('#mmEnd').value = mm.prevEnd ? toFa(mm.prevEnd) : ''; } });
  } else apply();
  mm.prevStart = s; mm.prevEnd = e;
}
function mmRenderGrid(){
  const area = $('#mmGridArea'); if (!area) return;
  const d = mm.data;
  const months = mmMonths();
  if (!months || !d.start || !d.end){
    area.innerHTML = '<div class="warn-box" style="margin-top:0">' + I.calendar + '<span>ابتدا تاریخ شروع و پایان جذب معتبر وارد کنید تا ماه‌های بازه به‌صورت خودکار تولید شود.</span></div>';
    return;
  }
  area.innerHTML =
    '<div class="kv-grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin:12px 0">' +
    '<div class="kv"><div class="k">تعداد ماه‌های بازه</div><div class="v">' + toFa(months.length) + ' ماه</div></div>' +
    '<div class="kv"><div class="k">از</div><div class="v">' + esc(monthLabel(months[0].y, months[0].m)) + '</div></div>' +
    '<div class="kv"><div class="k">تا</div><div class="v">' + esc(monthLabel(months[months.length - 1].y, months[months.length - 1].m)) + '</div></div>' +
    '</div>' +
    '<div class="mgrid" id="mmGrid">' + months.map(mo => {

      return '<div class="mcell"><div class="ml">' + esc(monthLabel(mo.y, mo.m)) + '</div>' +
        '<input class="money-in mm-plan" data-k="' + k + '" value="' + (v !== '' && v !== 0 ? fmtInt(v) : (v === 0 ? '۰' : '')) + '" placeholder="۰" ' + (mm.readonly ? 'disabled' : '') + '>' +
        '<span class="mhi">' + esc(CUR()) + '</span></div>';
    }).join('') + '</div>' +
    '<div id="mmSum"></div>';
  $$('.mm-plan', area).forEach(inp => {
    inp.addEventListener('input', () => {
      const v = parseMoney(inp.value);
      mm.data.plan[inp.getAttribute('data-k')] = (v === null || isNaN(v)) ? 0 : Math.max(v, 0);
      mm.dirty = true;
      mmSumBar();
    });

  bindMoneyInputs(area);
  if (mm.readonly) $$('.mm-plan', area).forEach(i => i.disabled = true);

function mmSums(){
  const d = mm.data;
  const plan = Object.values(d.plan || {}).reduce((s, v) => s + (v || 0), 0);
  const amt = parseMoney(d.amount);
  const est = (amt === null || isNaN(amt)) ? null : Math.max(amt, 0);
  return { plan, est, diff: est === null ? null : est - plan };
}
function mmSumBar(){
  const holder = $('#mmSum'); if (!holder) return;
  const { plan, est, diff } = mmSums();
  if (est === null){
    holder.innerHTML = '<div class="sum-bar"><span class="sb-item">جمع مبالغ ماهانه: <b class="sum-ok">' + fmtInt(plan) + ' ' + esc(CUR()) + '</b></span><span class="sb-item" style="color:var(--muted)">مبلغ برآورد هنوز معتبر وارد نشده است</span></div>';
    return;
  }
  let h = '<div class="sum-bar">' +
    '<span class="sb-item">مبلغ برآورد: <b>' + fmtInt(est) + ' ' + esc(CUR()) + '</b></span>' +
    '<span class="sb-item">جمع مبالغ ماهانه: <b>' + fmtInt(plan) + ' ' + esc(CUR()) + '</b></span>' +
    '<span class="sb-item">اختلاف: <b class="' + (diff === 0 ? 'sum-ok' : 'sum-bad') + '">' + fmtInt(diff) + ' ' + esc(CUR()) + '</b></span>' +
    '<span style="flex:1"></span>' +
    (diff === 0 ? '<span class="chip st-green">تطابق کامل</span>' : '<span class="chip st-red">عدم تطابق</span>') +
    '</div>';
  if (diff !== 0){
    h += '<div class="warn-box">' + I.alert + '<span><b>هشدار:</b> جمع مبالغ ماهانه با مبلغ برآورد برابر نیست (اختلاف ' + fmtInt(diff) + ' ' + esc(CUR()) + '). ' +
      (db.settings.policy === 'block'
        ? 'طبق تنظیمات مدیر سایت، برای <b>تأیید نهایی</b> ریزتقاضا تطابق کامل الزامی است؛ پیش‌نویس برنامه را می‌توانید ذخیره کنید.'
        : 'می‌توانید با تأیید صریح، ریزتقاضا را با همین اختلاف ثبت کنید (طبق تنظیمات فعلی: هشدار).') + '</span></div>';
  }
  holder.innerHTML = h;
}

/* ---------- اعتبارسنجی کامل و تأیید ریزتقاضا ---------- */
function mmApprove(){
  const errs = mmValidateAll();
  if (errs.length){
    mm.step = errs.some(e => e.id === 'm-start' || e.id === 'm-end') ? 4 : 1;
    mmRenderAll();
    errs.forEach(e => setFieldError($('#mmBody'), e.id, e.msg));
    toast('لطفاً خطاهای مشخص‌شده را برطرف کنید', 'error');
    return;
  }
  const amt = parseMoney(mm.data.amount);
  if (amt <= 0){ toast('مبلغ برآورد باید بزرگ‌تر از صفر باشد', 'error'); mm.step = 1; mmRenderAll(); setFieldError($('#mmBody'), 'm-amount', 'مبلغ باید بزرگ‌تر از صفر باشد'); return; }
  const { diff } = mmSums();
  const commit = () => {
    mm.data.amount = amt;
    mm.data.approved = true;
    if (!mm.data.id) mm.data.id = nextMicroId();
    if (mm.idx >= 0) wiz.prog.micros[mm.idx] = mm.data;
    else wiz.prog.micros.push(mm.data);
    mm.dirty = false;
    const tSaved = mm.data.title, mId = mm.data.id;
    /* ویرایش مستقیم از صفحه جزئیات یا اولویت‌بندی (مسئول کنترل بودجه / مدیر سایت) */
    if (mm.fromDetail){
      const fromView = mm.fromView;
      const i2 = db.programs.findIndex(x => x.code === mm.fromDetail);
      if (i2 !== -1){
        db.programs[i2] = wiz.prog;
        pushHist(db.programs[i2], 'ویرایش ریزتقاضا (' + mId + ')', '', '', '');
        saveDB(true);
      }
      closeTopModal(true);
      toast('ریزتقاضای «' + tSaved + '» ذخیره شد', 'success');
      /* بازگشت به همان صفحه‌ای که ویرایش از آن آغاز شده بود */
      if (fromView === 'priority'){ prStatsRender(); prTableRender(); }
      else renderProgramDetail();
      return;
    }
    closeTopModal(true);
    toast('ریزتقاضای «' + tSaved + '» تأیید و به برنامه افزوده شد', 'success');
    renderWizStep();
  };
  if (diff !== 0){
    if (db.settings.policy === 'block'){
      toast('طبق تنظیمات، تأیید ریزتقاضا بدون تطابق کامل جمع جذب ماهانه با مبلغ برآورد مجاز نیست', 'error');
      return;
    }
    confirmDlg({
      title: 'ثبت با اختلاف مبلغ', danger: true, okLabel: 'با تأیید صریح ثبت کن',
      msg: 'اختلاف جمع جذب ماهانه با مبلغ برآورد <b>' + fmtInt(diff) + ' ' + esc(CUR()) + '</b> است.<br>آیا با ثبت صریح این ریزتقاضا موافقید؟'
    }).then(ok => { if (ok) commit(); });
  } else commit();
}
function mmRenderStep(){
  const body = $('#mmBody');
  if (mm.step === 1) renderMMStep1(body);
  else if (mm.step === 2) renderMMStep2(body);
  else if (mm.step === 3) renderMMStep3(body);
  else renderMMStep4(body);
  if (mm.readonly){
    $$('#mmBody input, #mmBody textarea', body).forEach(i => { if (i.type !== 'readonly') i.disabled = true; });
    Object.values(mm.dd).forEach(d => d.disable(true));
  }
}

   بخش ۹ — لیست برنامه‌ها (جستجو، فیلتر، مرتب‌سازی، صفحه‌بندی)
   ================================================================ */
let progF = null, progSort = { key: 'submitted', dir: 'desc' }, progPage = 1;
const PROG_PAGE_SIZE = 10;
function progFiltered(){
  const u = curUser();
  if (!progF) progF = { q: '', year: '', mgmt: '', unit: '', applicant: '', committer: '', senior: '', type: '', status: '' };
  let list = visiblePrograms(u);
  const f = progF;
  if (f.q){ const q = toEn(f.q).trim().toLowerCase(); list = list.filter(p => p.title.toLowerCase().indexOf(q) !== -1 || String(p.code).toLowerCase().indexOf(q) !== -1 || toFa(p.code).indexOf(q) !== -1); }
  if (f.year) list = list.filter(p => String(p.year) === String(f.year));
  if (f.mgmt) list = list.filter(p => p.mgmtId === f.mgmt);
  if (f.unit) list = list.filter(p => p.unitId === f.unit);
  if (f.applicant) list = list.filter(p => p.applicantId === f.applicant);
  if (f.committer) list = list.filter(p => p.committerId === f.committer);
  if (f.senior) list = list.filter(p => p.seniorManagerId === f.senior);
  if (f.type) list = list.filter(p => (p.micros || []).some(m => m.typeId === f.type));
  if (f.status) list = list.filter(p => p.status === f.status);
  return list;
}
function progSorted(list){
  const k = progSort.key, d = progSort.dir === 'asc' ? 1 : -1;
  const val = p => {
    switch (k){
      case 'code': return p.code || '';
      case 'title': return p.title;
      case 'year': return p.year;
      case 'mgmt': return mgmtName(p.mgmtId);
      case 'unit': return unitName(p.unitId);
      case 'applicant': return personName(p.applicantId);
      case 'committer': return personName(p.committerId);
      case 'senior': return personName(p.seniorManagerId);
      case 'micros': return (p.micros || []).length;
      case 'est': return progTotals(p).est;
      case 'plan': return progTotals(p).plan;
      case 'status': return p.status;
      default: return (p.submittedAt || p.createdAt || '');
    }
  };
  return list.slice().sort((a, b) => {
    const va = val(a), vb = val(b);
    if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * d;
    return String(va).localeCompare(String(vb), 'fa') * d;
  });
}

    th('applicant', 'متقاضی') + th('committer', 'متعهد') + th('senior', 'مدیر ارشد') + th('micros', 'ریزتقاضاها') +
    th('est', 'مبلغ برآورد') + th('plan', 'جذب برنامه‌ریزی‌شده') + th('status', 'وضعیت گردش کار') + th('submitted', 'تاریخ ثبت') + '<th>عملیات</th>' +
    '</tr></thead><tbody>' + (rows || '') + '</tbody></table></div>' +
    (rows ? '' : emptyState('برنامه‌ای یافت نشد', 'با تغییر فیلترها جستجو کنید یا برنامه جدیدی ثبت نمایید.', I.list)) +

  const mc = $('#mainContent');

      sorted.map(p => { const t = progTotals(p); return [p.code, p.title, p.year, mgmtName(p.mgmtId), unitName(p.unitId), personName(p.applicantId), personName(p.committerId), personName(p.seniorManagerId), listName('budgetHeads', p.budgetHeadId), listName('programTypes', p.programTypeId), t.count, t.est, t.plan, statusLabel(p.status), p.submittedAt || p.createdAt]; }));

  $$('.th-sort', mc).forEach(t => t.addEventListener('click', () => {
    const k = t.getAttribute('data-sk');

function renderProgramsKeepFocus(){

}
function renderPgn(holder, pages){
  if (!holder) return;
  if (pages <= 1){ holder.innerHTML = '<span class="pg-info">مجموع: ' + toFa(progFiltered().length) + ' مورد</span>'; return; }
  let btns = '<button ' + (progPage === 1 ? 'disabled' : '') + ' data-p="prev">قبلی</button>';
  for (let i = 1; i <= pages; i++){
    if (pages > 7 && i > 2 && i < pages - 1 && Math.abs(i - progPage) > 1){
      if (btns.slice(-3) !== '...') btns += '<span class="pg-info">...</span>';
      continue;
    }
    btns += '<button class="' + (i === progPage ? 'on' : '') + '" data-p="' + i + '">' + toFa(i) + '</button>';
  }
  btns += '<button ' + (progPage === pages ? 'disabled' : '') + ' data-p="next">بعدی</button>';
  holder.innerHTML = '<span class="pg-info">صفحه ' + toFa(progPage) + ' از ' + toFa(pages) + ' — مجموع ' + toFa(progFiltered().length) + ' مورد</span>' + btns;
  $$('button[data-p]', holder).forEach(b => b.addEventListener('click', () => {
    const p = b.getAttribute('data-p');
    if (p === 'prev') progPage = Math.max(progPage - 1, 1);
    else if (p === 'next') progPage = Math.min(progPage + 1, pages);
    else progPage = +p;
    renderPrograms();
  }));
}

  if (s === 'approved') return '<span class="chip st-green">' + I.checkC + ' اولویت تأییدشده' + (m.ahp.score !== null && m.ahp.score !== undefined ? ' — ' + fmtDec(trim1(m.ahp.score * 100)) + '٪' : '') + '</span>' + noChip;

      const planSum = keys.reduce((s, k) => s + (m.plan[k] || 0), 0);

        (diff === 0 ? '<span class="chip st-green">تطابق جذب</span>' : '<span class="chip st-red">اختلاف جذب: ' + fmtInt(diff) + '</span>') +
        ahpHeadChip(m) +
        (canMicroEdit ? '<button class="btn btn-ghost btn-sm" data-medit="' + i + '">' + I.edit + ' ویرایش</button>' : '') +

        '<div class="ma-body hidden">' +

        kv('مبلغ برآورد', fmtInt(m.amount) + ' ' + esc(CUR())) +
        kv('تعداد اقلام', m.items ? toFa(m.items) + ' ' + esc(listName('unitsMeas', m.unitId)) : '—') +

        kv('دوره ساخت', esc(listName('periods', m.periodId) || '—')) +

          return '<div class="mp-cell"><div class="k">' + esc(monthLabel(y, mmx)) + '</div><div class="v">' + fmtInt(m.plan[k] || 0) + '</div></div>';
        }).join('') + '</div></div>' +

    }).join('') : emptyState('ریزتقاضایی ثبت نشده است', '', I.list)) +
    '</div></div>';

  /* جمع‌بندی مبالغ */
  html += '<div class="panel"><div class="panel-h"><span class="panel-t">' + I.coins + ' جمع‌بندی مبالغ</span></div><div class="panel-b">' +
    '<div class="kv-grid" style="grid-template-columns:repeat(auto-fill,minmax(190px,1fr))">' +
    kv('مبلغ کل برآورد', fmtInt(t.est) + ' ' + esc(CUR())) +
    kv('مبلغ جذب برنامه‌ریزی‌شده', fmtInt(t.plan) + ' ' + esc(CUR())) +
    kv('اختلاف برآورد و جذب', '<span class="' + (t.diff === 0 ? 'sum-ok' : 'sum-bad') + '">' + fmtInt(t.diff) + '</span> ' + esc(CUR())) +
    kv('مبلغ پیشنهادی کنترل بودجه', p.suggestedAmount ? fmtInt(p.suggestedAmount) + ' ' + esc(CUR()) : 'ثبت نشده') +
    kv('مبلغ تأییدشده', p.approvedAmount ? fmtInt(p.approvedAmount) + ' ' + esc(CUR()) : 'ثبت نشده') +
    '</div></div></div>';

  /* تاریخچه گردش کار */
  html += '<div class="panel"><div class="panel-h"><span class="panel-t">' + I.clock + ' تاریخچه گردش کار</span>' +
    '<span class="chip chip-soft">' + toFa(p.history.length) + ' رویداد</span></div><div class="panel-b">' +
    '<div class="tl">' + p.history.map(hh => {
      const dotColor = (STATUS_META[hh.to] || {}).color || 'var(--accent)';
      const stage = (hh.from && hh.to && hh.from !== hh.to) ? 'انتقال: ' + esc(statusLabel(hh.from)) + ' ← ' + esc(statusLabel(hh.to)) : '';
      return '<div class="tl-item"><div class="tl-dot" style="border-color:' + dotColor + '"></div>' +
        '<div class="tl-head">' + esc(hh.action) + '</div>' +
        '<div class="tl-meta">' + esc(hh.user) + ' — ' + esc(histPosRole(hh)) + ' — ' + fmtDT(hh.date, hh.time) + '</div>' +
        (hh.sig && hh.sig.img ? '<div class="tl-sig"><img src="' + hh.sig.img + '" alt="امضا" style="max-width:110px;max-height:34px;object-fit:contain;display:block"><span>' + esc(sigLabel(hh.sig.kind)) + '</span></div>' : '') +
        (stage ? '<div class="tl-stage">' + stage + '</div>' : '') +
        (hh.comment ? '<div class="tl-comment">' + esc(hh.comment) + '</div>' : '') +
        '</div>';
    }).join('') + '</div></div></div>';

  mc.innerHTML = html;

  $('#dBack').addEventListener('click', () => { state.params = {}; nav(state.lastList || 'programs'); });
  $('#dPrint').addEventListener('click', () => printProgramDetail(p));
  $('#dEdit') && $('#dEdit').addEventListener('click', () => nav('request', { id: p.code }));
  $('#dFix') && $('#dFix').addEventListener('click', () => nav('request', { id: p.code }));
  $$('[data-medit]', mc).forEach(b => b.addEventListener('click', () => editMicroFromDetail(p, +b.getAttribute('data-medit'))));
  $('#dApp') && $('#dApp').addEventListener('click', () => decisionModal(p, act, 'approve'));
  $('#dRej') && $('#dRej').addEventListener('click', () => decisionModal(p, act, 'reject'));
  $('#dRet') && $('#dRet').addEventListener('click', () => decisionModal(p, act, 'return'));
  $('#dCom') && $('#dCom').addEventListener('click', () => decisionModal(p, act, 'comment'));
  $$('[data-tgl]').forEach(hh => hh.addEventListener('click', e => {
    if (e.target.closest('button')) return;
    const body = hh.nextElementSibling;
    body.classList.toggle('hidden');
  }));
}

  wiz = { prog: clone(p), isNew: false, step: 2, dd: {} };
  openMicroModal(idx);
  if (mm) mm.fromDetail = p.code;
  if (mm && fromView) mm.fromView = fromView;
}
function decisionModal(p, role, kind){
  const titles = {
    approve: role === 'committer' ? 'تأیید و ارجاع به مدیر ارشد' : role === 'senior' ? 'تأیید و ارجاع به کنترل بودجه' : 'تأیید بودجه',
    reject: 'رد درخواست', return: 'بازگشت برای اصلاح', comment: 'ثبت توضیح'
  };
  dmBHsel = null; dmPTsel = null; sigPick = null;
  let body = '';
  if (kind === 'approve' && role === 'budget'){
    const t = progTotals(p);
    body =
      '<div class="ok-box" style="margin:0 0 14px">' + I.info + '<span>در زمان تأیید بودجه، <b>سرفصل بودجه</b> و <b>نوع برنامه</b> را از فهرست کشویی انتخاب کنید؛ این مقادیر در جزئیات، گزارش‌ها و خروجی‌ها ثبت می‌شود.</span></div>' +
      fieldHTML('b-bh', 'سرفصل بودجه', true, '<div id="dmBH"></div>', 'گزینه‌ها از «مدیریت سایت ← اطلاعات پایه ← سرفصل‌های بودجه»') +
      fieldHTML('b-pt', 'نوع برنامه', true, '<div id="dmPT"></div>', 'گزینه‌ها از «مدیریت سایت ← اطلاعات پایه ← انواع برنامه»') +
      fieldHTML('b-sug', 'مبلغ پیشنهادی (' + esc(CUR()) + ')', true, '<input class="input money-in" id="dmSug" value="' + (t.suggested || t.est) + '">') +
      fieldHTML('b-app', 'مبلغ تأییدشده (' + esc(CUR()) + ')', true, '<input class="input money-in" id="dmApp" value="' + (t.approved || t.est) + '">', 'مبلغ نهایی مصوب برای این برنامه') +
      fieldHTML('b-com', 'توضیحات کارشناسی', false, '<textarea class="input" data-maxlen="600" rows="3" id="dmCom" placeholder="مبانی تصمیم‌گیری، ملاحظات بودجه..."></textarea>');
  } else if (kind === 'approve'){
    body = '<div class="ok-box" style="margin:0 0 12px">' + I.info + '<span>پس از تأیید، برنامه به مرحله بعدی گردش کار ارجاع می‌شود و در تاریخچه ثبت خواهد شد.</span></div>' +
      fieldHTML('b-com', 'توضیحات (اختیاری)', false, '<textarea class="input" data-maxlen="600" rows="3" id="dmCom" placeholder="نظر شما درباره این برنامه..."></textarea>');
    if (role === 'committer' || role === 'senior'){
      body += '<div class="desc-block" style="margin-top:12px"><div class="db-l">' + I.pen + ' امضای شما برای تأیید</div>' +
        '<div style="font-size:12px;color:var(--muted);margin:4px 0 8px">امضای انتخابی شما در تاریخچه گردش کار و نسخه چاپی برنامه ثبت و نمایش داده می‌شود.</div>' +
        sigPickerHTML(curUser()) + '</div>';
    }
  } else if (kind === 'comment'){
    body = fieldHTML('b-com', 'متن توضیح', true, '<textarea class="input" data-maxlen="600" rows="4" id="dmCom" placeholder="توضیح خود را ثبت کنید (بدون تغییر وضعیت گردش کار)"></textarea>');
  } else {
    body = '<div class="warn-box" style="margin:0 0 12px">' + I.alert + '<span>' +
      (kind === 'reject' ? 'با رد درخواست، گردش کار برنامه به‌صورت نهایی متوقف می‌شود.' : 'برنامه برای اصلاح به متقاضی («' + esc(personName(p.applicantId)) + '») بازگردانده می‌شود.') +
      '</span></div>' +
      fieldHTML('b-rsn', 'دلیل (الزامی)', true, '<textarea class="input" data-maxlen="600" rows="4" id="dmRsn" placeholder="دلیل ' + (kind === 'reject' ? 'رد' : 'بازگشت') + ' را به‌طور کامل شرح دهید..."></textarea>');
  }
  openModal({
    title: titles[kind] + ' — ' + (p.code || ''), size: 'sm', icon: kind === 'approve' ? I.checkC : kind === 'comment' ? I.comment : I.alert,
    body,
    footerButtons: [
      { label: kind === 'approve' ? 'تأیید نهایی' : kind === 'comment' ? 'ثبت توضیح' : 'ثبت و ارسال', cls: kind === 'reject' ? 'btn-danger' : 'btn-primary', icon: I.check, onClick: () => doDecision(p, role, kind) },
      { label: 'انصراف', cls: 'btn-ghost', onClick: () => closeTopModal(true) }
    ],
    onMount: b => {
      bindCounters(b); bindMoneyInputs(b); bindSigPicker(b);
      /* لیست‌های کشویی سرفصل بودجه و نوع برنامه (الزامی هنگام تأیید بودجه) */
      if (kind === 'approve' && role === 'budget'){
        dmBHsel = makeDD($('#dmBH', b), {
          options: (db.base.budgetHeads || []).filter(x => x.active).map(x => ({ v: x.id, label: x.name })),
          value: p.budgetHeadId || '', placeholder: 'انتخاب سرفصل بودجه...'
        });
        dmPTsel = makeDD($('#dmPT', b), {
          options: (db.base.programTypes || []).filter(x => x.active).map(x => ({ v: x.id, label: x.name })),
          value: p.programTypeId || '', placeholder: 'انتخاب نوع برنامه...'
        });
      }
    }
  });
}
function doDecision(p, role, kind){
  const body = modalStack[modalStack.length - 1].ov;
  const com = $('#dmCom', body) ? $('#dmCom', body).value.trim() : '';
  let extra = {};
  if (kind === 'approve' && role === 'budget'){
    const sug = parseMoney($('#dmSug', body).value);
    const app = parseMoney($('#dmApp', body).value);
    if (sug === null || isNaN(sug) || sug <= 0){ toast('مبلغ پیشنهادی معتبر وارد کنید', 'error'); return; }
    if (app === null || isNaN(app) || app <= 0){ toast('مبلغ تأییدشده معتبر وارد کنید', 'error'); return; }
    /* انتخاب سرفصل بودجه و نوع برنامه الزامی است */
    const bh = dmBHsel ? dmBHsel.value : '';
    const pt = dmPTsel ? dmPTsel.value : '';
    if (!bh){ setFieldError(body, 'b-bh', 'انتخاب سرفصل بودجه الزامی است'); toast('انتخاب سرفصل بودجه الزامی است', 'error'); return; }
    if (!pt){ setFieldError(body, 'b-pt', 'انتخاب نوع برنامه الزامی است'); toast('انتخاب نوع برنامه الزامی است', 'error'); return; }
    extra = { suggested: sug, approved: app, budgetHeadId: bh, programTypeId: pt };
  }
  if ((kind === 'reject' || kind === 'return') && (!$('#dmRsn', body) || !$('#dmRsn', body).value.trim())){
    setFieldError(body, 'b-rsn', 'ثبت دلیل الزامی است');
    toast('ثبت دلیل برای این اقدام الزامی است', 'error');
    return;
  }
  if (kind === 'comment' && !com){
    setFieldError(body, 'b-com', 'ثبت متن توضیح الزامی است');
    toast('ثبت متن توضیح الزامی است', 'error');
    return;
  }
  const rsn = $('#dmRsn', body) ? $('#dmRsn', body).value.trim() : '';
  const actLabels = {
    approve_committer: 'تأیید و ارجاع به مدیر ارشد',
    approve_senior: 'تأیید و ارجاع به کنترل بودجه',
    approve_budget: 'تأیید بودجه',
    reject_committer: 'رد درخواست',
    reject_senior: 'رد درخواست',
    reject_budget: 'رد درخواست',
    return_committer: 'بازگشت برای اصلاح',
    return_senior: 'بازگشت برای اصلاح',
    return_budget: 'بازگشت برای اصلاح',
    comment: 'ثبت توضیح'
  };
  const finish = (trans) => {
    const from = p.status;
    trans();
    pushHist(p, actLabels[kind + '_' + role] || actLabels[kind] || 'اقدام', kind === 'return' || kind === 'reject' ? rsn : com, from, p.status, { actedRole: role, sig: sigRecordCurrent() });
    saveDB(true);
    closeTopModal(true);
    toast('اقدام شما با موفقیت ثبت شد', 'success');
    renderProgramDetail();
    buildSidebar();
    updateHeader();
  };
  if (kind === 'approve' && role === 'committer') finish(() => {
    p.status = 'pending_senior';
    /* اعلان: متقاضی و مدیر ارشد — ارجاع توسط متعهد */
    wfNotify(p, [p.applicantId, p.seniorManagerId],
      'برنامه «' + p.title + '» (' + toFa(p.code) + ') توسط متعهد تأیید و به مدیر ارشد ارجاع شد.',
      { cls: 'ic-green', icon: 'checkC', sub: 'در انتظار تصمیم مدیر ارشد در کارتابل' });
  });
  else if (kind === 'approve' && role === 'senior') finish(() => {
    p.status = 'pending_budget';
    /* اعلان: متقاضی، متعهد و همه مسئولان کنترل بودجه فعال */
    wfNotify(p, [p.applicantId, p.committerId].concat(budgetUserIds()),
      'برنامه «' + p.title + '» (' + toFa(p.code) + ') توسط مدیر ارشد تأیید و به مسئول کنترل بودجه ارجاع شد.',
      { cls: 'ic-green', icon: 'checkC', sub: 'در انتظار تصمیم کنترل بودجه در کارتابل' });
  });
  else if (kind === 'approve' && role === 'budget') finish(() => {
    p.status = 'approved';
    p.suggestedAmount = extra.suggested;
    p.approvedAmount = extra.approved;
    p.budgetHeadId = extra.budgetHeadId;
    p.programTypeId = extra.programTypeId;
    /* تأیید نهایی گردش کار: اطلاع‌رسانی به متقاضی، متعهد و مدیر ارشد — برنامه در اولویت‌بندی قرار گرفت */
    pushNotif([p.applicantId, p.committerId, p.seniorManagerId],
      'برنامه «' + p.title + '» (' + toFa(p.code) + ') تأیید نهایی شد و ریزتقاضاهای آن در اولویت‌بندی بودجه قرار گرفت.',
      { code: p.code, cls: 'ic-green', icon: 'checkC', sub: 'مبلغ تأییدشده: ' + fmtInt(extra.approved) + ' ' + CUR() });
  });
  else if (kind === 'reject') finish(() => {
    p.status = 'rejected';
    /* اعلان رد به زنجیره گردش کار همراه با دلیل */
    wfNotify(p, [p.applicantId, p.committerId, p.seniorManagerId],
      'برنامه «' + p.title + '» (' + toFa(p.code) + ') رد شد.',
      { cls: 'ic-red', icon: 'xC', sub: 'دلیل: ' + (truncReason(rsn) || 'ثبت نشده') });
  });
  else if (kind === 'return') finish(() => {
    p.status = 'returned';
    /* اعلان بازگشت به متقاضی (و ثبت‌کننده) همراه با دلیل */
    wfNotify(p, [p.applicantId, p.createdBy],
      'برنامه «' + p.title + '» (' + toFa(p.code) + ') برای اصلاح به متقاضی بازگشت.',
      { cls: 'ic-orange', icon: 'undo', sub: 'دلیل: ' + (truncReason(rsn) || 'ثبت نشده') });
  });
  else if (kind === 'comment') finish(() => {});
}

/* ================================================================
   بخش ۹ — اولویت‌بندی ریزتقاضاها با تکنیک AHP
   (Analytic Hierarchy Process — ماتریس مقایسه زوجی + وزن‌دهی + رتبه‌بندی + تأیید)
   ================================================================ */
let prF = { mgmt: '', unit: '', st: '', q: '' };

/* ---- پیکربندی معیارها (از مدیریت سایت؛ در نبود تنظیم، پیش‌فرض) ---- */
function ahpAllCrit(){
  const l = db.settings.ahpCriteria;
  return (Array.isArray(l) && l.length ? l : defaultAhpCriteria()).slice();
}
function ahpCritCfg(){
  return ahpAllCrit().filter(c => c.active !== false);
}

/* ---- مقیاس ساعتی ۱ تا ۹ و معکوس‌ها ---- */
const SAATY = [
  { v: 1,        label: '۱' }, { v: 2, label: '۲' }, { v: 3, label: '۳' }, { v: 4, label: '۴' },
  { v: 5, label: '۵' }, { v: 6, label: '۶' }, { v: 7, label: '۷' }, { v: 8, label: '۸' }, { v: 9, label: '۹' },
  { v: 0.5,      label: '۱/۲' }, { v: 0.3333333, label: '۱/۳' }, { v: 0.25, label: '۱/۴' },
  { v: 0.2,      label: '۱/۵' }, { v: 0.1666667, label: '۱/۶' }, { v: 0.1428571, label: '۱/۷' },
  { v: 0.125,    label: '۱/۸' }, { v: 0.1111111, label: '۱/۹' }
];
function saatyLabel(v){
  const hit = SAATY.find(s => Math.abs(s.v - v) < 1e-6);
  return hit ? hit.label : fmtDec(trim1(v));
}
function snapSaaty(r){
  const up = [1, 2, 3, 4, 5, 6, 7, 8, 9];
  if (r >= 1){
    let best = up[0];
    up.forEach(s => { if (Math.abs(s - r) < Math.abs(best - r)) best = s; });
    return best;
  }
  return 1 / snapSaaty(1 / r);
}
/* مقدار مقایسه زوجی معیار i نسبت به j (فقط بالامثلث ذخیره می‌شود) */
function ahpPair(i, j, crits){
  if (i === j) return 1;
  const lo = Math.min(i, j), hi = Math.max(i, j);
  const cmp = db.settings.ahp && db.settings.ahp.cmp ? db.settings.ahp.cmp : {};
  const v = cmp[crits[lo].key + '_' + crits[hi].key];
  const a = (v !== undefined && isFinite(+v) && +v > 0) ? +v : snapSaaty((+crits[lo].w || 1) / (+crits[hi].w || 1));
  return i < j ? a : 1 / a;
}
function ahpHasCmp(){
  const cmp = db.settings.ahp && db.settings.ahp.cmp ? db.settings.ahp.cmp : {};
  const keys = ahpCritCfg().map(c => c.key);
  return Object.keys(cmp).some(k => { const p = k.split('_'); return p.length === 2 && keys.indexOf(p[0]) > -1 && keys.indexOf(p[1]) > -1 && cmp[k] !== undefined; });
}
/* وزن معیارها: در نبود مقایسه زوجی → وزن پایه نرمال‌شده؛ در غیر این صورت میانگین هندسی سطرهای ماتریس */
function ahpWeights(){
  const crits = ahpCritCfg();
  const n = crits.length;
  if (!n) return [];
  if (!ahpHasCmp()){
    const sum = crits.reduce((s, c) => s + (+c.w || 0), 0) || 1;
    return crits.map(c => ({ key: c.key, title: c.title, w: (+c.w || 0) / sum }));
  }
  const g = [];
  for (let i = 0; i < n; i++){
    let p = 1;
    for (let j = 0; j < n; j++){ if (j !== i) p *= ahpPair(i, j, crits); }
    g.push(Math.pow(p, 1 / n));
  }
  const s = g.reduce((a, b) => a + b, 0) || 1;
  return crits.map((c, i) => ({ key: c.key, title: c.title, w: g[i] / s }));
}
/* نسبت سازگاری CR — مقدار ≤ ۰٫۱ قابل قبول است */
function ahpCR(){
  const crits = ahpCritCfg(), n = crits.length;
  if (n < 3 || !ahpHasCmp()) return { cr: 0, consistent: true, hasCmp: ahpHasCmp() };
  const w = ahpWeights();
  let lmax = 0;
  for (let i = 0; i < n; i++){
    let row = 0;
    for (let j = 0; j < n; j++){
      if (i === j) row += w[i].w;
      else row += ahpPair(i, j, crits) * w[j].w;
    }
    lmax += row / (w[i].w || 1e-9);
  }
  lmax /= n;
  const RI = [0, 0, 0.58, 0.90, 1.12, 1.24, 1.32, 1.41, 1.45, 1.49, 1.51, 1.54];
  const ci = (lmax - n) / (n - 1);
  const cr = ci / (RI[Math.min(n, 11)] || 1.5);
  return { cr: Math.max(cr, 0), consistent: cr <= 0.1, lmax, hasCmp: true };
}
/* نمره نهایی ریزتقاضا = Σ (وزن معیار × امتیاز پاسخ) — فقط با تکمیل همه معیارها */
function ahpScoreMicro(m){
  const ws = ahpWeights(), crits = ahpCritCfg();
  const ans = (m.ahp && m.ahp.answers) || {};
  let answered = 0, sum = 0;
  const parts = [];
  ws.forEach(x => {
    const c = crits.find(z => z.key === x.key) || { type: 'dropdown', opts: [] };
    const a = ans[x.key];
    let s = null;
    if (c.type === 'checkbox'){
      if (Array.isArray(a) && a.length) s = a.reduce((p, v) => p + (+v || 0), 0) / a.length;
    } else if (a !== undefined && a !== '' && !isNaN(+a)){
      s = +a;
    }
    if (s !== null){ answered++; sum += x.w * Math.min(Math.max(s, 0), 1); }
    parts.push({ key: x.key, title: x.title, w: x.w, s, contrib: s === null ? 0 : x.w * Math.min(Math.max(s, 0), 1) });
  });
  const complete = ws.length > 0 && answered === ws.length;
  return { total: ws.length, answered, complete, score: complete ? sum : null, parts };
}
function ahpStatusLabel(st){
  return st === 'approved' ? 'تأییدشده' : st === 'rejected' ? 'ردشده' : 'در انتظار بررسی';
}
function ahpStatusCls(st){
  return st === 'approved' ? 'st-green' : st === 'rejected' ? 'st-red' : 'st-gray';
}

      } else {
        rows += '<td style="color:#94a3b8;font-size:11px">' + saatyLabel(ahpPair(i, j, crits)) + '</td>';
      }
    }

  }

  $$('#prMatrix select[data-i]').forEach(sel => sel.addEventListener('change', () => {

    db.settings.ahp.cmp[crits[i].key + '_' + crits[j].key] = +sel.value;

function prWeightsPatch(crits){

  });

}

function prCollect(){
  const u = curUser();
  const rows = [];
  /* تقاضاهای ردشده (رد اولویت‌بندی یا رد برنامه در کارتابل) و برنامه‌های پیش‌نویس وارد رتبه‌بندی نمی‌شوند؛
     فقط با انتخاب صریح فیلتر «ردشده» برای مرور نمایش داده می‌شوند */
  visiblePrograms(u).forEach(p => {
    if (p.status === 'draft' || p.status === 'rejected') return;
    (p.micros || []).forEach(m => rows.push({ p, m, st: ahpScoreMicro(m) }));
  });
  if (prF.mgmt) for (let i = rows.length - 1; i >= 0; i--) if (rows[i].p.mgmtId !== prF.mgmt) rows.splice(i, 1);
  if (prF.unit) for (let i = rows.length - 1; i >= 0; i--) if (rows[i].p.unitId !== prF.unit) rows.splice(i, 1);
  if (prF.st){
    for (let i = rows.length - 1; i >= 0; i--){
      const r = rows[i];
      const status = r.m.ahp && r.m.ahp.status ? r.m.ahp.status : 'pending';
      if (prF.st === 'incomplete'){ if (r.st.complete) rows.splice(i, 1); }
      else if (status !== prF.st) rows.splice(i, 1);
    }
  } else {
    /* بدون فیلتر: ردشده‌ها از لیست اولویت‌بندی خارج هستند */
    for (let i = rows.length - 1; i >= 0; i--){
      const status = rows[i].m.ahp && rows[i].m.ahp.status ? rows[i].m.ahp.status : 'pending';
      if (status === 'rejected') rows.splice(i, 1);
    }
  }
  if (prF.q){
    const q = prF.q.toLowerCase();
    for (let i = rows.length - 1; i >= 0; i--){
      const r = rows[i];
      const hay = ((r.m.title || '') + ' ' + (r.m.id || '') + ' ' + (r.p.code || '') + ' ' + (r.p.title || '')).toLowerCase();
      if (hay.indexOf(q) === -1) rows.splice(i, 1);
    }
  }
  /* مرتب‌سازی: نمره کامل نزولی؛ ناقص‌ها آخر (به تعداد پاسخ، سپس عنوان) */
  rows.sort((a, b) => {
    if (a.st.complete && b.st.complete) return b.st.score - a.st.score;
    if (a.st.complete) return -1;
    if (b.st.complete) return 1;
    if (b.st.answered !== a.st.answered) return b.st.answered - a.st.answered;
    return String(a.m.title || '').localeCompare(String(b.m.title || ''), 'fa');
  });
  return rows;
}

function prStatsRender(){
  const all = prCollect();
  const u = curUser();
  const totalAll = [];
  visiblePrograms(u).forEach(p => (p.micros || []).forEach(m => totalAll.push({ m, st: ahpScoreMicro(m) })));
  const complete = totalAll.filter(r => r.st.complete).length;
  const approved = totalAll.filter(r => r.m.ahp && r.m.ahp.status === 'approved').length;
  const rejected = totalAll.filter(r => r.m.ahp && r.m.ahp.status === 'rejected').length;
  const pending = complete - approved - rejected;
  const scored = totalAll.filter(r => r.st.complete);
  const avg = scored.length ? scored.reduce((s, r) => s + r.st.score, 0) / scored.length * 100 : 0;
  const box = $('#prStats');
  if (!box) return;
  box.innerHTML =
    prStatCard('list', 'کل ریزتقاضاهای مجاز', toFa(totalAll.length), toFa(complete) + ' مورد دارای نمره کامل', 'ic-blue') +
    prStatCard('clock', 'در انتظار تصمیم', toFa(Math.max(pending, 0)), 'کامل و بدون تصمیم نهایی', 'ic-amber') +
    prStatCard('checkC', 'اولویت تأییدشده', toFa(approved), 'به‌تأیید رسیده', 'ic-green') +
    prStatCard('xC', 'ردشده', toFa(rejected), 'نیازمند اصلاح پاسخ‌ها', 'ic-red') +
    prStatCard('trend', 'میانگین نمره اولویت‌بندی', fmtDec(trim1(avg)), 'از ۱۰۰ (ریزتقاضاهای کامل)', 'ic-violet');
  /* حذف کارت خالی وقتی سامانه خالی است */
  if (!totalAll.length) box.innerHTML = '';
}

function prChartRender(rows){
  const cv = $('#chAhp'); if (!cv) return;

}

/* ---------------- شماره مصوب (پس از تأیید مسئول کنترل بودجه) ---------------- */
function nextApprovalNo(){
  const y = budgetYear();
  let mx = 0;
  db.programs.forEach(p => (p.micros || []).forEach(m => {
    const no = (m.ahp || {}).approvalNo;
    if (typeof no === 'string'){
      const mm2 = no.match(/^AP-(\d{4})-(\d+)$/);
      if (mm2 && +mm2[1] === +y) mx = Math.max(mx, +mm2[2]);
    }
  }));
  return 'AP-' + y + '-' + String(mx + 1).padStart(4, '0');
}
function approvalNoFa(no){ return no ? toFa(String(no).replace('AP-', '')) : '—'; }

/* ---------------- صفحه «اولویت‌ها» (نمای شخصی سایر کاربران) ---------------- */
let mpF = { st: '', q: '' };
function myPriorRows(u){
  /* محدوده: مدیر سایت تمام برنامه‌های سامانه را می‌بیند؛ سایر نقش‌ها طبق محدوده مشاهده */
  let progs;
  if (hasRole(u, 'admin')) progs = db.programs.slice();
  else progs = visiblePrograms(u);
  /* رتبه سراسری از کل ریزتقاضاهای دارای نمره کامل سامانه (همان ترتیب صفحه مدیریت)
     — تقاضاهای ردشده و برنامه‌های پیش‌نویس/ردشده وارد رتبه‌بندی نمی‌شوند */
  const rankable = pr => pr.status !== 'draft' && pr.status !== 'rejected';
  const all = [];
  db.programs.forEach(p => { if (!rankable(p)) return; (p.micros || []).forEach(m => {
    const stt = (m.ahp && m.ahp.status) || 'pending';
    if (stt === 'rejected') return;
    const st = ahpScoreMicro(m);
    if (st.complete) all.push({ p, m, st });
  }); });
  all.sort((a, b) => (b.st.score - a.st.score) || String(a.m.id || '').localeCompare(String(b.m.id || ''), 'fa'));
  const rankMap = new Map();
  all.forEach((r, i) => rankMap.set(r.m, i + 1));
  const rows = [];
  progs.forEach(p => (p.micros || []).forEach(m => rows.push({ p, m, st: ahpScoreMicro(m), rank: rankMap.get(m) || null })));
  if (mpF.st){
    for (let i = rows.length - 1; i >= 0; i--){
      const r = rows[i];
      const stt = r.m.ahp && r.m.ahp.status ? r.m.ahp.status : 'pending';
      if (mpF.st === 'incomplete'){ if (r.st.complete) rows.splice(i, 1); }
      else if (stt !== mpF.st) rows.splice(i, 1);
    }
  }
  if (mpF.q){
    const q = mpF.q.toLowerCase();
    for (let i = rows.length - 1; i >= 0; i--){
      const r = rows[i];
      const hay = ((r.m.title || '') + ' ' + (r.m.id || '') + ' ' + (r.p.code || '') + ' ' + (r.p.title || '')).toLowerCase();
      if (hay.indexOf(q) === -1) rows.splice(i, 1);
    }
  }
  rows.sort((a, b) => {
    if (a.st.complete && b.st.complete) return (a.rank || 0) - (b.rank || 0);
    if (a.st.complete) return -1;
    if (b.st.complete) return 1;
    return String(a.m.title || '').localeCompare(String(b.m.title || ''), 'fa');
  });
  return rows;
}

  const complete = rows.filter(r => r.st.complete);

    '</div></div>' +
    '<div class="panel-b tight" id="mpTable"></div></div>' +
    '<div class="hint" style="margin-top:12px">رتبه‌ها بر اساس نمره اولویت‌بندی (وزن معیارها × امتیاز پاسخ‌ها) به‌صورت خودکار و سراسری محاسبه می‌شوند و با تنظیم وزن‌ها توسط مسئول کنترل بودجه به‌روز می‌شوند. تکمیل همه معیارها در مرحله ۳ فرم ریزتقاضا شرط ورود به رتبه‌بندی است. تنظیم وزن‌ها و تأیید/رد فقط از بخش «اولویت‌بندی بودجه» (مسئول کنترل بودجه) انجام می‌شود.</div>';
  mc.innerHTML = html;

  $('#mpCount').textContent = toFa(rows.length) + ' ریزتقاضا';
  makeDD($('#mpSt'), { options: [
    { v: '', label: 'همه وضعیت‌ها' }, { v: 'pending', label: 'در انتظار بررسی' },
    { v: 'approved', label: 'تأییدشده' }, { v: 'rejected', label: 'ردشده' },
    { v: 'incomplete', label: 'ناقص (بدون پاسخ کامل)' }
  ], value: '', placeholder: 'همه', onChange: v => { mpF.st = v; mpTableRender(); } });
  $('#mpQ').addEventListener('input', debounce(() => { mpF.q = $('#mpQ').value.trim(); mpTableRender(); }, 250));
  mpTableRender();
}
function mpTableRender(){
  const holder = $('#mpTable'); if (!holder) return;
  const u = curUser();
  const rows = myPriorRows(u);
  const cnt = $('#mpCount');
  if (cnt) cnt.textContent = toFa(rows.length) + ' ریزتقاضا';
  if (!rows.length){
    holder.innerHTML = '<div class="empty">' + I.star + '<div class="e-t">' + (hasRole(u, 'admin') ? 'شما هنوز برنامه‌ای ثبت نکرده‌اید' : 'ریزتقاضایی در محدوده شما نیست') + '</div><div class="e-s">ریزتقاضاها از طریق «درخواست برنامه» (مرحله ۳: معیارهای اولویت‌بندی) ثبت می‌شوند و پس از آن رتبه آن‌ها در همین صفحه نمایش داده می‌شود.</div></div>';
    return;
  }
  const body = rows.map(r => {
    const m = r.m, p = r.p, st = r.st;
    const ahpSt = (m.ahp && m.ahp.status) || 'pending';
    const isComplete = st.complete;
    const frozen = (ahpSt !== 'pending' && m.ahp && m.ahp.score !== null && m.ahp.score !== undefined)
      ? '<div style="font-size:10px;color:#94a3b8;margin-top:2px">ثبت‌شده: ' + fmtDec(trim1(m.ahp.score * 100)) + '٪' + (m.ahp.date ? ' — ' + fmtJStr(m.ahp.date) : '') + '</div>' : '';
    const rejReason = ahpSt === 'rejected' && (m.ahp || {}).comment
      ? '<div style="font-size:10.5px;color:var(--red);margin-top:3px;max-width:230px" title="' + esc(m.ahp.comment) + '">دلیل رد: ' + esc(m.ahp.comment.length > 46 ? m.ahp.comment.slice(0, 46) + '…' : m.ahp.comment) + '</div>' : '';
    const apprNo2 = (m.ahp && m.ahp.approvalNo)
      ? '<div style="font-size:10.5px;font-weight:800;color:#a16207;margin-top:3px">شماره مصوب: ' + approvalNoFa(m.ahp.approvalNo) + '</div>' : '';
    return '<tr style="' + (isComplete ? '' : 'opacity:.72') + '">' +
      '<td>' + (isComplete ? '<span class="rank-badge' + (r.rank && r.rank <= 3 ? ' r' + r.rank : '') + '">' + (r.rank ? toFa(r.rank) : '—') + '</span>' : '<span class="chip chip-soft">ناقص</span>') + '</td>' +
      '<td class="num">' + esc(m.id || '—') + '</td>' +
      '<td class="ttl-cell" title="' + esc(m.title) + '">' + esc(m.title || '—') + '</td>' +
      '<td><div style="font-weight:700">' + esc(p.code) + '</div><div style="font-size:10.5px;color:#94a3b8;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(p.title) + '</div></td>' +
      '<td><div class="score-cell"><span class="sc-num">' + (isComplete ? fmtDec(trim1(st.score * 100)) + '٪' : '—') + '</span>' +
      '<div class="score-bar" style="flex:1"><span style="width:' + (isComplete ? Math.round(st.score * 100) : 0) + '%"></span></div></div></td>' +
      '<td><span class="chip ' + ahpStatusCls(ahpSt) + '">' + ahpStatusLabel(ahpSt) + '</span>' + frozen + apprNo2 + rejReason + '</td></tr>';
  }).join('');
  holder.innerHTML = '<div class="tbl-scroll"><table class="tbl"><thead><tr>' +
    '<th>رتبه</th><th>کد</th><th>شرح ریزتقاضا</th><th>برنامه</th><th style="min-width:150px">نمره اولویت‌بندی</th><th>وضعیت</th>' +
    '</tr></thead><tbody>' + body + '</tbody></table></div>';
}

/* ═══════════ p12_cart_reports.js ═══════════ */

/* ================================================================
   بخش ۱۱ — کارتابل
   ================================================================ */
/* کارتابل کامل: همه وضعیت‌های گردش کار در یک صفحه
   ورودی (نیازمند اقدام من) / ارسال‌شده (در جریان، منتظر دیگران) / تأییدشده / ردشده / بازگشتی / پیش‌نویس / همه */
const CART_PENDING = ['pending_committer','pending_senior','pending_budget'];
let cartTab = 'in', cartQ = '', cartFY = '', cartFM = '';
let cartSel = {}, cartSort = 'act';
const CART_SORTS = [
  { v: 'act',   t: 'آخرین فعالیت (پیش‌فرض)' },
  { v: 'code',  t: 'شناسه (نزولی)' },
  { v: 'est',   t: 'مبلغ برآورد (بیشترین)' },
  { v: 'title', t: 'عنوان (الفبایی)' }
];
/* نقش اقدام‌پذیر در کارتابل (برای انتخاب گروهی): متعهد، مدیر ارشد یا مسئول کنترل بودجه */
function cartActRole(u, p){
  const r = cartRole(u, p);
  return (r === 'committer' || r === 'senior' || r === 'budget') ? r : null;
}
function cartClearSel(){ cartSel = {}; }
function cartSelectedItems(u){
  return Object.keys(cartSel).filter(c => cartSel[c]).map(c => findProgram(c)).filter(p => p && cartActRole(u, p));
}
function cartInbox(u){
  const act = db.programs.filter(p => cartRole(u, p));
  if (!hasRole(u, 'admin')) return act;
  /* مدیر سایت: علاوه بر اقدامات شخصی، همه برنامه‌های در جریان و بازگشتی برای پایش گردش کار */
  const codes = {}; act.forEach(p => { codes[p.code] = 1; });
  return act.concat(db.programs.filter(p => !codes[p.code] && (CART_PENDING.indexOf(p.status) !== -1 || p.status === 'returned')));
}
function cartIsSent(u, p){
  /* ارسال‌شده: در جریان گردش کار است، منتظر اقدام دیگران است و من در آن سهم داشته‌ام (ثبت‌کننده یا اقدام‌کننده) */
  if (CART_PENDING.indexOf(p.status) === -1 || cartRole(u, p)) return false;
  return p.applicantId === u.id || p.createdBy === u.id || (p.history || []).some(h => h.userId === u.id);
}
function cartWaitInfo(p){
  if (p.status === 'pending_committer') return 'در انتظار بررسی متعهد' + (p.committerId ? ': ' + personName(p.committerId) : '');
  if (p.status === 'pending_senior') return 'در انتظار تصمیم مدیر ارشد' + (p.seniorManagerId ? ': ' + personName(p.seniorManagerId) : '');
  if (p.status === 'pending_budget') return 'در انتظار تصمیم مسئول کنترل بودجه';
  if (p.status === 'returned') return 'بازگشت به متقاضی برای اصلاح' + (p.applicantId ? ': ' + personName(p.applicantId) : '');
  if (p.status === 'rejected'){
    const rr = (p.history || []).filter(h => h.to === 'rejected' && h.comment).pop();
    if (rr) return 'دلیل رد: ' + (rr.comment.length > 80 ? rr.comment.slice(0, 80) + '…' : rr.comment);
  }
  return '';
}
function cartLastTouch(p){
  const h = p.history || [];
  if (h.length) return h[h.length - 1].date + ' ' + h[h.length - 1].time;
  return (p.submittedAt || p.createdAt || '');
}
function renderCartKeepFocus(){
  const val = $('#cartQ') ? $('#cartQ').value : '';
  renderCart();
  const q = $('#cartQ');
  if (q){ q.focus(); q.setSelectionRange(val.length, val.length); }
}
function renderCart(){
  const u = curUser();
  const mc = $('#mainContent');
  let html = pageHead('کارتابل', I.inbox, 'همه وضعیت‌های گردش کار در یک نگاه: ورودی، ارسال‌شده، تأییدشده، ردشده، بازگشتی، پیش‌نویس و سوابق اقدام',
    '<button class="btn btn-outline btn-sm" id="cartCsv">' + I.download + ' خروجی CSV</button>' +
    '<button class="btn btn-outline btn-sm" id="cartPrint">' + I.print + ' چاپ فهرست</button>');
  const base = cartItems(u);
  const inbox = cartInbox(u);
  const sent = base.filter(p => cartIsSent(u, p));
  const bySt = st => base.filter(p => p.status === st);
  const cnt = { in: inbox.length, sent: sent.length, approved: bySt('approved').length, rejected: bySt('rejected').length, returned: bySt('returned').length, draft: bySt('draft').length, all: base.length };
  const TILE = [
    { k:'in',       t:'ورودی',     icon:'inbox',  cls:'ic-amber'  },
    { k:'sent',     t:'ارسال‌شده', icon:'send',   cls:'ic-info'   },
    { k:'approved', t:'تأییدشده',  icon:'checkC', cls:'ic-green'  },
    { k:'rejected', t:'ردشده',     icon:'xC',     cls:'ic-red'    },
    { k:'returned', t:'بازگشتی',   icon:'undo',   cls:'ic-orange' },
    { k:'draft',    t:'پیش‌نویس',  icon:'edit',   cls:'ic-gray'   }
  ];
  const TABS = TILE.concat([{ k:'all', t:'همه', icon:'list', cls:'ic-violet' }]);
  let tb = TABS.filter(x => x.k === cartTab)[0];
  if (!tb){ cartTab = 'in'; tb = TABS[0]; }

  /* کارت‌های آماری قابل کلیک — کلیک = رفتن به همان طبقه */
  html += '<div class="cart-tiles">' + TILE.map(td =>
    '<button type="button" class="cart-tile ' + (cartTab === td.k ? 'on' : '') + '" data-ct="' + td.k + '">' +
    '<span class="ct-ic ' + td.cls + '">' + I[td.icon] + '</span>' +
    '<span><span class="ct-v">' + toFa(cnt[td.k]) + '</span><span class="ct-t">' + td.t + '</span></span></button>'
  ).join('') + '</div>';

  /* تب‌های شمارنده‌دار + نوار ابزار جستجو و فیلتر */
  html += '<div class="panel"><div class="panel-b">' +
    '<div class="cart-tabs">' + TABS.map(x =>
      '<button type="button" class="cart-tab ' + (cartTab === x.k ? 'on' : '') + '" data-ct="' + x.k + '">' + I[x.icon] + ' ' + x.t + ' <span class="ct-n">' + toFa(cnt[x.k]) + '</span></button>'
    ).join('') + '</div>' +
    '<div class="fbar">' +
    '<div class="field" style="grid-column:span 2"><label>جستجو (شناسه / عنوان / متقاضی / مدیریت / واحد)</label><input class="input" id="cartQ" placeholder="مثال: BP-1405 یا کمپرسور..." value="' + esc(cartQ) + '"></div>' +
    '<div class="field"><label>سال بودجه</label><div id="cartF-year"></div></div>' +
    '<div class="field"><label>مدیریت</label><div id="cartF-mgmt"></div></div>' +
    '<div class="field"><label>مرتب‌سازی</label><div id="cartSortDD"></div></div>' +
    '</div></div></div>';

  /* لیست طبقه فعال (فیلترها در cartListFor مشترک است تا «انتخاب همه» هم همان لیست را ببیند) */
  let list = cartListFor(u, { inbox: inbox, sent: sent, base: base }).slice();
  /* مرتب‌سازی بر اساس انتخاب کاربر */
  if (cartSort === 'code') list.sort((a, b) => String(b.code || '').localeCompare(String(a.code || '')));
  else if (cartSort === 'est') list.sort((a, b) => progTotals(b).est - progTotals(a).est);
  else if (cartSort === 'title') list.sort((a, b) => String(a.title || '').localeCompare(String(b.title || ''), 'fa'));
  else list.sort((a, b) => cartLastTouch(b).localeCompare(cartLastTouch(a)) || String(b.code || '').localeCompare(String(a.code || '')));

  const EMPTY = {
    in:       ['کارتابل ورودی شما خالی است', 'در حال حاضر برنامه‌ای برای اقدام شما وجود ندارد.'],
    sent:     ['مورد ارسال‌شده‌ای در جریان نیست', 'برنامه‌هایی که ارسال کرده‌اید و منتظر اقدام دیگران هستند اینجا نمایش داده می‌شوند.'],
    approved: ['برنامه تأییدشده‌ای وجود ندارد', 'برنامه‌های تأییدشده نهایی پس از پایان گردش کار اینجا نمایش داده می‌شوند.'],
    rejected: ['برنامه ردشده‌ای وجود ندارد', 'برنامه‌های ردشده همراه با دلیل رد اینجا نمایش داده می‌شوند.'],
    returned: ['برنامه بازگشتی وجود ندارد', 'برنامه‌های بازگشتی برای اصلاح اینجا نمایش داده می‌شوند.'],
    draft:    ['پیش‌نویسی وجود ندارد', 'برنامه‌های ثبت‌نشده (پیش‌نویس) اینجا نمایش داده می‌شوند.'],
    all:      ['برنامه‌ای در دسترس شما نیست', 'برنامه‌ای مطابق محدوده دسترسی و فیلترهای فعلی یافت نشد.']
  };
  const em = EMPTY[cartTab] || EMPTY.all;
  const smIc = ic => ic.replace('<svg', '<svg style="width:13px;height:13px;vertical-align:-2px"');
  const selN = Object.keys(cartSel).filter(c => cartSel[c] && findProgram(c) && cartActRole(u, findProgram(c))).length;
  const eligN = list.filter(p => cartActRole(u, p)).length;
  html += '<div class="panel"><div class="panel-h"><span class="panel-t">' + I[tb.icon] + ' ' + tb.t + '</span>' +

    (eligN ? '<button type="button" class="btn btn-ghost btn-sm" id="cartSelAll">' + I.checkC + ' ' + (selN && selN === eligN ? 'لغو انتخاب همه' : 'انتخاب همه قابل اقدام') + '</button>' : '') +
    (selN ? '<span class="chip st-info" id="cartSelChip" style="font-size:11px">' + toFa(selN) + ' انتخاب‌شده</span>' : '') +
    '<span class="chip chip-soft">' + toFa(list.length) + ' برنامه' + (list.length !== cnt[cartTab] ? ' از ' + toFa(cnt[cartTab]) : '') + '</span></span></div>' +
    '<div class="panel-b">' +
    (list.length ? list.map(p => {
      const t = progTotals(p);
      const role = cartRole(u, p);
      const ar = cartActRole(u, p);
      let btns = '<button class="btn btn-outline btn-sm" data-v="' + p.code + '">' + I.eye + ' مشاهده و بررسی</button>';

        btns += '<button class="btn btn-success btn-sm" data-a="approve">' + I.checkC + ' تأیید</button><button class="btn btn-warn btn-sm" data-a="return">' + I.undo + ' بازگشت</button><button class="btn btn-ghost btn-sm" data-a="comment">' + I.comment + ' توضیح</button>';
      else if (role === 'senior')
        btns += '<button class="btn btn-success btn-sm" data-a="approve">' + I.checkC + ' تأیید</button><button class="btn btn-danger btn-sm" data-a="reject">' + I.x + ' رد</button><button class="btn btn-warn btn-sm" data-a="return">' + I.undo + ' بازگشت</button><button class="btn btn-ghost btn-sm" data-a="comment">' + I.comment + ' توضیح</button>';
      else if (role === 'budget')
        btns += '<button class="btn btn-success btn-sm" data-a="approve">' + I.coins + ' تأیید بودجه</button><button class="btn btn-danger btn-sm" data-a="reject">' + I.x + ' رد</button><button class="btn btn-warn btn-sm" data-a="return">' + I.undo + ' بازگشت</button><button class="btn btn-ghost btn-sm" data-a="comment">' + I.comment + ' توضیح</button>';
      else if (role === 'applicant')
        btns += '<button class="btn btn-primary btn-sm" data-a="fix">' + I.edit + ' اصلاح و ارسال مجدد</button>';
      if (!role && canEditProgram(u, p))
        btns += '<button class="btn btn-ghost btn-sm" data-a="edit">' + I.edit + ' ویرایش</button>';
      const w = cartWaitInfo(p);
      return '<div class="cart-item">' +
        (ar ? '<label class="ci-check" title="انتخاب برای اقدام گروهی"><input type="checkbox" data-csel="' + p.code + '"' + (cartSel[p.code] ? ' checked' : '') + '></label>' : '') +
        '<div class="ci-main">' +
        '<div class="ci-t" data-v="' + p.code + '">' + esc(p.title) + statusBadge(p.status) + '</div>' +
        '<div class="ci-meta">' +
        '<span>' + smIc(I.file) + ' ' + toFa(p.code) + '</span>' +

        '<span>' + esc(mgmtName(p.mgmtId)) + ' / ' + esc(unitName(p.unitId)) + '</span>' +
        '<span>متقاضی: ' + esc(personName(p.applicantId)) + '</span>' +
        '<span class="ci-amt">' + fmtInt(t.est) + ' ' + esc(CUR()) + '</span>' +
        '<span>' + toFa(t.count) + ' ریزتقاضا</span>' +
        (p.submittedAt ? '<span>' + smIc(I.calendar) + ' ' + fmtJStr(p.submittedAt) + '</span>' : '') +
        (w ? '<span class="ci-wait' + (p.status === 'rejected' ? ' ci-wait-red' : '') + '">' + smIc(I.clock) + ' ' + esc(w) + '</span>' : '') +

  /* سوابق اقدامات من */
  const vis = visiblePrograms(u);

  let histRows = [];

  histRows.sort((a, b) => (b.hh.date + b.hh.time).localeCompare(a.hh.date + a.hh.time));
  html += '<div class="panel"><div class="panel-h"><span class="panel-t">' + I.clock + ' سوابق اقدامات شما</span><span class="chip chip-soft">' + toFa(histRows.length) + ' مورد' + (histRows.length > 15 ? ' — ۱۵ مورد اخیر' : '') + '</span></div>' +
    '<div class="panel-b tight"><div class="tbl-scroll"><table class="tbl"><thead><tr><th>تاریخ و ساعت</th><th>برنامه</th><th>اقدام</th><th>توضیحات</th><th>عملیات</th></tr></thead><tbody>' +
    (histRows.slice(0, 15).map(r => '<tr><td>' + fmtDT(r.hh.date, r.hh.time) + '</td><td class="ttl-cell" title="' + esc(r.p.title) + '">' + esc(r.p.title) + '</td><td>' + esc(r.hh.action) + '</td><td style="white-space:normal;max-width:300px">' + esc(r.hh.comment || '—') + '</td>' +
      '<td><button class="btn btn-ghost btn-sm" data-v="' + r.p.code + '">' + I.eye + ' مشاهده</button></td></tr>').join('') || '') +

  /* اعلان‌های اخیر من — میان‌بر کارتابل به اعلان‌ها با پرش مستقیم به برنامه */
  const myN = (db.notifs || []).filter(n => n.to === u.id).slice(-5).reverse();
  const unreadN = (db.notifs || []).filter(n => n.to === u.id && !n.read).length;
  html += '<div class="panel"><div class="panel-h"><span class="panel-t">' + I.bell + ' اعلان‌های اخیر من</span>' +
    '<span class="ph-actions"><span class="chip chip-soft">' + toFa(unreadN) + ' خوانده‌نشده</span>' +
    '<button type="button" class="btn btn-outline btn-sm" id="cartNotifAll">' + I.bell + ' همه اعلان‌ها</button></span></div>' +
    '<div class="panel-b">' + (myN.length ? myN.map(n =>
      '<div class="notif-mini' + (!n.read ? ' unread' : '') + '" data-nid="' + n.id + '" data-ncode="' + (n.code || '') + '">' +
      '<div class="nm-ic ' + (n.cls || 'ic-info') + '">' + (I[n.icon] || I.bell) + '</div>' +
      '<div><div class="nm-t">' + esc(n.text) + '</div><div class="nm-m">' + fmtJStr(n.date) + (n.time ? ' — ساعت ' + toFa(n.time) : '') + '</div></div></div>').join('') :
      '<div class="empty" style="padding:20px">' + I.bell + '<div class="e-t">اعلانی ثبت نشده است</div></div>') + '</div></div>';

  /* نوار اقدام گروهی (ثابت پایین صفحه) */
  html += '<div class="bulk-bar" id="bulkBar"></div>';

  mc.innerHTML = html;

  makeDD($('#cartF-year'), { options: [{ v: '', label: 'همه سال‌ها' }].concat(activeYears().map(y => ({ v: String(y), label: toFa(y) }))), value: cartFY, placeholder: 'همه', onChange: v => { cartFY = v; renderCart(); } });
  makeDD($('#cartSortDD'), { options: CART_SORTS.map(s => ({ v: s.v, label: s.t })), value: cartSort, placeholder: 'مرتب‌سازی', onChange: v => { cartSort = v; renderCart(); } });
  makeDD($('#cartF-mgmt'), { options: [{ v: '', label: 'همه مدیریت‌ها' }].concat(visibleMgmts(u).map(x => ({ v: x.id, label: x.name }))), value: cartFM, placeholder: 'همه', onChange: v => { cartFM = v; renderCart(); } });

/* ---- کارتابل: فیلتر مشترک لیست (برای رندر و «انتخاب همه») ---- */
function cartListFor(u, src){
  const base = src.base, sent = src.sent;
  const bySt = st => base.filter(p => p.status === st);
  let list = cartTab === 'in' ? src.inbox : cartTab === 'sent' ? sent : cartTab === 'all' ? base : bySt(cartTab);
  if (cartQ){
    const q = toEn(cartQ).trim().toLowerCase();
    list = list.filter(p => p.title.toLowerCase().indexOf(q) !== -1 || String(p.code).toLowerCase().indexOf(q) !== -1 || toFa(p.code).indexOf(q) !== -1 ||
      personName(p.applicantId).toLowerCase().indexOf(q) !== -1 || mgmtName(p.mgmtId).toLowerCase().indexOf(q) !== -1 || unitName(p.unitId).toLowerCase().indexOf(q) !== -1);
  }
  if (cartFY) list = list.filter(p => String(p.year) === String(cartFY));
  if (cartFM) list = list.filter(p => p.mgmtId === cartFM);
  return list;
}
function cartToggleSelAll(){
  const u = curUser(); if (!u) return;
  const base = cartItems(u);
  const inbox = cartInbox(u);
  const sent = base.filter(p => cartIsSent(u, p));
  const eligible = cartListFor(u, { inbox: inbox, sent: sent, base: base }).filter(p => cartActRole(u, p));
  const allSel = eligible.length > 0 && eligible.every(p => cartSel[p.code]);
  eligible.forEach(p => { if (allSel) delete cartSel[p.code]; else cartSel[p.code] = 1; });
  renderCart();
}
/* ---- نوار اقدام گروهی ---- */
function cartBulkBarRender(){
  const bar = $('#bulkBar'); if (!bar) return;

  cartSel = {}; items.forEach(p => { cartSel[p.code] = 1; }); /* پاکسازی انتخاب‌های نامعتبر */
  if (!items.length){ bar.className = 'bulk-bar'; bar.innerHTML = ''; document.body.classList.remove('bulk-on'); return; }
  const roles = items.map(p => cartRole(u, p));

  bar.className = 'bulk-bar on';
  document.body.classList.add('bulk-on');
  bar.innerHTML = '<span class="bb-n">' + I.checkC + ' <b>' + toFa(items.length) + '</b>&nbsp;مورد انتخاب شده</span>' +
    '<button type="button" class="btn btn-sm btn-b" data-bk="approve">' + I.checkC + ' تأیید گروهی</button>' +
    '<button type="button" class="btn btn-sm btn-b" data-bk="return">' + I.undo + ' بازگشت گروهی</button>' +
    (canReject ? '<button type="button" class="btn btn-sm btn-b" data-bk="reject">' + I.xC + ' رد گروهی</button>' : '') +
    '<button type="button" class="btn btn-sm btn-b" data-bk="clear">' + I.x + ' لغو انتخاب</button>';
  $$('[data-bk]', bar).forEach(b => b.addEventListener('click', () => {
    const k = b.getAttribute('data-bk');
    if (k === 'clear'){ cartClearSel(); renderCart(); return; }

function doBulkDecision(items, kind){
  const u = curUser();
  const body = modalStack[modalStack.length - 1].ov;
  const hasBudget = items.some(p => cartRole(u, p) === 'budget');
  const com = $('#dmCom', body) ? $('#dmCom', body).value.trim() : '';
  let bh = '', pt = '';
  if (kind === 'approve' && hasBudget){
    bh = dmBHsel ? dmBHsel.value : ''; pt = dmPTsel ? dmPTsel.value : '';
    if (!bh){ setFieldError(body, 'b-bh', 'انتخاب سرفصل بودجه الزامی است'); toast('انتخاب سرفصل بودجه الزامی است', 'error'); return; }
    if (!pt){ setFieldError(body, 'b-pt', 'انتخاب نوع برنامه الزامی است'); toast('انتخاب نوع برنامه الزامی است', 'error'); return; }
  }
  if ((kind === 'reject' || kind === 'return') && (!$('#dmRsn', body) || !$('#dmRsn', body).value.trim())){
    setFieldError(body, 'b-rsn', 'ثبت دلیل الزامی است');
    toast('ثبت دلیل برای این اقدام الزامی است', 'error');
    return;
  }
  const rsn = $('#dmRsn', body) ? $('#dmRsn', body).value.trim() : '';
  const sig = kind === 'approve' ? sigRecordCurrent() : null;
  const labelFor = (role, k) => {
    if (k === 'approve') return role === 'committer' ? 'تأیید و ارجاع به مدیر ارشد' : role === 'senior' ? 'تأیید و ارجاع به کنترل بودجه' : 'تأیید بودجه';
    if (k === 'reject') return 'رد درخواست';
    return 'بازگشت برای اصلاح';
  };
  let done = 0;
  items.forEach(p => {
    const role = cartRole(u, p); if (!role) return;
    if (kind === 'reject' && role !== 'senior' && role !== 'budget') return;
    const from = p.status;
    if (kind === 'approve'){
      if (role === 'committer') p.status = 'pending_senior';
      else if (role === 'senior') p.status = 'pending_budget';
      else if (role === 'budget'){
        p.status = 'approved';
        const t = progTotals(p);
        p.suggestedAmount = p.suggestedAmount || t.est;
        p.approvedAmount = p.approvedAmount || t.est;
        p.budgetHeadId = bh; p.programTypeId = pt;
        pushNotif([p.applicantId, p.committerId, p.seniorManagerId],
          'برنامه «' + p.title + '» (' + toFa(p.code) + ') تأیید نهایی شد و ریزتقاضاهای آن در اولویت‌بندی بودجه قرار گرفت.',
          { code: p.code, cls: 'ic-green', icon: 'checkC', sub: 'مبلغ تأییدشده: ' + fmtInt(p.approvedAmount) + ' ' + CUR() });
      }
    }
    else if (kind === 'reject') p.status = 'rejected';
    else if (kind === 'return') p.status = 'returned';
    /* امضا فقط برای اقدام تأیید متعهد/مدیر ارشد ثبت می‌شود (همسان با اقدام تکی) */
    pushHist(p, labelFor(role, kind), kind === 'approve' ? com : rsn, from, p.status, { actedRole: role, sig: (kind === 'approve' && (role === 'committer' || role === 'senior')) ? sig : null });
    /* اعلان گردش کار برای هر برنامه (همسان با اقدام تکی) */
    if (kind === 'approve' && role === 'committer')
      wfNotify(p, [p.applicantId, p.seniorManagerId],
        'برنامه «' + p.title + '» (' + toFa(p.code) + ') توسط متعهد تأیید و به مدیر ارشد ارجاع شد.',
        { cls: 'ic-green', icon: 'checkC', sub: 'در انتظار تصمیم مدیر ارشد در کارتابل' });
    else if (kind === 'approve' && role === 'senior')
      wfNotify(p, [p.applicantId, p.committerId].concat(budgetUserIds()),
        'برنامه «' + p.title + '» (' + toFa(p.code) + ') توسط مدیر ارشد تأیید و به مسئول کنترل بودجه ارجاع شد.',
        { cls: 'ic-green', icon: 'checkC', sub: 'در انتظار تصمیم کنترل بودجه در کارتابل' });
    else if (kind === 'reject')
      wfNotify(p, [p.applicantId, p.committerId, p.seniorManagerId],
        'برنامه «' + p.title + '» (' + toFa(p.code) + ') رد شد.',
        { cls: 'ic-red', icon: 'xC', sub: 'دلیل: ' + (truncReason(rsn) || 'ثبت نشده') });
    else if (kind === 'return')
      wfNotify(p, [p.applicantId, p.createdBy],
        'برنامه «' + p.title + '» (' + toFa(p.code) + ') برای اصلاح به متقاضی بازگشت.',
        { cls: 'ic-orange', icon: 'undo', sub: 'دلیل: ' + (truncReason(rsn) || 'ثبت نشده') });
    done++;
  });
  saveDB(true);
  closeTopModal(true);
  cartClearSel();
  toast('اقدام گروهی روی ' + toFa(done) + ' برنامه ثبت شد', 'success');
  renderCart();
  buildSidebar();
  updateHeader();
}
/* ---- خروجی CSV و چاپ کارتابل ---- */
function cartExport(list, tabT){
  if (!list.length){ toast('فهرست خالی است؛ خروجی CSV امکان‌پذیر نیست', 'warn'); return; }
  const rows = list.map(p => {
    const t = progTotals(p);
    const lt = cartLastTouch(p);
    return [p.code, p.title, p.year, mgmtName(p.mgmtId), unitName(p.unitId), personName(p.applicantId), personName(p.committerId), statusLabel(p.status),
      t.est, p.approvedAmount || 0, t.count, p.submittedAt ? fmtJStr(p.submittedAt) : '—',
      lt ? fmtJStr(lt.slice(0, 10)) + ' ' + toFa(lt.split(' ')[1] || '') : '—'];
  });
  exportCSV('کارتابل-' + tabT + '.csv',
    ['شناسه', 'عنوان', 'سال', 'مدیریت', 'واحد', 'متقاضی', 'متعهد', 'وضعیت', 'مبلغ برآورد (' + CUR() + ')', 'مبلغ تأییدشده (' + CUR() + ')', 'تعداد ریزتقاضا', 'تاریخ ارسال', 'آخرین فعالیت'],
    rows);
}
function cartPrint(list, tabT){
  if (!list.length){ toast('فهرست خالی است؛ چاپ امکان‌پذیر نیست', 'warn'); return; }
  const rows = list.map(p => {
    const t = progTotals(p);
    return '<tr><td>' + esc(p.code) + '</td><td>' + esc(p.title) + '</td><td>' + esc(mgmtName(p.mgmtId)) + ' / ' + esc(unitName(p.unitId)) + '</td><td>' + esc(personName(p.applicantId)) + '</td><td>' + esc(statusLabel(p.status)) + '</td><td style="text-align:left">' + fmtInt(t.est) + '</td><td>' + toFa(t.count) + '</td></tr>';
  }).join('');
  printHTML(prTitle('cart', 'کارتابل') + ' — ' + tabT, '<div class="pr-sec">فهرست برنامه‌ها — ' + toFa(list.length) + ' مورد</div>' +
    '<table><thead><tr><th>شناسه</th><th>عنوان</th><th>مدیریت / واحد</th><th>متقاضی</th><th>وضعیت</th><th>مبلغ برآورد</th><th>ریزتقاضا</th></tr></thead><tbody>' + rows + '</tbody></table>');
}

  makeDD($('#rf-year'), { options: [{ v: '', label: 'همه سال‌ها' }].concat(activeYears().map(y => ({ v: String(y), label: toFa(y) }))), value: repF.year, placeholder: 'همه', onChange: v => { repF.year = v; renderReports(); } });

/* ================================================================
   بخش ۱۳ — مدیریت کاربران و پروفایل من
   ================================================================ */
let usersQ = '';
/* ================================================================
   بخش ۱۳-E — امضای کاربران (بارگذاری فقط توسط مدیر سایت)
   هر کاربر دو امضا دارد: «امضای اصلی» + «امضا از طرف»
   فرمت مجاز: jpg / jpeg / png / gif — در LocalStorage نگهداری می‌شود
   ================================================================ */
const SIG_MIME = ['image/jpeg','image/jpg','image/png','image/gif'];
const SIG_EXT  = ['jpg','jpeg','png','gif'];
function sigOf(u){ return { main: (u && u.sigMain) || '', onBehalf: (u && u.sigOnBehalf) || '' }; }
function sigLabel(kind){ return kind === 'onBehalf' ? 'امضا از طرف' : 'امضای اصلی'; }
function hasAnySig(u){ const s = sigOf(u); return !!(s.main || s.onBehalf); }
/* رکورد امضای انتخاب‌شده کاربر جاری — تصویر به‌صورت اسنپ‌شات در تاریخچه ثبت می‌شود */
function sigRecordCurrent(){
  if (!sigPick) return null;
  const s = sigOf(curUser());
  const img = sigPick === 'onBehalf' ? s.onBehalf : s.main;
  return img ? { kind: sigPick, img } : null;
}
/* خواندن و اعتبارسنجی فایل امضا + کوچک‌سازی خودکار در صورت نیاز */
function sigFromFile(file, cb){
  if (!file) return;
  const ext = ((file.name || '').split('.').pop() || '').toLowerCase();
  if (SIG_MIME.indexOf(file.type) === -1 && SIG_EXT.indexOf(ext) === -1){
    toast('فرمت امضا باید jpeg، jpg، png یا gif باشد', 'error'); return;
  }
  if (file.size > 3 * 1024 * 1024){ toast('حجم فایل امضا باید کمتر از ۳ مگابایت باشد', 'error'); return; }
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
      if (!w || !h){ toast('تصویر امضا معتبر نیست', 'error'); return; }
      let data = rd.result;
      if (data.length > 140000 || Math.max(w, h) > 560){
        const sc = Math.min(560 / Math.max(w, h), 1);
        const cv = document.createElement('canvas');
        cv.width = Math.max(Math.round(w * sc), 1);
        cv.height = Math.max(Math.round(h * sc), 1);
        const cx = cv.getContext('2d');
        const isJpg = /image\/jpe?g/.test(file.type) || ext === 'jpg' || ext === 'jpeg';
        if (isJpg){ cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); }
        cx.drawImage(img, 0, 0, cv.width, cv.height);
        try { data = cv.toDataURL(isJpg ? 'image/jpeg' : 'image/png', 0.9); } catch (e){ toast('پردازش تصویر امضا ممکن نشد', 'error'); return; }
      }
      if (data.length > 220000){ toast('تصویر امضا پس از کوچک‌سازی همچنان بزرگ است؛ تصویر ساده‌تری انتخاب کنید', 'warn'); return; }
      cb(data);
    };
    img.onerror = () => toast('فایل انتخاب‌شده تصویر امضای معتبری نیست', 'error');
    img.src = rd.result;
  };
  rd.onerror = () => toast('خواندن فایل ممکن نشد', 'error');
  rd.readAsDataURL(file);
}
/* انتخابگر امضا هنگام تأیید (متقاضی / متعهد / مدیر ارشد) */
let sigPick = null;
function sigPickerHTML(u){
  const s = sigOf(u);
  const cards = [ { k: 'main', img: s.main }, { k: 'onBehalf', img: s.onBehalf } ];
  if (!s.main && !s.onBehalf)
    return '<div class="warn-box" style="margin:6px 0 0">' + I.alert + '<span>هیچ امضایی برای شما بارگذاری نشده است؛ اقدام شما بدون امضا ثبت می‌شود. برای افزودن امضا با مدیر سایت هماهنگ شوید (مدیریت سایت ← امضای کاربران).</span></div>';
  if (!sigPick) sigPick = s.main ? 'main' : (s.onBehalf ? 'onBehalf' : '');
  return '<div class="sig-pick" id="sigPick">' + cards.map(c =>

/* ---- پردازش و کوچک‌سازی تصویر پروفایل (LocalStorage پسند) ---- */
function userAvatarFromFile(file, maxPx, cb){
  if (!file) return;
  if (!/^image\//.test(file.type)){ toast('فقط فایل تصویری انتخاب کنید', 'error'); return; }
  if (file.size > 4 * 1024 * 1024){ toast('حجم تصویر باید کمتر از ۴ مگابایت باشد', 'error'); return; }
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
      if (!w || !h){ toast('تصویر معتبر نیست', 'error'); return; }
      const px = maxPx || 192;
      const sc = Math.min(px / w, px / h, 1);
      const cv = document.createElement('canvas');
      cv.width = Math.max(Math.round(w * sc), 1);
      cv.height = Math.max(Math.round(h * sc), 1);
      const cx = cv.getContext('2d');
      cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
      cx.drawImage(img, 0, 0, cv.width, cv.height);
      let data;
      try { data = cv.toDataURL('image/jpeg', 0.85); } catch (e){ toast('پردازش تصویر ممکن نشد', 'error'); return; }
      if (data.length > 90000){ toast('تصویر پس از کوچک‌سازی همچنان بزرگ است؛ تصویر ساده‌تری انتخاب کنید', 'warn'); return; }
      cb(data);
    };
    img.onerror = () => toast('فایل انتخاب‌شده تصویر معتبری نیست', 'error');
    img.src = rd.result;
  };
  rd.onerror = () => toast('خواندن فایل ممکن نشد', 'error');
  rd.readAsDataURL(file);
}

/* ================================================================
   بخش ۱۳-C — افزودن گروهی کاربران از اکسل (xlsx / csv / کپی-پیست)
   بدون هیچ وابستگی خارجی: خواننده ZIP+XML و سازنده قالب xlsx داخلی

/* ---- نرمال‌سازی متن فارسی برای تطبیق سرستون‌ها و نقش‌ها ---- */
function impNorm(s){
  return String(s === null || s === undefined ? '' : s)
    .replace(/[\u200c\u200f\u200e\uFEFF]/g, '')
    .replace(/[\u064A\u0649]/g, 'ی').replace(/\u0643/g, 'ک')
    .replace(/[\u064B-\u065F\u0670]/g, '')
    .replace(/\s+/g, ' ').trim().toLowerCase();
}

  { key: 'username',  label: 'نام کاربری',    req: true,  syn: ['نام کاربری', 'username', 'یوزرنیم', 'شناسه کاربری'] },

];
const IMP_ROLE_ALIASES = [
  ['admin',     ['مدیر سایت', 'مدیرسایت', 'سایت', 'admin', 'site admin']],
  ['applicant', ['متقاضی', 'درخواست دهنده', 'applicant']],
