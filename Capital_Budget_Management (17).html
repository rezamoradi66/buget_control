];
/* چندنقشی در ورود گروهی: «متعهد / مدیر ارشد» یا «متعهد، مدیر ارشد» یا «متعهد و مدیر ارشد» */
function impRolesFromStr(s){
  const parts = String(s || '').split(/[،,;/+&]| و /).map(x => impRoleFromStr(x)).filter(Boolean);
  const uniq = [];
  parts.forEach(p => { if (uniq.indexOf(p) === -1) uniq.push(p); });
  return uniq;
}
function impRoleFromStr(s){
  const t = impNorm(s);
  if (!t) return '';
  for (let i = 0; i < IMP_ROLE_ALIASES.length; i++){
    if (IMP_ROLE_ALIASES[i][1].some(a => impNorm(a) === t)) return IMP_ROLE_ALIASES[i][0];
  }
  return '';
}
function impColLetter(i){ let s = ''; i++; while (i > 0){ const r = (i - 1) % 26; s = String.fromCharCode(65 + r) + s; i = Math.floor((i - 1) / 26); } return s; }
function impColIdx(s){ let n = 0; for (let i = 0; i < s.length; i++) n = n * 26 + (s.charCodeAt(i) - 64); return n - 1; }
function impXesc(s){ return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

/* ---------------- خواندن XLSX (ZIP + XML) ---------------- */
async function impXlsxToRows(buf){
  const u8 = new Uint8Array(buf);
  if (u8.length < 60) throw new Error('فایل خالی یا خراب است');
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let eo = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--){
    if (dv.getUint32(i, true) === 0x06054b50){ eo = i; break; }
  }
  if (eo < 0) throw new Error('این فایل یک کتابچه اکسل معتبر نیست. اگر فرمت قدیمی xls است، آن را در اکسل با فرمت xlsx یا CSV ذخیره کنید.');
  const td = new TextDecoder('utf-8');
  const cnt = dv.getUint16(eo + 10, true);
  let p = dv.getUint32(eo + 16, true);
  const entries = {};
  for (let i = 0; i < cnt; i++){
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const lho = dv.getUint32(p + 42, true);
    const name = td.decode(new Uint8Array(u8.buffer, u8.byteOffset + p + 46, nlen));
    const lnlen = dv.getUint16(lho + 26, true), lelen = dv.getUint16(lho + 28, true);
    const start = lho + 30 + lnlen + lelen;
    entries[name] = { method, data: new Uint8Array(u8.buffer, u8.byteOffset + start, csize) };
    p += 46 + nlen + elen + clen;
  }
  async function entryText(name){
    const e = entries[name];
    if (!e) return null;
    if (e.method === 0) return td.decode(e.data);
    if (e.method === 8){
      if (typeof DecompressionStream === 'undefined') throw new Error('مرورگر شما از بازکردن فایل xlsx پشتیبانی نمی‌کند؛ لطفاً از قالب CSV استفاده کنید.');
      const st = new Blob([e.data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return td.decode(await new Response(st).arrayBuffer());
    }
    throw new Error('روش فشرده‌سازی فایل پشتیبانی نمی‌شود (فقط Store/Deflate).');
  }
  const wbXml = await entryText('xl/workbook.xml');
  if (!wbXml) throw new Error('ساختار فایل اکسل معتبر نیست.');
  let sheetPath = null;
  try {
    const wdoc = new DOMParser().parseFromString(wbXml, 'application/xml');
    const sh = wdoc.getElementsByTagName('sheet')[0];
    if (sh){
      let rid = sh.getAttribute('r:id') || '';
      if (!rid) Array.from(sh.attributes).forEach(a => { if (/:id$/.test(a.name)) rid = a.value; });
      const relsXml = await entryText('xl/_rels/workbook.xml.rels');
      if (rid && relsXml){
        const rdoc = new DOMParser().parseFromString(relsXml, 'application/xml');
        Array.from(rdoc.getElementsByTagName('Relationship')).forEach(r => {
          if (r.getAttribute('Id') === rid) sheetPath = r.getAttribute('Target') || '';
        });
      }
    }
  } catch (e) {}
  if (!sheetPath) sheetPath = Object.keys(entries).filter(n => /^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort()[0] || '';
  if (!sheetPath) throw new Error('برگه‌ای در فایل اکسل یافت نشد.');
  sheetPath = sheetPath.replace(/^\/+/, '');
  if (sheetPath.indexOf('xl/') !== 0) sheetPath = 'xl/' + sheetPath;
  const sheetXml = await entryText(sheetPath);
  if (!sheetXml) throw new Error('محتوای برگه اکسل خوانده نشد.');
  let shared = [];
  const sXml = await entryText('xl/sharedStrings.xml');
  if (sXml){
    try {
      const sdoc = new DOMParser().parseFromString(sXml, 'application/xml');
      shared = Array.from(sdoc.getElementsByTagName('si')).map(si => si.textContent || '');
    } catch (e) {}
  }
  const doc = new DOMParser().parseFromString(sheetXml, 'application/xml');
  const rows = [];
  Array.from(doc.getElementsByTagName('row')).forEach(r => {
    const arr = [];
    Array.from(r.getElementsByTagName('c')).forEach(c => {
      const ref = c.getAttribute('r') || '';
      const m = ref.match(/^([A-Za-z]+)/);
      const col = m ? impColIdx(m[1].toUpperCase()) : arr.length;
      let val = '';
      const t = c.getAttribute('t');
      if (t === 'inlineStr'){
        const iEl = c.getElementsByTagName('is')[0];
        val = iEl ? (iEl.textContent || '') : '';
      } else {
        const vEl = c.getElementsByTagName('v')[0];
        if (vEl){
          val = vEl.textContent || '';
          if (t === 's') val = shared[+val] !== undefined ? shared[+val] : '';
        }
      }
      if (col >= 0) arr[col] = val;
    });
    for (let i = 0; i < arr.length; i++) if (arr[i] === undefined) arr[i] = '';
    if (arr.some(v => String(v).trim() !== '')) rows.push(arr);
  });
  return rows;
}

/* ---------------- سازنده قالب XLSX (ZIP بدون فشرده‌سازی) ---------------- */
const IMP_CRC_T = (function(){
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; }
  return t;
})();
function impCrc32(u8){ let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = IMP_CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function impBuildZip(files){
  const te = new TextEncoder();
  const u16 = v => new Uint8Array([v & 255, (v >>> 8) & 255]);
  const u32 = v => new Uint8Array([v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255]);
  const cat = arrs => { let len = 0; arrs.forEach(a => len += a.length); const o = new Uint8Array(len); let q = 0; arrs.forEach(a => { o.set(a, q); q += a.length; }); return o; };
  const DT = 0x5D4F, DD = 0x5C21;
  const locals = [], centrals = [];
  let off = 0, n = 0;
  Object.keys(files).forEach(name => {
    const nd = te.encode(name), data = te.encode(files[name]);
    const crc = impCrc32(data);
    const local = cat([u32(0x04034b50), u16(20), u16(0), u16(0), u16(DT), u16(DD), u32(crc), u32(data.length), u32(data.length), u16(nd.length), u16(0), nd]);
    locals.push(local, data);
    centrals.push(cat([u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(DT), u16(DD), u32(crc), u32(data.length), u32(data.length), u16(nd.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(off), nd]));
    off += local.length + data.length;
    n++;
  });
  const cd = cat(centrals);
  const eocd = cat([u32(0x06054b50), u16(0), u16(0), u16(n), u16(n), u32(cd.length), u32(off), u16(0)]);
  return new Blob(locals.concat([cd, eocd]), { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}
function impSheetXML(rows){
  let body = '';
  rows.forEach((r, ri) => {
    let cells = '';
    r.forEach((v, ci) => { cells += '<c r="' + impColLetter(ci) + (ri + 1) + '" t="inlineStr"><is><t xml:space="preserve">' + impXesc(v) + '</t></is></c>'; });
    body += '<row r="' + (ri + 1) + '">' + cells + '</row>';
  });
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<sheetViews><sheetView workbookViewId="0" rightToLeft="1"/></sheetViews>' +
    '<sheetData>' + body + '</sheetData></worksheet>';
}

function impDownloadBlob(name, blob){

/* ================================================================

  units:       { title: 'واحدها',    cols: [ { k: 'name', label: 'عنوان واحد', syn: ['عنوان واحد','نام واحد','عنوان','نام'], req: 1 },
                                      { k: 'mgmtName', label: 'مدیریت مرتبط', syn: ['مدیریت مرتبط','مدیریت','نام مدیریت'], req: 1 } ] },
  years:       { title: 'سال‌های بودجه', cols: [ { k: 'y', label: 'سال', syn: ['سال','سال بودجه'], req: 1 } ] }

let limpCatsReady = false;
function limpEnsureCats(){
  /* دسته‌های ساده از BASE_CATS ساخته می‌شوند — در زمان اجرا (بعد از بارگذاری کامل اسکریپت) */
  if (limpCatsReady) return;
  LIMP_SIMPLE_CATS.forEach(k => {
    const c = (typeof BASE_CATS !== 'undefined' ? BASE_CATS : []).find(x => x.key === k);
    if (c && !LIMP_CATS[k]) LIMP_CATS[k] = { title: c.title, cols: [ { k: 'name', label: 'عنوان', syn: ['عنوان','نام','عنوان ' + c.title,'نام ' + c.title], req: 1 } ] };
  });
  limpCatsReady = true;
}
const LIMP_TPL_SAMPLES = {
  managements: [['معاونت برنامه‌ریزی و توسعه','فعال'],['مدیریت HSE','فعال']],
  units: [['برنامه‌ریزی و بودجه','معاونت برنامه‌ریزی و توسعه','فعال'],['ایمنی و آتش‌نشانی','مدیریت HSE','فعال']],
  years: [['1405','فعال'],['1406','فعال']],
  budgetHeads: [['هزینه‌های جاری و عملیاتی','فعال'],['سرمایه‌گذاری زیرساختی','فعال']],
  programTypes: [['پروژه عمرانی','فعال'],['تدارکات و خرید','فعال']],
  requestTypes: [['پروژه','فعال'],['خرید','فعال']]
};
function limpTplRows(cat){
  const cfg = LIMP_CATS[cat];
  const head = cfg.cols.map(c => c.label);
  if (cat !== 'years') head.push('وضعیت');
  const samples = LIMP_TPL_SAMPLES[cat] || [['نمونه یک','فعال'],['نمونه دو','فعال']];
  return [head].concat(samples.map(s => {
    const row = s.slice(0, cfg.cols.length);
    if (cat !== 'years') row.push('فعال');
    return row;
  }));
}

  if (!cfg){ toast('این دسته از ورود اکسل پشتیبانی نمی‌شود', 'error'); return; }

    h += '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">' +

      });

      limp.cfg.cols.forEach(c => {

    (okRows.length ? '<button class="btn btn-success" id="limpCommit">' + I.checkC + ' ثبت ' + toFa(okRows.length) + ' مورد</button>' : '') +

function limpChip(st){
  return st === 'ok' ? '<span class="chip st-green">آماده ثبت</span>'
    : st === 'warn' ? '<span class="chip st-amber">هشدار</span>'
    : '<span class="chip st-red">خطا</span>';
}
function limpHandleFile(file){
  if (!file) return;
  const name = (file.name || '').toLowerCase();
  const isX = /\.xlsx$/.test(name), isC = /\.(csv|txt|tsv)$/.test(name);
  if (/\.xls$/.test(name) && !isX){ toast('فرمت قدیمی xls پشتیبانی نمی‌شود؛ در اکسل Save As ← xlsx یا CSV بزنید', 'error'); return; }
  if (!isX && !isC){ toast('فقط فایل xlsx یا csv پذیرفته می‌شود', 'error'); return; }
  limp.busy = true; limpRender();
  if (isX){
    file.arrayBuffer()
      .then(buf => impXlsxToRows(buf))
      .then(rows => limpFinishData(rows))
      .catch(e => { limp.busy = false; limpRender(); toast(e && e.message ? e.message : 'خواندن فایل اکسل ممکن نشد', 'error'); });
  } else {
    const r = new FileReader();
    r.onload = () => { try { limpFinishData(impParseTable(String(r.result))); } catch (e){ limp.busy = false; limpRender(); toast('خواندن فایل CSV ممکن نشد', 'error'); } };
    r.onerror = () => { limp.busy = false; limpRender(); toast('خواندن فایل ممکن نشد', 'error'); };
    r.readAsText(file, 'utf-8');
  }
}
function limpFinishData(rows){
  if (!rows || !rows.length){ limp.busy = false; limpRender(); toast('داده‌ای در فایل یافت نشد', 'error'); return; }
  limp.raw = rows;
  limp.headerRow = limpLooksHeaderGen(rows, limp.cfg);
  limp.map = limpAutoMapGen(rows, limp.cfg);
  limp.stage = 'map';
  limp.busy = false;
  limpRender();
}
function limpLooksHeaderGen(rows, cfg){
  if (!rows.length) return false;
  const j = (rows[0] || []).map(x => impNorm(x));
  let hits = 0;
  cfg.cols.forEach(c => c.syn.forEach(s => { if (j.indexOf(impNorm(s)) !== -1) hits++; }));
  return hits >= Math.min(cfg.cols.length, 1) && hits > 0;
}
function limpAutoMapGen(rows, cfg){
  const head = (rows[0] || []).map(h => impNorm(h));
  const used = {}, map = {};
  cfg.cols.forEach(c => {
    for (let ci = 0; ci < head.length; ci++){
      if (used[ci]) continue;
      if (c.syn.some(s => impNorm(s) === head[ci])){ map[c.k] = ci; used[ci] = 1; return; }
    }
  });
  cfg.cols.forEach(c => {
    if (map[c.k] !== undefined) return;
    for (let ci = 0; ci < head.length; ci++){
      if (used[ci]) continue;
      if (head[ci] && c.syn.some(s => head[ci].indexOf(impNorm(s)) !== -1)){ map[c.k] = ci; used[ci] = 1; return; }
    }
  });
  return map;
}
function limpValidate(){
  const cfg = limp.cfg, cat = limp.cat;
  const dataRows = limp.headerRow ? limp.raw.slice(1) : limp.raw.slice();
  const seen = {};
  limp.results = dataRows.map((r, ri) => {
    const rec = {};
    cfg.cols.forEach(c => { const ci = limp.map[c.k]; rec[c.k] = (ci === undefined || ci === null) ? '' : String(r[ci] === undefined ? '' : r[ci]).trim(); });
    rec.activeStr = '';
    /* ستون وضعیت اختیاری: اگر ستونی با عنوان «وضعیت» وجود داشته باشد اعمال می‌شود */
    const stCi = (r || []).findIndex((x, i) => impNorm(limp.raw[0] && limp.raw[0][i]) === 'وضعیت');
    if (stCi > -1) rec.activeStr = String(r[stCi] || '').trim();
    const notes = [];
    let status = 'ok', act = 'add';
    const err = m => { status = 'err'; notes.push(m); };
    const warn = m => { if (status !== 'err') status = 'warn'; notes.push(m); };
    let key = '';
    if (cat === 'years'){
      const y = toEn(rec.y);
      if (!y) err('سال خالی است');
      else if (!/^\d{4}$/.test(y)) err('سال باید عدد چهار رقمی باشد');
      else {
        key = y;
        if (seen[key]) err('سال در فایل تکراری است');
        else seen[key] = 1;
        if (db.base.years.some(x => String(x.y) === y)) err('سال ' + toFa(y) + ' قبلاً در سامانه ثبت شده است');
      }
      rec.y = toEn(rec.y);
    } else {
      if (!rec.name) err('عنوان خالی است');
      else if (rec.name.length > 120) err('عنوان حداکثر ۱۲۰ کاراکتر');
      else {
        key = impNorm(rec.name);
        if (seen[key]) err('عنوان در فایل تکراری است');
        else seen[key] = 1;
        const exists = (db.base[cat] || []).find(x => impNorm(x.name) === key);
        if (exists){
          if (limp.opts.updateExisting){ act = 'update'; rec._target = exists; warn('مورد موجود به‌روزرسانی می‌شود'); }
          else { act = 'skip'; warn('مورد هم‌نام موجود است — نادیده گرفته می‌شود'); }
        }
      }
      if (cat === 'units'){
        if (!rec.mgmtName) err('مدیریت مرتبط خالی است');
        else {
          const mg = db.base.managements.find(x => impNorm(x.name) === impNorm(rec.mgmtName));
          if (mg) rec._mgmtId = mg.id;
          else if (limp.opts.createMgmt){ rec._newMgmt = rec.mgmtName; warn('مدیریت جدید «' + rec.mgmtName + '» ایجاد می‌شود'); }
          else err('مدیریت «' + rec.mgmtName + '» یافت نشد (یا گزینه ایجاد خودکار را فعال کنید)');
        }
      }
    }
    rec._active = /غیرفعال|خیر|نه|no|off/i.test(rec.activeStr) ? false : true;
    if (act === 'skip' && status === 'warn') status = 'warn';
    return { ri, rec, notes, status, act };
  });
}
function limpCommit(){
  const cat = limp.cat;
  let added = 0, updated = 0, skipped = 0;
  const newMgmts = [];
  /* اول مدیریت‌های جدید (برای واحدها) */
  limp.results.filter(r => r.status === 'ok' && r.rec._newMgmt).forEach(r => {
    const mg = db.base.managements.find(x => impNorm(x.name) === impNorm(r.rec._newMgmt));
    if (mg) r.rec._mgmtId = mg.id;
    else {
      const nm = { id: uid(), name: r.rec._newMgmt, active: true };
      db.base.managements.push(nm);
      newMgmts.push(nm.name);
      r.rec._mgmtId = nm.id;
    }
  });
  limp.results.forEach(r => {
    if (r.status !== 'ok') return;
    if (r.act === 'skip'){ skipped++; return; }
    if (cat === 'years'){
      if (!db.base.years.some(x => String(x.y) === r.rec.y)){ db.base.years.push({ y: +r.rec.y, active: true }); added++; }
      else skipped++;
      return;
    }
    const active = r.rec._active;
    if (r.act === 'update' && r.rec._target){
      Object.assign(r.rec._target, cat === 'units' ? { name: r.rec.name, mgmtId: r.rec._mgmtId || r.rec._target.mgmtId, active } : { name: r.rec.name, active });
      updated++;
    } else {
      if (cat === 'units') db.base.units.push({ id: uid(), mgmtId: r.rec._mgmtId, name: r.rec.name, active });
      else {
        if (!Array.isArray(db.base[cat])) db.base[cat] = [];
        db.base[cat].push({ id: uid(), name: r.rec.name, active });
      }
      added++;
    }
  });
  saveDB(true);
  closeTopModal(true);
  toast('ورود گروهی انجام شد: ' + toFa(added) + ' مورد جدید' + (updated ? '، ' + toFa(updated) + ' به‌روزرسانی' : '') + (skipped ? '، ' + toFa(skipped) + ' نادیده‌شده' : '') + (newMgmts.length ? '، ' + toFa(newMgmts.length) + ' مدیریت جدید' : ''), 'success');
  renderSiteBase();
}

}

/* ---------------- خواندن CSV/TSV (تشخیص جداکننده + کوتیشن) ---------------- */
function impParseTable(text){
  text = String(text || '').replace(/^\uFEFF/, '');
  if (!text.trim()) return [];
  const firstLine = (text.split(/\r?\n/)[0]) || '';
  let best = ',', bestC = 0;
  [',', ';', '\t', '|'].forEach(d => { const c = firstLine.split(d).length - 1; if (c > bestC){ bestC = c; best = d; } });
  const rows = []; let row = [], cur = '', inQ = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (inQ){
      if (ch === '"'){ if (text[i + 1] === '"'){ cur += '"'; i++; } else inQ = false; }
      else cur += ch;
    } else if (ch === '"'){ inQ = true; }
    else if (ch === best){ row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r'){
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(cur); cur = '';
      if (row.some(x => x.trim() !== '')) rows.push(row);
      row = [];
    } else cur += ch;
  }
  row.push(cur);
  if (row.some(x => x.trim() !== '')) rows.push(row);
  const w = Math.max.apply(null, rows.map(r => r.length));
  rows.forEach(r => { while (r.length < w) r.push(''); });
  return rows;
}

/* ---------------- حالت و مرحله‌های مودال ورود گروهی ---------------- */
let imp = null;
function openBulkImport(){
  imp = { tab: 'xlsx', stage: 'input', raw: null, dataRows: [], headerRow: true, map: {}, opts: { createUnits: true, updateExisting: false, defPass: '1234' }, results: [], busy: false, done: null, ov: null };
  imp.ov = openModal({
    title: 'افزودن گروهی کاربران از اکسل', icon: I.upload, size: 'lg',
    body: '<div id="impBody"></div>',
    footerButtons: [{ label: 'بستن', cls: 'btn-ghost', onClick: () => closeTopModal(true) }],
    onClose: () => { imp = null; }
  });
  impRender();
}
function impFinishData(rows){
  if (!rows || !rows.length){ imp.busy = false; impRender(); toast('داده‌ای در فایل یافت نشد', 'error'); return; }
  imp.raw = rows;
  imp.headerRow = impLooksHeader(rows);
  imp.map = impAutoMap(rows);
  imp.stage = 'map';
  imp.busy = false;
  impValidate();
  impRender();
}
function impHandleFile(file){
  if (!file) return;
  const name = (file.name || '').toLowerCase();
  const isX = /\.xlsx$/.test(name), isC = /\.(csv|txt|tsv)$/.test(name);
  if (/\.xls$/.test(name) && !isX){ toast('فرمت قدیمی xls پشتیبانی نمی‌شود؛ در اکسل گزینه Save As ← xlsx یا CSV UTF-8 را انتخاب کنید', 'error'); return; }
  if (!isX && !isC){ toast('فقط فایل xlsx یا csv پذیرفته می‌شود', 'error'); return; }
  imp.busy = true; impRender();
  if (isX){
    file.arrayBuffer()
      .then(buf => impXlsxToRows(buf))
      .then(rows => impFinishData(rows))
      .catch(e => { imp.busy = false; impRender(); toast(e && e.message ? e.message : 'خواندن فایل اکسل ممکن نشد', 'error'); });
  } else {
    const r = new FileReader();
    r.onload = () => {
      try { impFinishData(impParseTable(String(r.result))); }
      catch (e){ imp.busy = false; impRender(); toast('خواندن فایل CSV ممکن نشد', 'error'); }
    };
    r.onerror = () => { imp.busy = false; impRender(); toast('خواندن فایل ممکن نشد', 'error'); };
    r.readAsText(file, 'utf-8');
  }
}
function impLooksHeader(rows){
  if (!rows.length) return false;
  const j = impNorm(rows[0].join('|'));
  let hits = 0;
  IMP_FIELDS.forEach(f => f.syn.forEach(s => { if (j.indexOf(impNorm(s)) !== -1) hits++; }));
  return hits >= 2;
}
function impAutoMap(rows){
  const head = (rows[0] || []).map(h => impNorm(h));
  const used = {}, map = {};
  IMP_FIELDS.forEach(f => {
    for (let c = 0; c < head.length; c++){
      if (used[c]) continue;
      if (f.syn.some(s => impNorm(s) === head[c])){ map[f.key] = c; used[c] = 1; return; }
    }
  });
  IMP_FIELDS.forEach(f => {
    if (map[f.key] !== undefined) return;
    for (let c = 0; c < head.length; c++){
      if (used[c]) continue;
      if (head[c] && f.syn.some(s => head[c].indexOf(impNorm(s)) !== -1)){ map[f.key] = c; used[c] = 1; return; }
    }
  });
  return map;
}
function impDataRows(){
  return imp.headerRow ? imp.raw.slice(1) : imp.raw.slice();
}
function impValidate(){
  const st = imp;
  const defPass = st.opts.defPass || '1234';
  const findMgmt = n => db.base.managements.find(m => impNorm(m.name) === impNorm(n));
  const findUnitIn = (mgId, n) => db.base.units.find(u => u.mgmtId === mgId && impNorm(u.name) === impNorm(n));
  const findUnitAny = n => db.base.units.find(u => impNorm(u.name) === impNorm(n));
  const seenUser = {}, seenUno = {};
  st.dataRows = impDataRows();
  st.results = st.dataRows.map((r, ri) => {
    const rec = {};
    IMP_FIELDS.forEach(f => { const c = st.map[f.key]; rec[f.key] = (c === undefined || c === null) ? '' : String(r[c] === undefined ? '' : r[c]).trim(); });
    if (rec.fn && !rec.ln && rec.fn.indexOf(' ') !== -1){
      const parts = rec.fn.split(/\s+/);
      rec.ln = parts.pop(); rec.fn = parts.join(' ');
    }
    const notes = [];
    let status = 'ok';
    const err = m => { status = 'err'; notes.push(m); };
    const warn = m => { if (status !== 'err') status = 'warn'; notes.push(m); };
    if (rec.fn && rec.ln && rec.fn.split(/\s+/).length === 1 && rec.ln.split(/\s+/).length > 1){ /* noop */ }
    if (!rec.fn) err('نام خالی است');
    if (!rec.ln) err('نام خانوادگی خالی است');
    rec.username = toEn(rec.username).toLowerCase().replace(/\s+/g, '_');
    if (!rec.username) err('نام کاربری خالی است');
    if (!rec.pos) err('سمت سازمانی خالی است');
    if (!rec.mgmtName) err('مدیریت خالی است');
    if (!rec.unitName) err('واحد خالی است');
    if (!rec.rolesStr) err('نقش خالی است');
    if (rec.username && seenUser[rec.username]) err('نام کاربری در فایل تکراری است (ردیف ' + toFa(seenUser[rec.username]) + ')');
    else if (rec.username) seenUser[rec.username] = ri + 1;
    const ex = rec.username ? db.users.find(x => x.username.toLowerCase() === rec.username) : null;
    let mode = 'new';
    if (ex){
      if (st.opts.updateExisting) mode = 'upd';
      else err('نام کاربری «' + rec.username + '» قبلاً در سامانه ثبت شده است');
    }
    if (rec.uno){
      const uk = toEn(rec.uno);
      if (seenUno[uk]) warn('شماره پرسنلی در فایل تکراری است');
      seenUno[uk] = 1;
      if (db.users.some(x => toEn(x.uno) === uk && x !== ex)) warn('شماره پرسنلی با کاربر دیگری مشترک است');
    } else warn('شماره پرسنلی خالی است');
    let mg = rec.mgmtName ? findMgmt(rec.mgmtName) : null;
    if (rec.mgmtName && !mg){
      if (st.opts.createUnits) notes.push('مدیریت «' + rec.mgmtName + '» جدید ایجاد می‌شود');
      else err('مدیریت «' + rec.mgmtName + '» در سامانه یافت نشد');
    }
    let un = null;
    if (mg && rec.unitName){
      un = findUnitIn(mg.id, rec.unitName);
      if (!un){
        const g = findUnitAny(rec.unitName);
        if (g) warn('واحد «' + rec.unitName + '» با همین نام زیر مدیریت دیگری ثبت شده؛ برای این مدیریت مورد جدید ایجاد می‌شود');
        else if (st.opts.createUnits) notes.push('واحد «' + rec.unitName + '» جدید ایجاد می‌شود');
        else err('واحد «' + rec.unitName + '» زیر مدیریت «' + rec.mgmtName + '» یافت نشد');
      }
    }
    const roles = impRolesFromStr(rec.rolesStr);
    if (rec.rolesStr && !roles.length) err('نقش «' + rec.rolesStr + '» شناخته نشده است (متقاضی، متعهد، مدیر ارشد، مسئول کنترل بودجه، مدیر سایت — یا ترکیبی با جداکننده «/»)');
    let active = true;
    const at = impNorm(rec.activeStr).replace(/\s+/g, '');
    if (!at) notes.push('وضعیت مشخص نشده؛ فعال در نظر گرفته می‌شود');
    else if (at === impNorm('غیرفعال') || at === 'inactive' || at === 'off') active = false;
    else if (at !== impNorm('فعال') && at !== 'active') warn('وضعیت «' + rec.activeStr + '» شناخته نشد؛ فعال در نظر گرفته می‌شود');
    if (!rec.pass) notes.push('رمز خالی؛ رمز پیش‌فرض «' + defPass + '»');
    return { rec, status, notes, mode, mgmtId: mg ? mg.id : '', unitId: un ? un.id : '', role: roles[0] || '', roles, active };
  });
}
function impCounts(){
  const c = { ok: 0, upd: 0, warn: 0, err: 0 };
  imp.results.forEach(r => c[r.mode === 'upd' && r.status !== 'err' ? 'upd' : r.status]++);

  const dp = $('#impDefPass', body); if (dp) dp.addEventListener('change', () => { imp.opts.defPass = dp.value.trim() || '1234'; impValidate(); impRender(); });
  const cm = $('#impCommit', body); if (cm) cm.addEventListener('click', impCommit);
  const db_ = $('#impDoneBtn', body); if (db_) db_.addEventListener('click', () => { closeTopModal(true); renderUsers(); });
}
function impCommit(){
  const st = imp;
  const defPass = st.opts.defPass || '1234';
  const cacheM = {}, cacheU = {};
  let added = 0, updated = 0, skipped = 0, mgmts = 0, units = 0;
  const errs = [];
  st.results.forEach((r, i) => {
    if (r.status === 'err'){
      skipped++;
      errs.push('ردیف ' + toFa(i + 1) + ' («' + (r.rec.fn + ' ' + r.rec.ln).trim() + '»): ' + r.notes.join('؛ '));
      return;
    }
    const rec = r.rec;
    const mk = impNorm(rec.mgmtName);
    let mg = db.base.managements.find(m => impNorm(m.name) === mk) || cacheM[mk];
    if (!mg){ mg = { id: uid(), name: rec.mgmtName, active: true }; db.base.managements.push(mg); cacheM[mk] = mg; mgmts++; }
    const uk2 = mg.id + '|' + impNorm(rec.unitName);
    let un = db.base.units.find(u => u.mgmtId === mg.id && impNorm(u.name) === impNorm(rec.unitName)) || cacheU[uk2];
    if (!un){ un = { id: uid(), mgmtId: mg.id, name: rec.unitName, active: true }; db.base.units.push(un); cacheU[uk2] = un; units++; }
    const pass = rec.pass || defPass;
    const ex = db.users.find(x => x.username.toLowerCase() === rec.username);
    if (ex){
      ex.fn = rec.fn; ex.ln = rec.ln; ex.uno = rec.uno; ex.pos = rec.pos;
      ex.mgmtId = mg.id; ex.unitId = un.id; ex.role = r.role || (r.roles && r.roles[0]) || ex.role; ex.roles = (r.roles && r.roles.length) ? r.roles.slice() : [ex.role]; ex.active = r.active;
      if (rec.pass) ex.ph = hashStr(pass + ex.username);
      updated++;
    } else {
      db.meta.seq.user++;
      db.users.push({ id: 'u' + db.meta.seq.user, fn: rec.fn, ln: rec.ln, uno: rec.uno, username: rec.username, pos: rec.pos, mgmtId: mg.id, unitId: un.id, role: r.role || (r.roles && r.roles[0]) || 'applicant', roles: (r.roles && r.roles.length) ? r.roles.slice() : [(r.role || 'applicant')], active: r.active, ph: hashStr(pass + rec.username) });
      added++;
    }
  });
  saveDB(true);
  imp.done = { added, updated, skipped, mgmts, units, errs };
  imp.stage = 'done';
  impRender();
  toast(toFa(added + updated) + ' کاربر پردازش شد (' + toFa(added) + ' جدید، ' + toFa(updated) + ' به‌روزرسانی)', 'success');
}

function bavKey(name){

function bavFindUser(key){
  const k = bavKey(key);
  if (!k) return null;

  return db.users.find(u => u.username.toLowerCase() === k) ||
    db.users.find(u => toEn(String(u.uno)).toLowerCase() === k) ||
    db.users.find(u => impNorm(u.fn + ' ' + u.ln) === impNorm(byName)) || null;

      '</div>';
    h += '<div class="bav-grid">' + bav.items.map((it, i) => {
      const u = it.userId ? getUser(it.userId) : null;
      const dup = it.userId && bav.items.filter(x => x.userId === it.userId).length > 1;

    e.preventDefault(); drop.classList.remove('over');

  });
  inp.addEventListener('change', () => { bavAddFiles(inp.files); inp.value = ''; });
  $$('[data-bavu]', body).forEach(s => s.addEventListener('change', () => {

    bav.items.splice(+x.getAttribute('data-bavdel'), 1);
    bavRender();
  }));
  $('#bavClear', body) && $('#bavClear', body).addEventListener('click', () => { bav.items = []; bavRender(); });
  $('#bavApply', body) && $('#bavApply', body).addEventListener('click', bavApply);

function bavAddFiles(fileList){
  if (!bav) return;
  const files = Array.from(fileList || []).filter(f => /^image\//.test(f.type));
  const rejected = (fileList || []).length - files.length;
  if (rejected > 0) toast(toFa(rejected) + ' فایل غیرتصویری نادیده گرفته شد', 'warn');
  if (!files.length) return;
  if (bav.items.length + files.length > 120){ toast('حداکثر ۱۲۰ عکس در هر بار', 'error'); return; }
  bav.busy = true; bavRender();
  let done = 0;
  const next = () => {
    if (done >= files.length){ bav.busy = false; bavRender(); return; }
    const f = files[done++];
    userAvatarFromFile(f, 192, data => {
      const hit = bavFindUser(f.name);
      bav.items.push({ name: f.name, data, userId: hit ? hit.id : '' });
      next();
    });
  };
  next();
}
function bavApply(){
  if (!bav) return;
  const map = {};
  let dupBlock = false;
  bav.items.forEach(it => {
    if (!it.userId) return;
    if (map[it.userId]) dupBlock = true;
    map[it.userId] = it.data;
  });
  if (dupBlock){ toast('به هر کاربر فقط یک عکس نسبت دهید (موارد تکراری با رنگ زرد مشخص شده‌اند)', 'error'); return; }
  const ids = Object.keys(map);
  if (!ids.length){ toast('هیچ کاربری تخصیص نیافته است', 'warn'); return; }
  ids.forEach(id => { const u = getUser(id); if (u) u.avatar = map[id]; });
  saveDB(true);
  const me = curUser();
  if (me && ids.indexOf(me.id) !== -1) updateHeader();
  closeTopModal(true);
  renderUsers();
  toast(toFa(ids.length) + ' عکس پروفایل برای کاربران ثبت شد', 'success');
}

  { key: 'request',   title: 'درخواست برنامه',     icon: 'docPlus', desc: 'فرم ۵ مرحله‌ای ثبت برنامه و ریزتقاضا (متقاضیان)' },
  { key: 'programs',  title: 'لیست برنامه‌ها',     icon: 'list',    desc: 'جستجو، فیلتر و مشاهده جزئیات برنامه‌ها' },
  { key: 'cart',      title: 'کارتابل',            icon: 'inbox',   desc: 'کارتابل کامل گردش کار: ورودی، ارسال‌شده، تأییدشده، ردشده، بازگشتی، پیش‌نویس، اقدام گروهی، خروجی CSV/چاپ، اعلان‌های اخیر و سوابق اقدام' },
  { key: 'priority',  title: 'اولویت‌بندی بودجه', icon: 'flag',    desc: 'رتبه‌بندی ریزتقاضاها بر اساس وزن معیارها و تأیید/رد توسط مسئول کنترل بودجه (فقط این نقش)' },
  { key: 'priorities', title: 'اولویت‌ها',        icon: 'star',    desc: 'نمای شخصی سایر کاربران: رتبه هر ریزتقاضا و نتیجه تصمیم (تأیید/رد) — بدون امکان مدیریت' },
  { key: 'reports',   title: 'گزارشات',            icon: 'chart',   desc: '۱۰ گزارش تحلیلی با خروجی CSV و چاپ' },
  { key: 'users',     title: 'مدیریت کاربران',     icon: 'users',   desc: 'افزودن/ویرایش کاربران، ورود گروهی از اکسل و عکس پروفایل' },
  { key: 'profile',   title: 'پروفایل من',         icon: 'user',    desc: 'مشخصات فردی، عکس پروفایل و تغییر رمز — آیکن بالا-چپ سربرگ' },
  { key: 'guide',     title: 'راهنمای سامانه',     icon: 'help',    desc: 'دکمه راهنما در پایین منوی کناری' }
];
function renderSiteSections(){
  const area = $('#siteArea');
  let h = '<div class="panel"><div class="panel-h"><span class="panel-t">' + I.dash + ' فعال/غیرفعال‌سازی بخش‌های سامانه</span></div>' +
    '<div class="panel-b">' +
    '<div class="hint" style="margin:0 0 14px">با غیرفعال‌سازی هر بخش، آن قسمت از منوی کناری همه کاربران (به‌جز مدیر سایت) حذف می‌شود و ورود مستقیم به آن مسدود خواهد شد. تغییرات فوری اعمال می‌شود. بخش «مدیریت سایت» همیشه برای مدیر سایت فعال می‌ماند تا امکان بازگردانی بخش‌ها وجود داشته باشد.</div>' +
    '<div class="sec-grid">';
  SITE_SECTIONS.forEach(s => {
    const off = moduleOff(s.key);
    h += '<div class="sec-card' + (off ? ' off' : '') + '">' +
      '<span class="snc-ic ' + (off ? 'ic-gray' : 'ic-blue') + '">' + I[s.icon] + '</span>' +
      '<div class="sc-main"><div class="sc-t">' + esc(s.title) + (off ? '<span class="chip st-gray">غیرفعال</span>' : '<span class="chip st-green">فعال</span>') + '</div>' +
      '<div class="sc-s">' + esc(s.desc) + '</div></div>' +
      '<label class="sw"><input type="checkbox" data-sec="' + s.key + '" ' + (!off ? 'checked' : '') + '><span class="tr"></span></label>' +
      '</div>';
  });
  h += '</div></div></div>';
  area.innerHTML = h;
  $$('[data-sec]', area).forEach(inp => inp.addEventListener('change', () => {
    const k = inp.getAttribute('data-sec');
    const sec = SITE_SECTIONS.find(x => x.key === k) || { title: k };
    db.settings.modules[k] = !!inp.checked;
    saveDB(true);
    buildSidebar();
    toast('بخش «' + sec.title + '» ' + (inp.checked ? 'فعال شد' : 'برای سایر کاربران غیرفعال شد'), inp.checked ? 'success' : 'warn');
    renderSiteSections();
  }));
}
function renderSiteBase(){
  const area = $('#siteArea');
  const cat = baseCat;
  const isUnits = cat === 'units', isYears = cat === 'years', isStatus = cat === 'statuses';
  let h = '<div class="panel"><div class="panel-h"><span class="panel-t">' + I.db + ' مدیریت اطلاعات پایه</span>' +
    '<div style="display:flex;gap:7px;flex-wrap:wrap">' +
    (!isStatus ? '<button class="btn btn-outline btn-sm" id="bcImp">' + I.upload + ' ورود از اکسل</button>' : '') +
    '<button class="btn btn-primary btn-sm" id="bcAdd">' + I.plus + ' افزودن</button></div></div>' +
    '<div class="panel-b" style="padding-bottom:0"><div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px">' +
    BASE_CATS.map(c => '<button class="btn ' + (cat === c.key ? 'btn-primary' : 'btn-outline') + ' btn-sm" data-cat="' + c.key + '">' + I[c.icon] + ' ' + c.title + '</button>').join('') +
    '<button class="btn ' + (cat === 'statuses' ? 'btn-primary' : 'btn-outline') + ' btn-sm" data-cat="statuses">' + I.inbox + ' وضعیت‌های گردش کار</button>' +
    '</div></div>';
  const items = baseList(cat);
  let rows = '';
  if (isYears){
    rows = db.base.years.map(y => '<tr><td style="font-weight:800;font-size:15px">' + toFa(y.y) + '</td>' +
      '<td>' + (y.active ? '<span class="chip st-green">فعال</span>' : '<span class="chip st-gray">غیرفعال</span>') + '</td>' +
      '<td><div class="act-cell"><button class="btn btn-ghost btn-sm" data-op="toggle" data-id="' + y.y + '">' + (y.active ? 'غیرفعال‌سازی' : 'فعال‌سازی') + '</button>' +
      '<button class="btn btn-ghost btn-sm" data-op="del" data-id="' + y.y + '" style="color:var(--red)">حذف</button></div></td></tr>').join('');
  } else if (isStatus){
    rows = Object.keys(STATUS_META).map(k => {
      const custom = db.settings.statusLabels[k] || '';
      return '<tr><td>' + statusBadge(k) + '</td><td>' + esc(STATUS_META[k].label) + '</td>' +
        '<td><input class="input" style="max-width:260px" data-status="' + k + '" value="' + esc(custom) + '" placeholder="نام نمایشی سفارشی (اختیاری)"></td></tr>';
    }).join('');
  } else {
    rows = items.map(it => {
      const used = listIdUsed(cat, it.id);
      const extra = isUnits ? '<td>' + esc(mgmtName(it.mgmtId)) + '</td>' : '';
      return '<tr style="' + (it.active ? '' : 'opacity:.55') + '">' +
        '<td style="font-weight:700">' + esc(it.name) + '</td>' + extra +
        '<td>' + (it.active ? '<span class="chip st-green">فعال</span>' : '<span class="chip st-gray">غیرفعال</span>') + '</td>' +
        '<td><div class="act-cell">' +
        '<button class="icon-btn" data-op="edit" data-id="' + it.id + '" title="ویرایش">' + I.edit + '</button>' +
        '<button class="icon-btn" data-op="toggle" data-id="' + it.id + '" title="' + (it.active ? 'غیرفعال‌سازی' : 'فعال‌سازی') + '">' + (it.active ? I.xC : I.checkC) + '</button>' +
        '<button class="icon-btn" data-op="del" data-id="' + it.id + '" title="حذف" style="' + (used ? 'opacity:.35;pointer-events:none' : 'color:var(--red)') + '">' + I.trash + '</button>' +
        '</div></td></tr>';
    }).join('');
  }
  const cols = isUnits ? '<th>عنوان</th><th>مدیریت مرتبط</th><th>وضعیت</th><th>عملیات</th>' : isYears || isStatus ? '<th>عنوان</th><th>وضعیت</th><th>عملیات</th>' : '<th>عنوان</th><th>وضعیت</th><th>عملیات</th>';
  h += '<div class="panel-b tight"><div class="tbl-scroll"><table class="tbl"><thead><tr>' + cols + '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
    (rows ? '' : emptyState('موردی تعریف نشده است', 'با دکمه «افزودن» مورد جدیدی ثبت کنید.', I.db)) + '</div></div>';
  if (isStatus) h += '<div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn btn-primary" id="stSave">' + I.save + ' ذخیره نام‌های نمایشی</button></div>';
  if (!isStatus && !isYears) h += '<div class="hint" style="margin-top:10px">غیرفعال‌سازی یک مورد باعث می‌شود در Dropdownهای فرم‌ها و فیلترها نمایش داده نشود؛ داده‌های ثبت‌شده قبلی حفظ می‌شوند. حذف فقط برای موارد استفاده‌نشده مجاز است.</div>';
  if (isYears) h += '<div class="hint" style="margin-top:10px">سال فعال در Dropdownها و فیلتر سال بودجه نمایش داده می‌شود.</div>';
  area.innerHTML = h;
  $$('[data-cat]', area).forEach(b => b.addEventListener('click', () => { baseCat = b.getAttribute('data-cat'); renderSiteBase(); }));
  $('#bcAdd').addEventListener('click', () => baseModal(cat));
  if ($('#bcImp')) $('#bcImp').addEventListener('click', () => openListImport(cat));
  if ($('#stSave')) $('#stSave').addEventListener('click', () => {
    $$('[data-status]', area).forEach(inp => {
      const k = inp.getAttribute('data-status');
      if (inp.value.trim()) db.settings.statusLabels[k] = inp.value.trim();
      else delete db.settings.statusLabels[k];
    });
    saveDB(true);
    toast('نام‌های نمایشی وضعیت‌ها ذخیره شد', 'success');
    renderSiteBase();
  });
  $$('[data-op]', area).forEach(b => b.addEventListener('click', () => {
    const op = b.getAttribute('data-op'), id = b.getAttribute('data-id');
    if (op === 'toggle'){
      if (isYears){ const y = db.base.years.find(x => String(x.y) === String(id)); y.active = !y.active; }
      else { const it = baseList(cat).find(x => x.id === id); it.active = !it.active; }
      saveDB(true); renderSiteBase();
    } else if (op === 'edit') baseModal(cat, baseList(cat).find(x => x.id === id));
    else if (op === 'del'){
      if (isYears){
        if (listIdUsed('years', id)){ toast('این سال در برنامه‌ها استفاده شده و قابل حذف نیست', 'error'); return; }
        confirmDlg({ title: 'حذف سال', danger: true, okLabel: 'حذف', msg: 'سال ' + toFa(id) + ' حذف شود؟' }).then(ok => { if (ok){ db.base.years = db.base.years.filter(x => String(x.y) !== String(id)); saveDB(true); renderSiteBase(); } });
      } else {
        if (listIdUsed(cat, id)){ toast('این مورد در داده‌های ثبت‌شده استفاده شده و قابل حذف نیست (فقط غیرفعال‌سازی)', 'error'); return; }
        confirmDlg({ title: 'حذف مورد', danger: true, okLabel: 'حذف', msg: 'مورد «<b>' + esc((baseList(cat).find(x => x.id === id) || {}).name || '') + '</b>» حذف شود؟' }).then(ok => { if (ok){ db.base[cat] = db.base[cat].filter(x => x.id !== id); saveDB(true); renderSiteBase(); } });
      }
    }
  }));
}
function baseModal(cat, item){
  const isUnits = cat === 'units', isYears = cat === 'years';
  const isNew = !item;
  const title = (BASE_CATS.find(c => c.key === cat) || {}).title || cat;
  let body;
  if (isYears){
    body = fieldHTML('by', 'سال بودجه', true, '<input class="input" id="bsName" inputmode="numeric" value="' + (item ? item.y : '') + '" placeholder="مثال: ۱۴۰۷">', 'عدد چهار رقمی شمسی');
  } else {
    body = fieldHTML('bn', 'عنوان', true, '<input class="input" id="bsName" value="' + esc(item ? item.name : '') + '">') +
      (isUnits ? fieldHTML('bu', 'مدیریت مرتبط', true, '<div id="bsMgmt"></div>', 'واحدهای هر مدیریت در فرم برنامه به‌صورت پویا نمایش داده می‌شوند') : '') +
      '<label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="bsActive" ' + (!item || item.active ? 'checked' : '') + ' style="width:17px;height:17px;accent-color:var(--primary)"> <span>فعال باشد</span></label>';
  }
  openModal({
    title: (isNew ? 'افزودن ' : 'ویرایش ') + title, icon: I.db, size: 'sm', body,
    onMount: b => {
      if (isUnits){
        baseModal._mgmt = makeDD($('#bsMgmt', b), { options: db.base.managements.filter(x => x.active).map(x => ({ v: x.id, label: x.name })), value: item ? item.mgmtId : '', placeholder: 'انتخاب مدیریت' });
      }
    },
    footerButtons: [
      { label: isNew ? 'ثبت' : 'ذخیره', cls: 'btn-primary', icon: I.check, onClick: () => {
        const ov = modalStack[modalStack.length - 1].ov;
        const name = $('#bsName').value.trim();
        const active = isYears ? true : $('#bsActive').checked;
        if (isYears){
          const y = toEn(name);
          if (!/^\d{4}$/.test(y)){ setFieldError(ov, 'by', 'سال باید عدد چهار رقمی باشد'); return; }
          if (db.base.years.some(x => String(x.y) === y)){ setFieldError(ov, 'by', 'این سال قبلاً ثبت شده است'); return; }
          if (isNew) db.base.years.push({ y: +y, active: true });
          else { const yy = db.base.years.find(x => String(x.y) === String(item.y)); yy.y = +y; }
        } else {
          if (!name){ setFieldError(ov, 'bn', 'عنوان ضروری است'); return; }
          if (!Array.isArray(db.base[cat])) db.base[cat] = []; /* ایمنی برای داده‌های نسخه‌های قدیمی */
          if (isUnits){
            const mg = (baseModal._mgmt || {}).value;
            if (!mg){ setFieldError(ov, 'bu', 'انتخاب مدیریت ضروری است'); return; }
            if (isNew) db.base.units.push({ id: uid(), mgmtId: mg, name, active });
            else { Object.assign(item, { name, mgmtId: mg, active }); }
          } else {
            if (isNew) db.base[cat].push({ id: uid(), name, active });
            else Object.assign(item, { name, active });
          }
        }
        saveDB(true);
        closeTopModal(true);
        toast('اطلاعات پایه ذخیره شد', 'success');
        renderSiteBase();
      } },
      { label: 'انصراف', cls: 'btn-ghost', onClick: () => closeTopModal(true) }
    ]
  });
}
function renderSiteFields(){
  const area = $('#siteArea');
  const scopeNames = { main: 'فرم برنامه (مرحله ۱)', micro: 'فرم ریزتقاضا (اطلاعات فنی)' };
  let h = '<div class="panel"><div class="panel-h"><span class="panel-t">' + I.sliders + ' پیکربندی فیلدهای فرم</span>' +
    '<button class="btn btn-primary btn-sm" id="fdSave">' + I.save + ' ذخیره پیکربندی</button></div>' +
    '<div class="panel-b" style="padding-bottom:0"><div class="hint" style="margin:0 0 4px">' +
    'برچسب، اجباری بودن، حداکثر طول، ترتیب و فعال بودن فیلدها قابل تنظیم است. فیلدهای <b>ساختاری</b> (علامت قفل) فقط برچسب قابل تغییر دارند چون در گردش کار نقش ساختاری دارند. ' +
    'فیلدهای Dropdown گزینه‌های خود را از «اطلاعات پایه» می‌گیرند. تغییر کامل ساختار (نوع فیلد، افزودن فیلد جدید) در یک فایل HTML ثابت پشتیبانی نمی‌شود.' +
    '</div></div>' +
    '<div class="panel-b tight"><div class="tbl-scroll"><table class="tbl"><thead><tr>' +
    '<th>ترتیب</th><th>برچسب نمایشی</th><th>شناسه</th><th>نوع</th><th>اجباری</th><th>حداکثر طول</th><th>فعال</th><th>بخش</th></tr></thead><tbody>' +
    db.fields.slice().sort((a, b) => a.scope === b.scope ? a.ord - b.ord : (a.scope === 'main' ? -1 : 1)).map(f => {
      const typeCell = (!f.sys && (f.type === 'text' || f.type === 'textarea'))
        ? '<select class="input" style="padding:4px 8px;width:110px" data-fk="' + f.key + '" data-fp="type">' +
          '<option value="text"' + (f.type === 'text' ? ' selected' : '') + '>متن ساده</option>' +
          '<option value="textarea"' + (f.type === 'textarea' ? ' selected' : '') + '>متن بلند</option></select>'
        : '<span class="chip chip-soft">' + (f.type === 'select' ? 'Dropdown' : f.type === 'text' ? 'متن' : 'متن بلند') + '</span>';
      return '<tr>' +
        '<td><input class="input" style="width:64px;padding:4px 8px" type="number" min="1" value="' + f.ord + '" data-fk="' + f.key + '" data-fp="ord"></td>' +
        '<td><input class="input" style="min-width:170px" value="' + esc(f.label) + '" data-fk="' + f.key + '" data-fp="label">' + (f.sys ? ' ' + I.lock.replace('<svg', '<svg style="width:13px;height:13px;vertical-align:-2px;color:#94a3b8"') : '') + '</td>' +
        '<td dir="ltr" style="text-align:right;font-size:11px;color:var(--muted)">' + f.key + '</td>' +
        '<td>' + typeCell + '</td>' +
        '<td style="text-align:center"><input type="checkbox" ' + (f.req ? 'checked' : '') + (f.sys ? ' disabled' : '') + ' data-fk="' + f.key + '" data-fp="req" style="width:16px;height:16px;accent-color:var(--primary)"></td>' +
        '<td><input class="input" style="width:80px;padding:4px 8px" type="number" min="0" step="50" value="' + f.max + '"' + (f.max ? '' : ' disabled') + ' data-fk="' + f.key + '" data-fp="max"></td>' +
        '<td style="text-align:center"><input type="checkbox" ' + (f.enabled !== false ? 'checked' : '') + (f.sys ? ' disabled' : '') + ' data-fk="' + f.key + '" data-fp="enabled" style="width:16px;height:16px;accent-color:var(--primary)"></td>' +
        '<td>' + esc(scopeNames[f.scope]) + '</td></tr>';
    }).join('') +
    '</tbody></table></div></div></div>';
  area.innerHTML = h;
  $('#fdSave').addEventListener('click', () => {
    $$('[data-fk]', area).forEach(inp => {
      const k = inp.getAttribute('data-fk'), p = inp.getAttribute('data-fp');
      const f = db.fields.find(x => x.key === k);
      if (!f) return;
      if (p === 'label') f.label = inp.value.trim() || f.label;
      else if (p === 'req') f.req = inp.checked;
      else if (p === 'enabled') f.enabled = inp.checked;
      else if (p === 'ord') f.ord = Math.max(+inp.value || 1, 1);
      else if (p === 'max' && !inp.disabled) f.max = Math.max(+inp.value || 0, 0);
      else if (p === 'type') f.type = inp.value;
    });
    saveDB(true);
    toast('پیکربندی فیلدها ذخیره و در فرم‌ها اعمال شد', 'success');
    renderSiteFields();
  });
}
function renderSiteFlow(){
  const s = db.settings;
  const area = $('#siteArea');
  area.innerHTML = '<div class="panel"><div class="panel-h"><span class="panel-t">' + I.gear + ' تنظیمات گردش کار و اعتبارسنجی</span></div><div class="panel-b">' +
    '<div class="form-grid">' +
    fieldHTML('cu', 'واحد پول سامانه', true, '<div id="cuDd"></div>', 'در تمام نمایش مبالغ به‌صورت یکسان اعمال می‌شود') +
    fieldHTML('ms', 'حداکثر طول بازه جذب (ماه)', true, '<input class="input" id="msIn" inputmode="numeric" value="' + s.maxSpan + '">', 'برای جلوگیری از تولید شبکه ماه‌های بسیار طولانی') +
    '</div>' +
    '<fieldset class="frm-sec"><legend>سیاست عدم تطابق جمع جذب ماهانه با مبلغ برآورد</legend>' +

    '<span><b>هشدار (پیشنهادی):</b> ثبت با تأیید صریح کاربر امکان‌پذیر است، اما در ارسال نهایی برنامه هشدار نمایش داده می‌شود.</span></label>' +
    '<label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer"><input type="radio" name="policy" value="block" ' + (s.policy === 'block' ? 'checked' : '') + ' style="margin-top:4px;accent-color:var(--primary)">' +
    '<span><b>الزام تطابق (سخت‌گیرانه):</b> تأیید نهایی ریزتقاضا فقط با تطابق کامل جمع مبالغ ماهانه و مبلغ برآورد مجاز است.</span></label>' +
    '</fieldset>' +
    '<div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="btn btn-primary" id="flSave">' + I.save + ' ذخیره تنظیمات</button></div>' +
    '</div></div>';
  makeDD($('#cuDd'), { options: [{ v: 'ریال', label: 'ریال' }, { v: 'تومان', label: 'تومان' }], value: s.currency, placeholder: 'انتخاب واحد پول' });
  $('#flSave').addEventListener('click', () => {
    const cu = $('#cuDd .dd-label');
    const val = cu && !cu.classList.contains('ph') ? cu.textContent : s.currency;
    s.currency = val;

/* پردازش و ذخیره تصویر پس‌زمینه (سربرگ / صفحه ورود): هم‌اندازه‌سازی + فشرده‌سازی JPEG */
function appearanceImgApply(file, key){
  if (!file) return;
  if (!/^image\//.test(file.type)){ toast('فقط فایل تصویری انتخاب کنید', 'error'); return; }
  if (file.size > 6 * 1024 * 1024){ toast('حجم تصویر باید کمتر از ۶ مگابایت باشد', 'error'); return; }
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const MAXW = 1600;
      let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
      if (!w || !h){ toast('تصویر معتبر نیست', 'error'); return; }
      const sc = Math.min(MAXW / w, 1);
      const cv = document.createElement('canvas');
      cv.width = Math.max(Math.round(w * sc), 1);
      cv.height = Math.max(Math.round(h * sc), 1);
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.drawImage(img, 0, 0, cv.width, cv.height);
      let data;
      try { data = cv.toDataURL('image/jpeg', 0.72); } catch (e){ toast('پردازش تصویر ممکن نشد', 'error'); return; }
      if (data.length > 1400000){ toast('تصویر پس از کوچک‌سازی همچنان حجیم است؛ تصویر ساده‌تری انتخاب کنید', 'warn'); return; }
      const a = appearance();
      a[key] = data;
      /* ثبت نسبت ابعاد تصویر سربرگ تا ارتفاع هدر با تصویر هماهنگ بماند (محدود به بازه معقول) */
      if (key === 'hdrImg'){
        const r = cv.width / cv.height;
        a.hdrAr = String(Math.min(Math.max(r, 2.2), 14));
      }
      saveDB(true);
      applySettings();
      renderSiteLook();
      toast('تصویر پس‌زمینه ذخیره و اعمال شد', 'success');
    };
    img.onerror = () => toast('فایل انتخاب‌شده تصویر معتبری نیست', 'error');
    img.src = rd.result;
  };
  rd.onerror = () => toast('خواندن فایل ممکن نشد', 'error');
  rd.readAsDataURL(file);
}
function siteLogoApply(file){
  if (!file) return;
  if (!/^image\//.test(file.type)){ toast('فقط فایل تصویری انتخاب کنید', 'error'); return; }
  if (file.size > 3 * 1024 * 1024){ toast('حجم تصویر باید کمتر از ۳ مگابایت باشد', 'error'); return; }
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const MAXW = 240, MAXH = 140;
      let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
      if (!w || !h){ toast('تصویر معتبر نیست', 'error'); return; }
      const sc = Math.min(MAXW / w, MAXH / h, 1);
      const cv = document.createElement('canvas');
      cv.width = Math.max(Math.round(w * sc), 1);
      cv.height = Math.max(Math.round(h * sc), 1);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      let data;
      try { data = cv.toDataURL('image/png'); } catch (e){ toast('پردازش تصویر ممکن نشد', 'error'); return; }
      if (data.length > 260000){ toast('تصویر پس از کوچک‌سازی همچنان بزرگ است؛ لطفاً تصویر ساده‌تری انتخاب کنید', 'warn'); return; }
      db.settings.logo = data;
      saveDB(true);
      buildSidebar();
      toast('لوگوی سامانه ذخیره و اعمال شد', 'success');
      renderSiteLook();
    };
    img.onerror = () => toast('فایل انتخاب‌شده تصویر معتبری نیست', 'error');
    img.src = rd.result;
  };
  rd.onerror = () => toast('خواندن فایل ممکن نشد', 'error');
  rd.readAsDataURL(file);
}

/* بارگذاری لوگوی اختصاصی چاپ: هم‌اندازه‌سازی canvas + PNG (حفظ شفافیت) */
function sitePrintLogoApply(file){
  if (!file) return;
  if (!/^image\//.test(file.type)){ toast('فقط فایل تصویری انتخاب کنید', 'error'); return; }
  if (file.size > 3 * 1024 * 1024){ toast('حجم تصویر باید کمتر از ۳ مگابایت باشد', 'error'); return; }
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const MAXW = 300, MAXH = 160;
      let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
      if (!w || !h){ toast('تصویر معتبر نیست', 'error'); return; }
      const sc = Math.min(MAXW / w, MAXH / h, 1);
      const cv = document.createElement('canvas');
      cv.width = Math.max(Math.round(w * sc), 1);
      cv.height = Math.max(Math.round(h * sc), 1);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      let data;
      try { data = cv.toDataURL('image/png'); } catch (e){ toast('پردازش تصویر ممکن نشد', 'error'); return; }
      if (data.length > 260000){ toast('تصویر پس از کوچک‌سازی همچنان بزرگ است؛ تصویر ساده‌تری انتخاب کنید', 'warn'); return; }
      const P = printSettings();
      P.logo = data; P.logoMode = 'custom';
      saveDB(true);
      renderSitePrint();
      toast('لوگوی اختصاصی چاپ ذخیره و اعمال شد', 'success');
    };
    img.onerror = () => toast('فایل انتخاب‌شده تصویر معتبری نیست', 'error');
    img.src = rd.result;
  };
  rd.onerror = () => toast('خواندن فایل ممکن نشد', 'error');
  rd.readAsDataURL(file);
}

      '<div class="ac-opt"><input class="input op-l" data-of="label" data-oi="' + i + '" value="' + esc(o.label) + '" placeholder="عنوان گزینه">' +
      '<input class="op-v" data-of="val" data-oi="' + i + '" type="number" min="0" max="100" value="' + Math.round((+o.val || 0) * 100) + '" title="امتیاز گزینه (درصد اثر)"> ' +
      '<span style="font-size:10.5px;color:#94a3b8;font-weight:700">٪</span>' +
      '<button type="button" data-odel="' + i + '" title="حذف گزینه">' + I.trash + '</button></div>').join('') + '</div>' +
    '<button type="button" class="btn btn-ghost btn-sm" data-oadd style="margin-top:9px">' + I.plus + ' افزودن گزینه</button>' +
    (c.sys ? '' : '<span class="hint" style="display:inline-block;margin-inline-start:10px">معیار دلخواه شما — قابل حذف</span>') +
    '</div></div>';
}
/* خواندن وضعیت فعلی کارت‌ها از DOM (برای جلوگیری از فقدان تغییرات ذخیره‌نشده هنگام افزودن) */
function ahpHarvest(){
  return $$('#ahpCritList .ahp-crit-card').map(card => {
    const gv = f => $('[data-cf="' + f + '"]', card);
    return {
      key: card.getAttribute('data-cid'),
      title: gv('title').value.trim() || 'معیار بدون عنوان',
      q: gv('q').value.trim(),
      w: Math.min(Math.max(+gv('w').value || 0, 0), 100),
      active: gv('active').checked,
      type: (gv('type') && gv('type').value) || card._type || 'dropdown',
      sys: !!card._sys,
      opts: $$('.ac-opt', card).map(row => ({
        label: $('.op-l', row).value.trim(),
        val: Math.min(Math.max(+$('.op-v', row).value || 0, 0), 100) / 100
      })).filter(o => o.label)
    };
  });
}
function renderSiteAhp(){
  const area = $('#siteArea');
  if (!Array.isArray(db.settings.ahpCriteria)) db.settings.ahpCriteria = null;
  const cur = ahpAllCrit();
  area.innerHTML = '<div class="panel"><div class="panel-h"><span class="panel-t">' + I.flag + ' معیارهای اولویت‌بندی بودجه</span>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
    '<button class="btn btn-outline btn-sm" id="ahpAddCrit">' + I.plus + ' افزودن معیار</button>' +
    '<button class="btn btn-primary btn-sm" id="ahpSave">' + I.save + ' ذخیره معیارها</button></div></div>' +
    '<div class="panel-b">' +
    '<div class="hint" style="margin:0 0 14px">این معیارها در <b>مرحله ۳ فرم ریزتقاضا</b> بر اساس <b>«نوع ورودی»</b> انتخابی هر معیار — دکمه رادیو، لیست انتخابی یا چند انتخابی — نمایش داده می‌شوند. «وزن پایه» هنگام نبود مقایسه زوجی، وزن نهایی (نرمال‌شده) است؛ در صفحه «اولویت‌بندی بودجه» می‌توانید با ماتریس مقایسه زوجی وزن‌ها را دقیق‌تر محاسبه کنید. امتیاز هر گزینه (٪ اثر) در نمره نهایی لحاظ می‌شود؛ تغییر گزینه‌ها روی پاسخ‌های قبلی اثر ندارد چون پاسخ‌ها مقدار عددی خود را نگه می‌دارند.</div>' +
    '<div id="ahpCritList">' + cur.map(c => ahpCritCardHTML(c)).join('') + '</div>' +
    '</div></div>';
  /* نگهداری متادیتا روی DOM برای حفظ در harvest */
  $$('#ahpCritList .ahp-crit-card').forEach((card, i) => {
    card._type = cur[i].type;
    card._sys = !!cur[i].sys;
  });
  $('#ahpAddCrit').addEventListener('click', () => {
    const list = ahpHarvest();
    list.push({ key: 'cx' + Date.now().toString(36), sys: false, active: true, type: 'radio', w: 5, title: 'معیار جدید', q: '', opts: [ { label: 'زیاد', val: 0.75 }, { label: 'متوسط', val: 0.5 }, { label: 'کم', val: 0.25 } ] });
    db.settings.ahpCriteria = list;
    renderSiteAhp();
    const cards = $$('#ahpCritList .ahp-crit-card');
    if (cards.length) cards[cards.length - 1].scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
  $('#ahpCritList').addEventListener('click', e => {
    const delOpt = e.target.closest('[data-odel]');
    if (delOpt){ delOpt.closest('.ac-opt').remove(); return; }
    const addOpt = e.target.closest('[data-oadd]');
    if (addOpt){
      const body = addOpt.closest('.ac-body');
      const row = el('<div class="ac-opt"><input class="input op-l" data-of="label" placeholder="عنوان گزینه">' +
        '<input class="op-v" data-of="val" type="number" min="0" max="100" value="50"> ' +
        '<span style="font-size:10.5px;color:#94a3b8;font-weight:700">٪</span>' +
        '<button type="button" data-odel title="حذف گزینه">' + I.trash + '</button></div>');
      body.querySelector('.ac-opts').appendChild(row);
      return;
    }
    const delCrit = e.target.closest('[data-cdel]');
    if (delCrit){
      const card = delCrit.closest('.ahp-crit-card');
      confirmDlg({ title: 'حذف معیار', danger: true, okLabel: 'حذف', msg: 'معیار «<b>' + esc($('[data-cf="title"]', card).value) + '</b>» از معیارهای اولویت‌بندی حذف شود؟ پاسخ‌های ثبت‌شده قبلی حفظ می‌شوند اما در محاسبه دیگر لحاظ نمی‌شوند.' })
        .then(ok => {
          if (!ok) return;
          const list = ahpHarvest().filter(c => c.key !== card.getAttribute('data-cid'));
          db.settings.ahpCriteria = list;
          saveDB(true);
          renderSiteAhp();
          toast('معیار حذف شد', 'success');
        });
    }
  });
  $$('#ahpCritList [data-cf="active"]').forEach(inp => inp.addEventListener('change', () => {
    inp.closest('.ahp-crit-card').classList.toggle('off', !inp.checked);
  }));
  $('#ahpSave').addEventListener('click', () => {
    const list = ahpHarvest();
    if (!list.length){ toast('حداقل یک معیار لازم است', 'error'); return; }
    const act = list.filter(c => c.active);
    if (act.length && act.every(c => c.w <= 0)){ toast('حداقل یکی از وزن‌های پایه معیارهای فعال باید بزرگ‌تر از صفر باشد', 'error'); return; }
    for (const c of act){
      if (!c.opts.length){ toast('معیار «' + c.title + '» حداقل یک گزینه لازم دارد', 'error'); return; }
      if (c.opts.every(o => o.val <= 0)){ toast('در معیار «' + c.title + '» حداقل یک گزینه باید امتیاز بزرگ‌تر از صفر داشته باشد', 'error'); return; }
    }
    db.settings.ahpCriteria = list;
    saveDB(true);
    toast('معیارهای اولویت‌بندی ذخیره شد و در فرم ریزتقاضا اعمال می‌شود', 'success');
    renderSiteAhp();
  });
}

/* ================================================================
   بخش ۱۵ — رویدادهای سراسری، تله فوکوس مودال، راه‌اندازی
   ================================================================ */
function enterApp(){
  const lp = $('#loginPage');
  lp.innerHTML = '';
  lp.style.display = 'none';
  buildShell();
  nav('dashboard');
}
function trapTab(e){
  const top = modalStack[modalStack.length - 1];
  if (!top) return;
  const focusables = $$('a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])', top.ov)
    .filter(x => x.offsetParent !== null);
  if (!focusables.length) return;
  const first = focusables[0], last = focusables[focusables.length - 1];
  if (e.shiftKey && document.activeElement === first){ last.focus(); e.preventDefault(); }
  else if (!e.shiftKey && document.activeElement === last){ first.focus(); e.preventDefault(); }
}
document.addEventListener('keydown', e => {
  if (e.key === 'Tab' && modalStack.length){ trapTab(e); return; }
  if (e.key !== 'Escape') return;
  if (openDP){ closeDP(); return; }
  if (openDD){ closeOpenDD(); return; }
  const nh = $('#notifPop');
  if (nh && nh.innerHTML){ nh.innerHTML = ''; return; }
  if (modalStack.length){ requestCloseModal(); return; }
  if (document.body.classList.contains('side-open')) toggleDrawer(false);
});
$('#sideOverlay').addEventListener('click', () => toggleDrawer(false));

/* ---------------- راه‌اندازی ---------------- */
function init(){
  loadDB();
  try {
    const un = sessionStorage.getItem(SESSION_KEY);
    if (un){
      const u = db.users.find(x => x.username === un && x.active);
      if (u) session.user = u;
    }
  } catch (e) {}
  applySettings();
  if (session.user) enterApp();
  else renderLogin();
}
init();
