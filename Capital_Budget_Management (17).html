    titles: { programs: 'لیست برنامه‌های بودجه سرمایه‌ای', programDetail: 'جزئیات برنامه', cart: 'کارتابل', reports: '' }
  };
}
function printSettings(){
  if (!db.settings.print || typeof db.settings.print !== 'object') db.settings.print = printDef();
  return db.settings.print;
}
/* عنوان چاپی هر سند: اگر مدیر سایت عنوان سفارشی ثبت کرده باشد از آن، وگرنه پیش‌فرض */
function prTitle(key, fallback){
  const P = db.settings.print || {};
  const t = (P.titles && typeof P.titles === 'object') ? (P.titles[key] || '') : '';
  return t || fallback;
}
function prSigBlockHTML(){
  const P = printSettings(), d = printDef();
  const lbls = [P.sig1 || d.sig1, P.sig2 || d.sig2, P.sig3 || d.sig3];
  return '<div class="pr-sigrow">' + lbls.map(x => '<div class="pr-sigcell"><div class="ln">' + esc(x) + '</div></div>').join('') + '</div>';
}
/* ساخت سند چاپی: سربرگ (لوگو + عنوان + زیرعنوان + تاریخ/ساعت/کاربر) + محتوا + بلوک امضا + پاصفحه */
function buildPrintDoc(title, inner){
  const P = printSettings(), d = printDef();
  const meta = [];
  if (P.showDate !== false) meta.push('تاریخ چاپ: ' + fmtJ(todayJ()));
  if (P.showTime !== false) meta.push('ساعت: ' + toFa(nowTimeStr()));
  if (P.showUser && curUser()) meta.push('کاربر: ' + esc((curUser().fn || '') + ' ' + (curUser().ln || '')));
  let logo = '';
  if (P.logoMode === 'custom'){ if (P.logo) logo = '<img class="pr-logo" src="' + P.logo + '" alt="">'; }
  else if (P.logoMode !== 'none' && db.settings.logo) logo = '<img class="pr-logo" src="' + db.settings.logo + '" alt="">';
  const org = (P.orgTitle === undefined || P.orgTitle === '') ? db.settings.systemTitle : P.orgTitle;
  /* اندازه/جهت/حاشیه کاغذ به‌صورت پویا در @page تزریق می‌شود (بعد از استایل ثابت = اولویت دارد) */
  let st = document.getElementById('printPageStyle');
  if (!st){ st = document.createElement('style'); st.id = 'printPageStyle'; document.head.appendChild(st); }
  let mg = parseInt(P.margin, 10); if (!(mg >= 5 && mg <= 30)) mg = d.margin;
  const paper = ['A4', 'A5', 'Letter'].indexOf(P.paper) !== -1 ? P.paper : 'A4';
  st.textContent = '@media print{@page{size:' + paper + (P.orient === 'landscape' ? ' landscape' : ' portrait') + ';margin:' + mg + 'mm}}';
  const metaHtml = meta.length ? '<div class="pr-meta">' + meta.join('<br>') + '</div>' : '';
  return '<div class="pr-doc"><div class="pr-head">' + logo +
    '<div style="flex:1;min-width:0"><h1>' + esc(title) + '</h1><div class="pr-org">' + esc(org) + '</div></div>' +
    metaHtml + '</div>' + inner +
    (P.sigBlock ? prSigBlockHTML() : '') +
    (P.footAll !== false ? '<div class="pr-foot"><span>' + esc(P.footerText || d.footerText) + '</span><span>' + esc(db.settings.systemTitle) + '</span></div>' : '') +
    '</div>';
}
function printHTML(title, inner){
  const pr = $('#printRoot');
  pr.innerHTML = buildPrintDoc(title, inner);
  document.body.classList.add('printing');
  const done = () => { document.body.classList.remove('printing'); pr.innerHTML = ''; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  window.print();
  setTimeout(() => { if (document.body.classList.contains('printing')) done(); }, 2500);
}

    (hint ? '<div class="hint">' + esc(hint) + '</div>' : '') + '<div class="err-msg"></div></div>';
}
function setFieldError(root, id, msg){
  const f = $('[data-fid="' + id + '"]', root);

  f.classList.toggle('has-err', !!msg);
  const e = $('.err-msg', f);
  if (e) e.textContent = msg || '';
}
function clearFieldErrors(root){ $$('.field.has-err', root).forEach(f => f.classList.remove('has-err')); }
function pageHead(title, icon, sub, actions){
  return '<div class="page-head"><div><h2>' + (icon || '') + esc(title) + '</h2>' + (sub ? '<div class="ph-sub">' + esc(sub) + '</div>' : '') + '</div>' +
    (actions ? '<div class="ph-actions">' + actions + '</div>' : '') + '</div>';
}
function emptyState(title, sub, icon){
  return '<div class="empty">' + (icon || I.inbox) + '<div class="e-t">' + esc(title) + '</div><div class="e-s">' + esc(sub || '') + '</div></div>';
}

function saveDB(silent){
  try { localStorage.setItem(DB_KEY, JSON.stringify(db)); if (!silent) toast('داده‌ها با موفقیت ذخیره شد', 'success'); }
  catch (e){ toast('ذخیره‌سازی محلی ممکن نیست؛ تغییرات فقط در همین نشست اعمال می‌شود', 'error'); }
}
function loadDB(){
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (raw){
      db = JSON.parse(raw);
      if (db && db.programs && db.users){
        /* خطای احتمالی مهاجرت هرگز نباید به پاک‌شدن داده کاربر بینجامد */
        try { migrateDB(); } catch (e) { console && console.warn && console.warn('migrate warning:', e); }
        return;
      }
    }
  } catch (e) {}
  db = defaultDB();
  try { localStorage.setItem(DB_KEY, JSON.stringify(db)); } catch (e) {}
}
/* مهاجرت داده‌های نسخه‌های قبلی (بدون از بین بردن تغییرات کاربر) */
function migrateDB(){
  let dirty = false;
  if (!db.base) db.base = {};
  if (!db.meta || typeof db.meta !== 'object'){ db.meta = { seq: { prog: db.programs.length, micro: 0, user: db.users.length }, version: 1, seededAt: todayJStr() }; dirty = true; }
  if (!db.meta.seq){ calibrateSeq(); dirty = true; }
  if (db.meta.migr !== 2){
    /* نام مدیر سایت: رضا مرادی */
    const a = db.users.find(u => hasRole(u, 'admin'));
    if (a && a.fn === 'علی' && a.ln === 'رضایی'){
      a.fn = 'رضا'; a.ln = 'مرادی';
      if (!a.pos || a.pos === 'مدیر سامانه‌های سازمانی') a.pos = 'مدیر سایت';
    }
    db.meta.migr = 2; dirty = true;
  }
  /* نسخه ۳: کلید فعال/غیرفعال بخش‌های سامانه */
  if (!db.settings || typeof db.settings !== 'object') db.settings = { modules:{} };
  if (!db.settings.modules || typeof db.settings.modules !== 'object') db.settings.modules = {};
  ['dashboard','request','programs','cart','reports','users','profile','guide'].forEach(k => {
    if (db.settings.modules[k] === undefined){ db.settings.modules[k] = true; dirty = true; }
  });
  if (db.meta.migr !== 3){ db.meta.migr = 3; dirty = true; }
  /* نسخه ۴: حذف داده‌ها و کاربران پیش‌فرض نسخه‌های قبلی (تنظیمات و داده‌های واقعی کاربر حفظ می‌شود) */
  if (db.meta.migr !== 4){
    const SEED_UN = ['mohammadi','tavakoli','karimi','rezaei','mohseni','ahmadi','hosseini','salehi','naderi'];
    const seedUsers = db.users.filter(u => SEED_UN.indexOf(u.username) !== -1);
    if (seedUsers.length){
      const seedIds = seedUsers.map(u => u.id);
      db.programs = (db.programs || []).filter(p => seedIds.indexOf(p.applicantId) === -1 && seedIds.indexOf(p.createdBy) === -1);
      db.users = db.users.filter(u => SEED_UN.indexOf(u.username) === -1);
    }
    /* پاک‌سازی تخصیص سازمانی پیش‌فرض مدیر سایت */
    const adm = db.users.find(u => hasRole(u, 'admin'));
    if (adm){ adm.mgmtId = ''; adm.unitId = ''; }
    /* اقلام پایه نمونه (شناسه‌های کوتاه ثابت نسخه‌های قبل) — فقط اگر در داده‌های باقی‌مانده استفاده نشده باشند */
    const seedRe = /^(mg|u|pr|dm|um|cp|fb|nf|g|rq|bh|pt)\d+$/;
    const rtSeed = ['rt-buy','rt-project','rt-service','rt-other'];
    ['units','managements','requestTypes','priorities','domains','unitsMeas','periods','finBenefits','nonFinBenefits','goals','requirements','budgetHeads','programTypes'].forEach(cat => {
      if (!db.base[cat] || !Array.isArray(db.base[cat])) return;
      db.base[cat] = db.base[cat].filter(it => {
        const id = (it || {}).id || '';
        const isSeed = cat === 'requestTypes' ? rtSeed.indexOf(id) !== -1 : seedRe.test(id);
        if (!isSeed) return true;
        try { return listIdUsed(cat, id); } catch (e) { return true; }
      });
    });
    if (!Array.isArray(db.base.years) || !db.base.years.length) db.base.years = [{ y: 1405, active: true }];
    calibrateSeq();
    db.meta.migr = 4; dirty = true;
  }
  /* نسخه ۵: ظاهر و تم — آبجکت تنظیمات ظاهری + انتقال رنگ سفارشی قبلی */
  const apDef = { theme:'navy', primary:'', accent:'', hdrImg:'', hdrAr:'', loginImg:'', overlay:55, radius:'md', zoom:'md', welcome:'', loginNote:'', footerText:'' };
  if (!db.settings.appearance || typeof db.settings.appearance !== 'object'){
    db.settings.appearance = {};
    /* رنگ سازمانی سفارشی نسخه‌های قبلی حفظ می‌شود */
    if (db.settings.primaryColor && db.settings.primaryColor !== '#0d3b66') db.settings.appearance.primary = db.settings.primaryColor;
    dirty = true;
  }
  Object.keys(apDef).forEach(k => {
    if (db.settings.appearance[k] === undefined){ db.settings.appearance[k] = apDef[k]; dirty = true; }
  });
  if (db.meta.migr !== 5){ db.meta.migr = 5; dirty = true; }
  /* نسخه ۶: اولویت‌بندی AHP — ماژول جدید، مقایسه‌های زوجی و ساختار پاسخ معیارها در ریزتقاضاها */
  if (db.settings.modules.priority === undefined){ db.settings.modules.priority = true; dirty = true; }
  if (!db.settings.ahp || typeof db.settings.ahp !== 'object'){ db.settings.ahp = { cmp: {} }; dirty = true; }
  if (!db.settings.ahp.cmp || typeof db.settings.ahp.cmp !== 'object'){ db.settings.ahp.cmp = {}; dirty = true; }
  if (db.settings.ahpCriteria === undefined){ db.settings.ahpCriteria = null; dirty = true; }
  (db.programs || []).forEach(p => (p.micros || []).forEach(m => {
    if (!m.ahp || typeof m.ahp !== 'object'){ m.ahp = { answers: {}, status: 'pending', score: null, rank: null, by: '', byId: '', date: '', time: '', comment: '' }; dirty = true; }
    if (!m.ahp.answers || typeof m.ahp.answers !== 'object'){ m.ahp.answers = {}; dirty = true; }
    if (!m.ahp.status){ m.ahp.status = 'pending'; dirty = true; }
  }));
  if (db.meta.migr !== 6){ db.meta.migr = 6; dirty = true; }
  /* نسخه ۷: بخش «اولویت‌ها» (نمای شخصی) + تضمین وجود همه دسته‌های اطلاعات پایه
     رفع باگ: در داده‌های ساخته‌شده با نسخه‌های قدیمی، کلیدهای جدید (مثل سرفصل‌های بودجه و انواع برنامه)
     در db.base وجود نداشتند و دکمه «افزودن» خطای خاموش می‌گرفت */
  if (!db.settings.modules || typeof db.settings.modules !== 'object'){ db.settings.modules = { dashboard:true, request:true, programs:true, cart:true, priority:true, priorities:true, reports:true, users:true, profile:true, guide:true }; dirty = true; }
  if (db.settings.modules.priorities === undefined){ db.settings.modules.priorities = true; dirty = true; }
  (typeof BASE_CATS !== 'undefined' ? BASE_CATS : []).forEach(c => {
    if (!Array.isArray(db.base[c.key])){ db.base[c.key] = []; dirty = true; }
  });
  if (db.meta.migr !== 7){ db.meta.migr = 7; dirty = true; }
  /* نسخه ۸: اعلان‌های درون‌برنامه‌ای + شماره مصوب اولویت‌بندی
     — اعلان‌های شخصی هر کاربر در db.notifs نگهداری می‌شود */
  if (!Array.isArray(db.notifs)) { db.notifs = []; dirty = true; }
  db.programs.forEach(p => (p.micros || []).forEach(m => {
    if (m.ahp && m.ahp.approvalNo === undefined) m.ahp.approvalNo = '';
  }));
  if (db.meta.migr !== 8){ db.meta.migr = 8; dirty = true; }
  /* نسخه ۹: نقش‌های چندگانه (متعهد + مدیر ارشد هم‌زمان) — آرایه roles برای هر کاربر */
  (db.users || []).forEach(u => {
    if (!Array.isArray(u.roles) || !u.roles.length){ u.roles = [u.role || 'applicant']; dirty = true; }
    else if (u.roles.indexOf(u.role) === -1){ u.role = u.roles[0]; dirty = true; }
  });
  if (db.meta.migr !== 9){ db.meta.migr = 9; dirty = true; }
  /* نسخه ۱۰: تنظیمات صفحات قابل چاپ — عنوان اسناد، لوگوی سربرگ، سربرگ/پاصفحه، کاغذ و بلوک امضا */
  if (!db.settings.print || typeof db.settings.print !== 'object'){ db.settings.print = printDef(); dirty = true; }
  else {
    const pd = printDef();
    Object.keys(pd).forEach(k => {
      if (k === 'titles') return;
      if (db.settings.print[k] === undefined){ db.settings.print[k] = pd[k]; dirty = true; }
    });
    if (!db.settings.print.titles || typeof db.settings.print.titles !== 'object'){ db.settings.print.titles = pd.titles; dirty = true; }
    Object.keys(pd.titles).forEach(k => { if (db.settings.print.titles[k] === undefined){ db.settings.print.titles[k] = pd.titles[k]; dirty = true; } });
  }
  if (db.meta.migr !== 10){ db.meta.migr = 10; dirty = true; }
  /* نسخه ۱۱: ترمیم شناسه‌های تکراری — علت باگ «کلیک روی یک برنامه، برنامه دیگری باز می‌شد».
     اگر دو برنامه شناسه یکسان داشته باشند، findProgram همیشه اولی را برمی‌گرداند؛ اینجاست که برنامه‌ی اشتباه
     با عنوان و گردش کار متفاوت باز می‌شود. نخستین برنامه نگه داشته می‌شود و موارد بعدی شناسه یکتای تازه می‌گیرند
     و یک رکورد در تاریخچه گردش کارشان ثبت می‌شود تا تغییر شناسه شفاف بماند. */
  (function(){
    calibrateSeq();
    const seenC = {}, seenU = {}, seenR = {};
    (db.programs || []).forEach(p => {
      if (!p.code){ p.code = nextProgCode(p.year || budgetYear()); dirty = true; }
      if (seenC[p.code]){
        const old = p.code;
        p.code = nextProgCode(p.year || budgetYear());
        if (!Array.isArray(p.history)) p.history = [];
        p.history.push({ user: 'سامانه', userId: '', role: '', action: 'اصلاح شناسه برنامه از ' + old + ' به ' + p.code + ' (رفع تداخل شناسه)', comment: '', from: '', to: '', date: todayJStr(), time: nowTimeStr(), sig: null });
        dirty = true;
      }
      seenC[p.code] = true;
    });
    (db.users || []).forEach(u2 => {
      if (u2.id && seenU[u2.id]){ u2.id = 'u' + (++db.meta.seq.user); dirty = true; }
      if (u2.id) seenU[u2.id] = true;
    });
    (db.programs || []).forEach(p => (p.micros || []).forEach(m => {
      if (m.id && seenR[m.id]){ m.id = nextMicroId(); dirty = true; }
      if (m.id) seenR[m.id] = true;
    }));
    calibrateSeq();
  })();
  if (db.meta.migr !== 11){ db.meta.migr = 11; dirty = true; }
  if (dirty){ try { localStorage.setItem(DB_KEY, JSON.stringify(db)); } catch (e) {} }
}

/* بیشینه شماره استفاده‌شده در شناسه‌های موجود — مبنا درست برای شمارنده شناسه (نه «تعداد» موارد) */
function maxSeqOf(list, re){
  let mx = 0;
  (list || []).forEach(it => {
    const m = re.exec(String((it && (it.code || it.id)) || ''));
    if (m){ const v = parseInt(m[1], 10); if (v > mx) mx = v; }
  });
  return mx;
}
/* بازتنظیم امن شمارنده‌ها: هرگز کمتر از بیشینه شناسه استفاده‌شده نمی‌شود تا شناسه جدید تکراری نسازد */
function calibrateSeq(){
  if (!db.meta || typeof db.meta !== 'object') db.meta = {};
  const s = (db.meta.seq && typeof db.meta.seq === 'object') ? db.meta.seq : {};
  const allMicros = (db.programs || []).reduce((a, p) => a.concat(p.micros || []), []);
  s.prog = Math.max(maxSeqOf(db.programs, /^BP-\d+-(\d+)$/), (db.programs || []).length, s.prog || 0);
  s.micro = Math.max(maxSeqOf(allMicros, /^R-(\d+)$/), allMicros.length, s.micro || 0);
  s.user = Math.max(maxSeqOf(db.users, /^u(\d+)$/), (db.users || []).length, s.user || 0);
  if (!(s.prog >= 0)) s.prog = 0;
  if (!(s.micro >= 0)) s.micro = 0;
  if (!(s.user >= 0)) s.user = 0;
  db.meta.seq = s;
}
/* شناسه برنامه: پس از هر پیشنهاد، وجود آن بررسی و در صورت تداخل ادامه می‌یابد — شناسه تکراری ممکن نیست */
function nextProgCode(year){
  if (!db.meta.seq || typeof db.meta.seq !== 'object') calibrateSeq();
  if (!(db.meta.seq.prog >= 0)) db.meta.seq.prog = 0;
  let c;
  do { db.meta.seq.prog++; c = 'BP-' + year + '-' + String(db.meta.seq.prog).padStart(4, '0'); }
  while (findProgram(c));
  return c;
}
/* شناسه ریزتقاضا: همان قاعده ضدتداخل */
function nextMicroId(){
  if (!db.meta.seq || typeof db.meta.seq !== 'object') calibrateSeq();
  if (!(db.meta.seq.micro >= 0)) db.meta.seq.micro = 0;
  let c;
  const taken = id => (db.programs || []).some(p => (p.micros || []).some(m => m.id === id));
  do { db.meta.seq.micro++; c = 'R-' + String(db.meta.seq.micro).padStart(4, '0'); }
  while (taken(c));
  return c;
}

/* ---- کمک‌کننده‌های داده ---- */
function getUser(id){ return db.users.find(u => u.id === id) || null; }
function personName(id){ const u = getUser(id); return u ? (u.fn + ' ' + u.ln) : '—'; }
function usersByRole(role){ return db.users.filter(u => hasRole(u, role) && u.active); }
/* ---- متعهد/مدیر ارشد مربوط به هر متقاضی (زنجیره گردش کار اختصاصی) ---- */
function chainKeyOf(role){ return role === 'committer' ? 'chainCommitterId' : 'chainSeniorId'; }
/* گزینه‌های مجاز متعهد/مدیر ارشد از دید یک کاربر:
   - اگر زنجیره اختصاصی ثبت شده باشد → فقط همان فرد
   - در غیر این صورت → فقط افراد هم‌مدیریت متقاضی (در صورت وجود)، وگرنه همه */
function approverScope(applicantUser, role){
  let opts = usersByRole(role);
  if (!applicantUser || !hasRole(applicantUser, 'applicant')) return opts;
  const ck = chainKeyOf(role);
  if (applicantUser[ck] && opts.some(x => x.id === applicantUser[ck]))
    return opts.filter(x => x.id === applicantUser[ck]);
  const same = opts.filter(x => x.mgmtId === applicantUser.mgmtId);
  return same.length ? same : opts;
}
/* متن راهنمای محدوده انتخاب (third = متن از دید مدیر سایت) */
function approverScopeText(applicantUser, role, third){
  if (!applicantUser || !hasRole(applicantUser, 'applicant')) return '';
  const lbl = role === 'committer' ? 'متعهد' : 'مدیر ارشد';
  const ck = chainKeyOf(role);
  if (applicantUser[ck] && getUser(applicantUser[ck]))
    return third
      ? lbl + ' پیش‌فرض این متقاضی بر اساس تنظیمات مدیر سایت، «' + personName(applicantUser[ck]) + '» است.'
      : lbl + ' گردش کار شما بر اساس تنظیمات مدیر سایت فقط «' + personName(applicantUser[ck]) + '» است.';
  if (third) return '';
  const same = usersByRole(role).filter(x => x.mgmtId === applicantUser.mgmtId);
  if (same.length)
    return 'به‌عنوان متقاضی فقط ' + lbl + 'های مربوط به خود (هم‌مدیریت: ' + mgmtName(applicantUser.mgmtId) + ') را مشاهده و انتخاب می‌کنید.';
  return '';
}
function mgmtName(id){ const m = db.base.managements.find(x => x.id === id); return m ? m.name : '—'; }
function unitName(id){ const m = db.base.units.find(x => x.id === id); return m ? m.name : '—'; }
function listName(key, id){ const l = db.base[key] || []; const x = l.find(i => i.id === id); return x ? x.name : ''; }
function unitsOf(mgmtId){ return db.base.units.filter(u => u.mgmtId === mgmtId && u.active); }
function activeYears(){ return db.base.years.filter(y => y.active).map(y => y.y); }
function budgetYear(){ const ys = activeYears(); return ys.length ? Math.max.apply(null, ys) : 1405; }
function findProgram(code){ return db.programs.find(p => p.code === code) || null; }
function progTotals(p){
  let est = 0, plan = 0;
  (p.micros || []).forEach(m => { est += (m.amount || 0); Object.values(m.plan || {}).forEach(v => plan += (v || 0)); });
  return { est, plan, diff: est - plan, suggested: p.suggestedAmount || 0, approved: p.approvedAmount || 0, count: (p.micros || []).length };
}

/* ---- دسترسی و کارتابل ----
   محدوده مشاهده هر نقش:
   • مدیر سایت و مسئول کنترل بودجه: تمامی تقاضاها
   • متقاضی: فقط تقاضاهای خودش
   • متعهد: فقط تقاضاهای واحد سازمانی خودش
   • مدیر ارشد: فقط تقاضاهای مدیریت خودش */
function scopeAll(u){ return !!u && (hasRole(u, 'admin') || hasRole(u, 'budget')); }
function visiblePrograms(u){
  if (!u) return [];
  if (scopeAll(u)) return db.programs.slice();
  /* نقش‌های چندگانه: اجتماع محدوده مشاهده همه نقش‌های کاربر */
  let out = []; const seen = {};
  const add = list => list.forEach(p => { if (!seen[p.code]){ seen[p.code] = 1; out.push(p); } });
  roleArr(u).forEach(r => {
    if (r === 'applicant') add(db.programs.filter(p => p.applicantId === u.id || p.createdBy === u.id));
    else if (r === 'committer') add(db.programs.filter(p => u.unitId && p.unitId === u.unitId));
    else if (r === 'senior') add(db.programs.filter(p => u.mgmtId && p.mgmtId === u.mgmtId));
  });
  return out;
}
/* مدیریت‌ها/واحدها/افرادِ مجاز در فیلترها — همیشه هم‌محدوده با دسترسی مشاهده */
function visibleMgmts(u){
  if (scopeAll(u)) return db.base.managements.filter(x => x.active);
  return u.mgmtId ? db.base.managements.filter(x => x.id === u.mgmtId) : [];
}
function visibleUnits(u){
  if (scopeAll(u)) return db.base.units.filter(x => x.active);
  if (hasRole(u, 'senior')) return db.base.units.filter(x => x.active && x.mgmtId === u.mgmtId);
  return u.unitId ? db.base.units.filter(x => x.id === u.unitId) : [];
}
function visibleApplicants(u){
  if (scopeAll(u)) return db.users.filter(x => hasRole(x, 'applicant') && x.active);
  const ids = [];
  visiblePrograms(u).forEach(p => { [p.applicantId, p.createdBy].forEach(x => { if (x && ids.indexOf(x) === -1) ids.push(x); }); });
  return db.users.filter(x => ids.indexOf(x.id) !== -1);
}
function visibleRoleUsers(u, role){
  if (scopeAll(u)) return db.users.filter(x => hasRole(x, role) && x.active);
  const key = role === 'committer' ? 'committerId' : 'seniorManagerId';
  const ids = [];
  visiblePrograms(u).forEach(p => { if (p[key] && ids.indexOf(p[key]) === -1) ids.push(p[key]); });
  return db.users.filter(x => ids.indexOf(x.id) !== -1);
}
function canEditProgram(u, p){
  if (!u || !p) return false;
  if (hasRole(u, 'admin')) return true;
  /* مسئول کنترل بودجه: ویرایش برنامه و ریزتقاضا در هر وضعیت گردش کار */
  if (hasRole(u, 'budget')) return true;
  if (hasRole(u, 'applicant') && (p.applicantId === u.id || p.createdBy === u.id))
    return p.status === 'draft' || p.status === 'returned';
  if (hasRole(u, 'committer') && p.committerId === u.id && p.status === 'pending_committer') return true;
  return false;
}
function cartRole(u, p){
  if (!u || !p) return null;
  if (hasRole(u, 'committer') && p.status === 'pending_committer' && p.committerId === u.id) return 'committer';
  if (hasRole(u, 'senior') && p.status === 'pending_senior' && p.seniorManagerId === u.id) return 'senior';
  if (hasRole(u, 'budget') && p.status === 'pending_budget') return 'budget';
  if (hasRole(u, 'applicant') && p.status === 'returned' && (p.applicantId === u.id || p.createdBy === u.id)) return 'applicant';
  return null;
}
function cartItems(u){
  /* موارد در انتظار اقدام شخصی کاربر (حتی اگر خارج محدوده سازمانی باشد تا گردش کار متوقف نشود) + محدوده مشاهده */
  const act = db.programs.filter(p => cartRole(u, p));
  const vis = visiblePrograms(u);
  const codes = {};
  vis.forEach(p => { codes[p.code] = 1; });
  return vis.concat(act.filter(p => !codes[p.code]));
}
function pushHist(p, action, comment, from, to, extra){
  const u = curUser(); if (!u) return;
  const ex = extra || {};
  p.history.push({ user: u.fn + ' ' + u.ln, userId: u.id, role: ex.actedRole || u.role, action, comment: comment || '', from: from || '', to: to || '', date: todayJStr(), time: nowTimeStr(), sig: ex.sig || null });
}
/* نمایش «عنوان سمت (نقش)» در تاریخچه گردش کار — قالب درخواستی: «نام — عنوان سمت (نقش) — تاریخ ساعت» */
function histPosRole(hh){
  const u = hh.userId ? getUser(hh.userId) : (db.users.find(function(x){ return (x.fn + ' ' + x.ln) === hh.user; }) || null);
  const role = ROLES[hh.role] || hh.role || '';
  const pos = (u && u.pos) ? String(u.pos).trim() : '';
  if (!pos) return role;
  if (!role) return pos;
  /* اگر سمت سازمانی با برچسب نقش یکسان بود، از تکرار پرهیز می‌شود */
  return pos === role ? pos : (pos + ' (' + role + ')');
}
/* ---- اعلان درون‌برنامه‌ای شخصی — برای هر کاربر هدف یک رکورد در db.notifs ثبت می‌شود ---- */
function pushNotif(toIds, text, opts){
  const ids = (Array.isArray(toIds) ? toIds : [toIds]).filter(x => x && db.users.some(u => u.id === x));
  const uniq = [];
  ids.forEach(x => { if (uniq.indexOf(x) === -1) uniq.push(x); });
  const o = opts || {};
  uniq.forEach(uid2 => {
    db.notifs.push({
      id: uid(), to: uid2, text: String(text || ''), sub: o.sub || '',
      cls: o.cls || 'ic-info', icon: o.icon || 'bell', code: o.code || '',
      date: todayJStr(), time: nowTimeStr(), read: false
    });
  });
  /* سقف نگهداری: ۴۰ اعلان آخر برای هر کاربر */
  uniq.forEach(uid2 => {
    const mine = db.notifs.filter(n => n.to === uid2);
    if (mine.length > 40){
      const drop = mine.slice(0, mine.length - 40).map(n => n.id);
      db.notifs = db.notifs.filter(n => drop.indexOf(n.id) === -1);
    }
  });
}
/* ---- اعلان استاندارد رویدادهای گردش کار ----
   گیرندگان همیشه بدون خودِ اقدام‌کننده فیلتر می‌شوند تا اعلان بی‌مقصد ساخته نشود */
function notifTargets(ids){
  const me = curUser();
  return (Array.isArray(ids) ? ids : [ids]).filter(x => x && db.users.some(u => u.id === x) && (!me || x !== me.id));
}
function budgetUserIds(){
  return db.users.filter(u => hasRole(u, 'budget') && u.active).map(u => u.id);
}
function truncReason(s){
  s = String(s || '').trim();
  return s ? (s.length > 80 ? s.slice(0, 80) + '…' : s) : '';
}
function wfNotify(p, ids, text, opts){
  const t = notifTargets(ids);
  if (!t.length) return;
  pushNotif(t, text, Object.assign({ code: p.code }, opts || {}));
}

  if (!u || !u.active || u.ph !== hashStr(String(pass) + u.username)){
    const card = $('#loginCard');

  session.user = u;
  try { sessionStorage.setItem(SESSION_KEY, u.username); } catch (e) {}

};
function appearance(){
  const a = db.settings.appearance;
  return (a && typeof a === 'object') ? a : (db.settings.appearance = {});
}
function effectiveAppearance(){
  const a = appearance();
  const th = APPEAR_THEMES[a.theme] || APPEAR_THEMES.navy;
  return {
    theme: th,
    primary: a.primary || th.primary,
    accent: a.accent || th.accent,
    gold: th.gold
  };
}
function applySettings(){
  const s = db.settings, a = appearance();
  const eff = effectiveAppearance();
  const root = document.documentElement.style;
  root.setProperty('--primary', eff.primary);
  root.setProperty('--accent', eff.accent);
  root.setProperty('--accent-soft', 'color-mix(in srgb, ' + eff.accent + ', #fff 88%)');
  root.setProperty('--sb-grad', 'linear-gradient(180deg,' + eff.theme.sb[0] + ' 0%,' + eff.theme.sb[1] + ' 55%,' + eff.theme.sb[2] + ' 100%)');
  root.setProperty('--gold', eff.gold);
  /* ---- تصاویر پس‌زمینه: '' = تصویر پیش‌فرض پالایشگاه، 'none' = بدون تصویر، dataURL = تصویر دلخواه ---- */
  const strip = a.hdrImg === 'none' ? 'none' : (a.hdrImg ? 'url("' + a.hdrImg + '")' : (typeof HDR_STRIP === 'string' ? 'url("' + HDR_STRIP + '")' : 'none'));
  const limg  = a.loginImg === 'none' ? 'none' : (a.loginImg ? 'url("' + a.loginImg + '")' : (typeof HDR_IMG === 'string' ? 'url("' + HDR_IMG + '")' : 'none'));
  root.setProperty('--hdr-strip', strip);

  let hdrAr = 'auto';
  if (strip !== 'none'){
    const customAr = parseFloat(a.hdrAr);
    hdrAr = (a.hdrImg && !isNaN(customAr) && customAr >= 2.2 && customAr <= 14) ? String(customAr) : '10.7717';
  }
  root.setProperty('--hdr-ar', hdrAr);
  /* ---- شدت تیرگی اورلی تصاویر (٪) ---- */
  const ov = Math.min(Math.max(+a.overlay || 55, 20), 90) / 100;
  root.setProperty('--tb-grad', 'linear-gradient(90deg,rgba(4,22,46,' + Math.min(0.40 + ov, 1).toFixed(2) + ') 0%,rgba(6,28,58,' + Math.min(0.31 + ov, 1).toFixed(2) + ') 45%,rgba(9,40,84,' + ov.toFixed(2) + ') 100%)');

function buildNotifs(){
  const u = curUser(); if (!u) return [];
  const items = [];
  /* اعلان‌های ذخیره‌شده (شخصی) — نخوانده‌ها اول */
  const stored = (db.notifs || []).filter(n => n.to === u.id).slice().reverse();
  stored.sort((a, b) => (a.read === b.read) ? ((b.date + b.time).localeCompare(a.date + a.time)) : (a.read ? 1 : -1));
  stored.forEach(n => items.push({ p: n.code ? findProgram(n.code) : null, text: n.text, cls: n.cls || 'ic-info', ic: I[n.icon] || I.bell, n, date: n.date, time: n.time, read: !!n.read }));
  const add = (p, text, cls, ic) => items.push({ p, text, cls, ic });
  if (hasRole(u, 'committer'))
    db.programs.filter(p => p.status === 'pending_committer' && p.committerId === u.id).forEach(p => add(p, 'برنامه «' + p.title + '» در کارتابل بررسی شماست.', 'ic-amber', I.clock));
  if (hasRole(u, 'senior'))
    db.programs.filter(p => p.status === 'pending_senior' && p.seniorManagerId === u.id).forEach(p => add(p, 'برنامه «' + p.title + '» در انتظار تصمیم شماست.', 'ic-violet', I.clock));
  if (hasRole(u, 'budget'))
    db.programs.filter(p => p.status === 'pending_budget').forEach(p => add(p, 'درخواست «' + p.title + '» در انتظار تصمیم کنترل بودجه است.', 'ic-info', I.coins));
  if (hasRole(u, 'applicant'))
    visiblePrograms(u).forEach(p => {
      if (p.status === 'returned' && (p.applicantId === u.id || p.createdBy === u.id)) add(p, 'برنامه «' + p.title + '» برای اصلاح بازگشت داده شد.', 'ic-orange', I.undo);
      else if (p.status === 'approved') add(p, 'برنامه «' + p.title + '» تأیید نهایی شد.', 'ic-green', I.checkC);
      else if (p.status === 'rejected') add(p, 'برنامه «' + p.title + '» رد شد.', 'ic-red', I.xC);
    });
  if (hasRole(u, 'admin')){
    ['pending_committer','pending_senior','pending_budget'].forEach(st => {
      const c = db.programs.filter(p => p.status === st).length;
      if (c) add(null, toFa(c) + ' برنامه ' + statusLabel(st) + '.', 'ic-gray', I.clock);
    });
  }
  return items;
}
function toggleNotifPop(items){
  const holder = $('#notifPop');
  if (holder.innerHTML){ holder.innerHTML = ''; return; }
  const u = curUser();
  const unread = (db.notifs || []).filter(n => n.to === u.id && !n.read).length;
  holder.innerHTML = '<div class="notif-pop">' +
    '<div class="notif-head"><span>اعلان‌ها</span><span class="chip chip-soft">' + toFa(items.length) + ' مورد</span></div>' +
    '<div class="notif-list">' +
    (items.length ? items.map((it, i) =>
      '<div class="notif-item" data-i="' + i + '" data-nid="' + (it.n ? it.n.id : '') + '" style="' + (it.n && !it.read ? 'background:#f0f7ff' : '') + '"><div class="ni-ic ' + it.cls + '">' + it.ic + '</div>' +
      '<div><div class="ni-t">' + esc(it.text) + (it.n && !it.read ? ' <span class="chip st-info" style="font-size:9px;padding:1px 7px">جدید</span>' : '') + '</div>' +
      '<div class="ni-m">' + (it.n ? fmtJStr(it.n.date) + (it.n.time ? ' ' + toFa(it.n.time) : '') : '') + (it.p ? (it.n ? ' — ' : '') + esc(it.p.code) : '') + '</div></div></div>'
    ).join('') : '<div class="empty" style="padding:24px">' + I.checkC + '<div class="e-t">اعلان جدیدی وجود ندارد</div></div>') +
    '</div>' +
    (unread ? '<div style="padding:9px 14px;border-top:1px solid #e8eef5;text-align:center"><button class="btn btn-ghost btn-sm" id="notifReadAll">' + I.checkC + ' علامت‌گذاری همه به‌عنوان خوانده‌شده (' + toFa(unread) + ')</button></div>' : '') +
    '</div>';
  $$('.notif-item', holder).forEach(x => x.addEventListener('click', () => {
    const it = items[+x.getAttribute('data-i')];
    const nid = x.getAttribute('data-nid');
    holder.innerHTML = '';
    if (nid){
      const rec = (db.notifs || []).find(n2 => n2.id === nid);
      if (rec && !rec.read){ rec.read = true; saveDB(true); updateHeader(); }
    }
    if (it.p) nav('pdetail', { id: it.p.code });
  }));
  const ra = $('#notifReadAll');
  if (ra) ra.addEventListener('click', () => {
    (db.notifs || []).forEach(n2 => { if (n2.to === u.id) n2.read = true; });
    saveDB(true);
    holder.innerHTML = '';
    updateHeader();
    toast('همه اعلان‌ها خوانده‌شده علامت‌گذاری شد', 'success');
  });
}
document.addEventListener('click', e => {

/* ---------------- ناوبری ---------------- */
function nav(view, params){
  const u = curUser(); if (!u) return;
  if (!navAccess(u, view)){ toast('شما به این بخش دسترسی ندارید', 'error'); return; }
  /* بخش غیرفعال‌شده توسط مدیر سایت → هدایت به اولین بخش در دسترس */
  if (VIEWS[view] && VIEWS[view].mod && moduleOff(VIEWS[view].mod) && !hasRole(u, 'admin')){
    const fb = ['dashboard','programs','cart','reports','profile'].find(k => navAccess(u, k) && !moduleOff(k));
    if (fb){ params = {}; view = fb; }
  }
  closeAllModals();
  state.view = view;
  state.params = params || {};
  if (view === 'programs' || view === 'cart') state.lastList = view;
  document.body.classList.remove('side-open');
  render();
  buildSidebar();
  updateHeader();
  window.scrollTo({ top: 0 });
}
function render(){
  const u = curUser(); if (!u) return;
  const v = VIEWS[state.view];
  if (!v || !navAccess(u, state.view)){ state.view = 'dashboard'; }
  const v2 = VIEWS[state.view];
  const mc = $('#mainContent');
  mc.innerHTML = '';
  document.body.classList.remove('bulk-on'); /* پاکسازی نوار اقدام گروهی کارتابل هنگام خروج از صفحه */
  if (v2 && v2.mod && moduleOff(v2.mod) && !hasRole(u, 'admin')){
    mc.innerHTML = '<div class="panel"><div class="panel-b">' + emptyState('این بخش غیرفعال است', 'بخش «' + esc(v2.title) + '» توسط مدیر سایت غیرفعال شده است. برای فعال‌سازی با مدیر سایت تماس بگیرید.', I.xC) + '</div></div>';
    return;
  }
  VIEWS[state.view].render();
  const active = $$('#sidebar .side-item[data-view="' + state.view + '"]');
  $$('#sidebar .side-item').forEach(b => b.classList.remove('active'));
  if (active[0]) active[0].classList.add('active');
}

/* ═══════════ p07_charts.js ═══════════ */

/* ================================================================
   بخش ۵ — موتور نمودار Canvas (داخلی، RTL، فارسی، با Tooltip و Hover)
   ================================================================ */
const CHART_PALETTE = ['#1f7ae0','#16a34a','#f59e0b','#8b5cf6','#ef4444','#0ea5e9','#d946ef','#64748b','#14b8a6','#f97316'];
let activeCharts = [];
function registerChart(cv, drawFn){
  const ex = activeCharts.find(c => c.cv === cv);
  if (ex){ ex.drawFn = drawFn; return; }
  activeCharts.push({ cv, drawFn });
}
function redrawCharts(){
  activeCharts = activeCharts.filter(c => c.cv && c.cv.isConnected);
  activeCharts.forEach(c => { try { c.cv._hi = -1; c.drawFn(); } catch (e) {} });
}
window.addEventListener('resize', debounce(redrawCharts, 250));

function setupCanvas(cv, h){
  const dpr = window.devicePixelRatio || 1;
  /* ابتدا سبک اعمال می‌شود تا clientWidth واقعی (نه عرض ذاتی ۳۰۰px) خوانده شود */
  cv.style.height = (h || (cv.getAttribute('data-h') ? +cv.getAttribute('data-h') : 240)) + 'px';
  cv.style.width = '100%';
  const w = cv.clientWidth || cv.parentElement.clientWidth || 300;
  const H = parseFloat(cv.style.height);
  cv.width = Math.max(w * dpr, 10); cv.height = Math.max(H * dpr, 10);
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, H);
  ctx.font = '12px Vazirmatn, Tahoma, sans-serif';
  return { ctx, w, H, dpr };
}
function roundRect(ctx, x, y, w, h, r){
  if (ctx.roundRect){ ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function drawEmpty(cv, msg){
  cv._hits = [];
  const { ctx, w, H } = setupCanvas(cv);
  ctx.fillStyle = '#94a3b8'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '13px Vazirmatn, Tahoma, sans-serif';
  ctx.fillText(msg || 'داده‌ای برای نمایش وجود ندارد', w / 2, H / 2);
}

/* ---- کمکی: روشن/تیره‌کردن رنگ hex ---- */
function shadeHex(hex, f){
  let h = String(hex || '#1f7ae0').replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (f >= 0){ r = Math.round(r + (255 - r) * f); g = Math.round(g + (255 - g) * f); b = Math.round(b + (255 - b) * f); }
  else { r = Math.round(r * (1 + f)); g = Math.round(g * (1 + f)); b = Math.round(b * (1 + f)); }
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

/* ---- Tooltip نمودارها ---- */
let tipEl = null;
function chartTipShow(html, x, y){
  if (!tipEl){ tipEl = document.createElement('div'); tipEl.id = 'chartTip'; document.body.appendChild(tipEl); }
  tipEl.innerHTML = html;
  tipEl.classList.add('on');
  const tw = tipEl.offsetWidth || 130, th = tipEl.offsetHeight || 40;
  let px = x + 14, py = y - th - 12;
  if (px + tw > window.innerWidth - 8) px = x - tw - 14;
  if (py < 8) py = y + 18;
  tipEl.style.left = px + 'px'; tipEl.style.top = py + 'px';
}
function chartTipHide(){ if (tipEl) tipEl.classList.remove('on'); }
function bindChartHover(cv){
  if (cv._hoverBound) return;
  cv._hoverBound = true;
  cv.addEventListener('mousemove', e => {
    if (!cv._hits || !cv._hits.length) return;
    const r = cv.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const hit = cv._hits.find(h => h.test ? h.test(mx, my) : (mx >= h.x && mx <= h.x + h.w && my >= h.y && my <= h.y + h.h));
    const hi = hit ? hit.i : -1;
    if (hi !== cv._hi){ cv._hi = hi; if (cv._redraw) cv._redraw(); }
    if (hit){
      chartTipShow('<div>' + hit.tt + '</div>' + (hit.sub ? '<div class="tt-l">' + hit.sub + '</div>' : ''), e.clientX, e.clientY);
    } else chartTipHide();
  });
  cv.addEventListener('mouseleave', () => {
    if (cv._hi){ cv._hi = -1; if (cv._redraw) cv._redraw(); }
    chartTipHide();
  });
}
function mountChart(cv, hits, redrawFn){
  cv._hits = hits;
  cv._redraw = redrawFn;
  bindChartHover(cv);
  registerChart(cv, redrawFn);
  /* اگر پس از رسم، چیدمان تغییر کرد (مثلاً راهنما کنار نمودار اضافه شد) یک‌بار با اندازه نهایی دوباره رسم کن */
  if (!cv._pendingFit){
    cv._pendingFit = true;
    requestAnimationFrame(() => {
      cv._pendingFit = false;
      if (cv.isConnected){
        const target = Math.round(cv.clientWidth * (window.devicePixelRatio || 1));
        if (target && Math.abs(target - cv.width) > 2){ cv._hi = -1; redrawFn(); }
      }
    });
  }
}

/* نمودار میله‌ای افقی RTL — rows: [{label, value, color}] */
function drawHBar(cv, rows, opts){
  opts = opts || {};
  rows = (rows || []).filter(r => r.value !== null && r.value !== undefined && !isNaN(r.value));
  if (cv._hi === undefined) cv._hi = -1;
  if (!rows.length){ drawEmpty(cv); return; }
  const { ctx, w, H } = setupCanvas(cv, opts.height);
  const n = rows.length;
  const rowH = Math.min(40, (H - 10) / n);
  const gap = 9;
  const labelW = opts.labelW || Math.min(Math.max(w * 0.3, 110), 200);
  const valW = 92;
  const barArea = Math.max(w - labelW - valW - 18, 40);
  const trackX = w - labelW - 8 - barArea;
  const max = Math.max.apply(null, rows.map(r => r.value)) || 1;
  const fmt = opts.fmt || (v => fmtInt(v));
  /* خطوط شبکه عمودی */
  ctx.strokeStyle = '#edf2f8'; ctx.lineWidth = 1;
  for (let t = 0; t <= 4; t++){
    const gx = trackX + barArea * t / 4;
    ctx.beginPath(); ctx.moveTo(gx, 4); ctx.lineTo(gx, H - 6); ctx.stroke();
  }
  const hits = [];
  rows.forEach((r, i) => {
    const y = 8 + i * (rowH + gap);
    const hi = cv._hi === i;
    const barH = 16;
    const cy = y + (rowH - barH) / 2;
    /* تراک راهنما */
    ctx.fillStyle = hi ? '#e9f1fb' : '#f1f5f9';
    roundRect(ctx, trackX, cy, barArea, barH, 8); ctx.fill();
    /* برچسب ردیف */
    ctx.fillStyle = hi ? '#1f7ae0' : '#334155';
    ctx.font = '600 11.5px Vazirmatn, Tahoma, sans-serif';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    let lbl = r.label;
    while (ctx.measureText(lbl).width > labelW - 6 && lbl.length > 3) lbl = lbl.slice(0, -2);
    if (lbl !== r.label) lbl += '…';
    ctx.fillText(lbl, w - 4, y + rowH / 2);
    /* میله گرادیانی */
    const bw = Math.max((r.value / max) * barArea, 3);
    const bx = trackX + barArea - bw;
    const base = r.color || CHART_PALETTE[i % CHART_PALETTE.length];
    const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    g.addColorStop(0, shadeHex(base, hi ? 0.34 : 0.22));
    g.addColorStop(1, base);
    ctx.fillStyle = g;
    roundRect(ctx, bx, cy, bw, barH, 8); ctx.fill();
    /* مقدار: داخل میله (وقتی جا هست) یا بیرون آن */
    ctx.font = '700 11px Vazirmatn, Tahoma, sans-serif';
    ctx.textAlign = 'right';
    if (bw > 78){
      ctx.fillStyle = '#fff';
      ctx.fillText(fmt(r.value), bx + bw - 9, y + rowH / 2);
    } else {
      ctx.fillStyle = '#1e293b';
      ctx.fillText(fmt(r.value), bx - 7, y + rowH / 2);
    }
    hits.push({ x: 0, y: y, w: w, h: rowH + gap, i: i, tt: esc(r.label), sub: fmt(r.value) });
  });
  mountChart(cv, hits, () => drawHBar(cv, rows, opts));
}

/* نمودار دونات — rows: [{label, value, color}]؛ راهنما جداگانه با legendHTML */
function drawDonut(cv, rows, opts){
  opts = opts || {};
  rows = (rows || []).filter(r => r.value > 0);
  if (cv._hi === undefined) cv._hi = -1;
  if (!rows.length){ drawEmpty(cv, 'داده‌ای برای نمایش وجود ندارد'); return; }
  const { ctx, w, H } = setupCanvas(cv, opts.height || 210);
  const total = rows.reduce((s, r) => s + r.value, 0);
  const cx = w / 2, cy = H / 2, R = Math.min(w, H) / 2 - 12, r2 = R * 0.62;
  const fmt = opts.fmt || (v => fmtInt(v));
  const TAU = Math.PI * 2, START = -Math.PI / 2;
  let ang = START;
  const hits = [];
  rows.forEach((r, i) => {
    const a = (r.value / total) * TAU;
    const hi = cv._hi === i;
    const mid = ang + a / 2;
    const off = hi ? 6 : 0;
    const ox = Math.cos(mid) * off, oy = Math.sin(mid) * off;
    ctx.save();
    if (hi){ ctx.shadowColor = 'rgba(15,40,80,.3)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 3; }
    ctx.beginPath();
    ctx.arc(cx + ox, cy + oy, R, ang + 0.014, ang + a - 0.014);
    ctx.arc(cx + ox, cy + oy, r2, ang + a - 0.014, ang + 0.014, true);
    ctx.closePath();
    ctx.fillStyle = r.color || '#1f7ae0';
    ctx.fill();
    ctx.restore();
    /* ناحیه hover بر اساس زاویه */
    let rel0 = ang - START; while (rel0 < 0) rel0 += TAU; while (rel0 >= TAU) rel0 -= TAU;
    const rel1 = rel0 + a;
    const ccx = cx + ox, ccy = cy + oy, col = r.color || '#1f7ae0';
    hits.push({
      i: i,
      test: (mx, my) => {
        const dx = mx - ccx, dy = my - ccy, d = Math.hypot(dx, dy);
        if (d > R || d < r2 * 0.8) return false;
        let na = Math.atan2(dy, dx) - START;
        while (na < 0) na += TAU; while (na >= TAU) na -= TAU;
        return na >= rel0 && na < rel1;
      },
      tt: esc(r.label),
      sub: fmt(r.value) + ' (' + toFa(Math.round(r.value / total * 100)) + '٪)'
    });
    ang += a;
  });
  ctx.fillStyle = '#1e293b'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '800 13px Vazirmatn, Tahoma, sans-serif';
  ctx.fillText(opts.centerLabel || shortNum(total), cx, cy - 8);
  ctx.font = '10.5px Vazirmatn, Tahoma, sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.fillText(opts.centerSub || '', cx, cy + 11);
  mountChart(cv, hits, () => drawDonut(cv, rows, opts));
}
function legendHTML(rows, fmtFn){
  const total = rows.reduce((s, r) => s + r.value, 0) || 1;
  return '<div class="legend">' + rows.map((r, i) =>
    '<div class="lg-item" data-lgi="' + i + '"><span class="lg-c" style="background:' + (r.color || '#1f7ae0') + '"></span>' +
    '<span class="lg-l" title="' + esc(r.label) + '">' + esc(r.label) + '</span>' +
    '<span class="lg-v">' + (fmtFn ? fmtFn(r.value) : fmtInt(r.value)) + ' (' + toFa(Math.round(r.value / total * 100)) + '٪)</span></div>'
  ).join('') + '</div>';
}
/* هم‌زمان‌سازی هاور راهنما با نمودار: با نگه‌داشتن نشانگر روی هر ردیف راهنما، همان بخش در نمودار برجسته می‌شود */
function bindLegend(lgEl, cv){
  if (!lgEl || !cv) return;
  $$('.lg-item', lgEl).forEach(it => {
    const i = +it.getAttribute('data-lgi');
    it.addEventListener('mouseenter', () => { cv._hi = i; if (cv._redraw) cv._redraw(); });
    it.addEventListener('mouseleave', () => { cv._hi = -1; if (cv._redraw) cv._redraw(); });
  });
}

/* نمودار میله‌ای عمودی (ماه‌ها) — rows: [{label, value}]؛ برچسب‌های بلند (نام کامل ماه‌ها) به‌صورت خودکار چرخانده می‌شوند تا کامل دیده شوند */
function drawVBar(cv, rows, opts){
  opts = opts || {};
  rows = (rows || []).slice();
  if (cv._hi === undefined) cv._hi = -1;
  if (!rows.length || !rows.some(r => r.value > 0)){ drawEmpty(cv, 'برنامه جذبی برای این سال ثبت نشده است'); return; }
  const { ctx, w, H } = setupCanvas(cv, opts.height || 250);
  const fmt = opts.fmt || (v => fmtInt(v));
  /* --- تشخیص نیاز به چرخش برچسب‌ها: اگر نام کامل در عرض هر ستون جا نشود، ۴۵ درجه می‌چرخد --- */
  ctx.font = '10px Vazirmatn, Tahoma, sans-serif';
  const maxLblW = Math.max.apply(null, rows.map(r => ctx.measureText(r.label || '').width)) || 0;
  const slotH = (w - 74 - 10) / Math.max(rows.length, 1);
  const rotate = maxLblW > 0 && slotH < maxLblW + 8;
  const pb = rotate ? Math.ceil(maxLblW * 0.7071) + 22 : 30;
  const pl = rotate ? 46 : 10, pr = 74, pt = 26;
  const chartH = H - pb - pt;
  const n = rows.length;
  const plotW = Math.max(w - pr - pl, 60);
  const slot = plotW / n;
  const bw = Math.min(slot * 0.52, 36);
  const max = Math.max.apply(null, rows.map(r => r.value)) || 1;
  /* خطوط شبکه افقی + برچسب محور عمودی */
  ctx.textBaseline = 'middle';
  for (let t = 0; t <= 4; t++){
    const gy = pt + chartH - chartH * t / 4;
    ctx.strokeStyle = '#edf2f8'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pl, gy); ctx.lineTo(pl + plotW, gy); ctx.stroke();
    ctx.fillStyle = '#9aa8bb'; ctx.font = '9.5px Vazirmatn, Tahoma, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(shortNum(max * t / 4), pl + plotW + 6, gy);
  }
  const yb = pt + chartH;
  const hits = [];
  rows.forEach((r, i) => {
    const x = pl + i * slot + (slot - bw) / 2;
    const hi = cv._hi === i;
    const bh = Math.max((r.value / max) * chartH, r.value > 0 ? 3 : 0);
    const y = yb - bh;
    if (r.value > 0){
      const base = r.color || '#1f7ae0';
      const g = ctx.createLinearGradient(0, y, 0, y + bh);
      g.addColorStop(0, shadeHex(base, hi ? 0.3 : 0.16));
      g.addColorStop(1, base);
      ctx.fillStyle = g;
      roundRect(ctx, x, y, bw, bh, 5); ctx.fill();
    } else {
      ctx.fillStyle = '#e8edf4';
      roundRect(ctx, x, yb - 3, bw, 3, 1.5); ctx.fill();
    }
    /* برچسب ماه — کامل و بدون بریدگی (افقی یا چرخانده) */
    ctx.font = '10px Vazirmatn, Tahoma, sans-serif';
    ctx.fillStyle = hi ? '#1f7ae0' : '#475569';
    if (rotate){
      ctx.save();
      ctx.translate(pl + i * slot + slot / 2 + 4, yb + 9);
      ctx.rotate(-Math.PI / 4);
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillText(r.label, 0, 0);
      ctx.restore();
    } else {
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(r.label, pl + i * slot + slot / 2, yb + 8);
    }
    if (r.value > 0 && (slot >= 26 || cv._hi === i)){
      /* برچسب مقدار: در بوم باریک دو سطح متناوب؛ در عرض خیلی کم فقط با هاور (مقدار دقیق در Tooltip هست) */
      const lvl = rotate ? (i % 2 === 0 ? 9 : 24) : 15;
      const vy = Math.max(y - lvl, pt + 7);
      ctx.fillStyle = hi ? '#1f7ae0' : '#1e293b'; ctx.font = '600 9.5px Vazirmatn, Tahoma, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(shortNum(r.value), pl + i * slot + slot / 2, vy);
    }
    hits.push({ x: pl + i * slot, y: pt, w: slot, h: chartH + pb, i: i, tt: esc(r.label), sub: fmt(r.value) });
  });
  mountChart(cv, hits, () => drawVBar(cv, rows, opts));
}

/* نمودار میله‌ای افقی گروهی — groups: [{label, values:[v1,v2,...]}]؛ series: [{label,color}] */
function drawGroupedHBar(cv, groups, series, opts){
  opts = opts || {};
  groups = (groups || []).filter(g => g.values.some(v => v > 0));
  if (cv._hi === undefined) cv._hi = -1;
  if (!groups.length || !series.length){ drawEmpty(cv); return; }
  const { ctx, w, H } = setupCanvas(cv, opts.height);
  const labelW = opts.labelW || Math.min(Math.max(w * 0.26, 100), 180);
  const valW = 70;
  const barArea = Math.max(w - labelW - valW - 14, 40);
  const trackX = w - labelW - 6 - barArea;
  const max = Math.max.apply(null, groups.map(g => Math.max.apply(null, g.values))) || 1;
  const fmt = opts.fmt || (v => fmtInt(v));
  ctx.strokeStyle = '#edf2f8'; ctx.lineWidth = 1;
  for (let t = 0; t <= 4; t++){
    const gx = trackX + barArea * t / 4;
    ctx.beginPath(); ctx.moveTo(gx, 4); ctx.lineTo(gx, H - 6); ctx.stroke();
  }
  const gh = (H - 12) / groups.length;
  const bh = Math.max(Math.min((gh - 12) / series.length, 13), 5);
  const hits = [];
  groups.forEach((g, gi) => {
    const gy = 6 + gi * gh;
    ctx.fillStyle = '#334155'; ctx.font = '600 11.5px Vazirmatn, Tahoma, sans-serif';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    let lbl = g.label;
    while (ctx.measureText(lbl).width > labelW - 6 && lbl.length > 3) lbl = lbl.slice(0, -2);
    if (lbl !== g.label) lbl += '…';
    ctx.fillText(lbl, w - 4, gy + gh / 2);
    const blockH = bh * series.length + 2 * (series.length - 1);
    const startY = gy + (gh - blockH) / 2;
    series.forEach((s, si) => {
      const v = g.values[si] || 0;
      const bw2 = Math.max((v / max) * barArea, v > 0 ? 3 : 0);
      const bx = trackX + barArea - bw2;
      const yy = startY + si * (bh + 2);
      const g2 = ctx.createLinearGradient(bx, 0, bx + bw2, 0);
      g2.addColorStop(0, shadeHex(s.color, 0.2));
      g2.addColorStop(1, s.color);
      ctx.fillStyle = g2;
      roundRect(ctx, bx, yy, bw2, bh, 4); ctx.fill();
      if (v > 0){
        ctx.fillStyle = '#475569'; ctx.font = '600 9.5px Vazirmatn, Tahoma, sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(shortNum(v), bx - 5, yy + bh / 2);
      }
      hits.push({ x: 0, y: yy - 1, w: w, h: bh + 2, i: hits.length, tt: esc(g.label) + ' — ' + esc(s.label), sub: fmt(v) });
    });
  });
  mountChart(cv, hits, () => drawGroupedHBar(cv, groups, series, opts));
}
function seriesLegendHTML(series){
  return '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px">' + series.map(s =>
    '<span style="display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#475569"><span class="lg-c" style="width:11px;height:11px;border-radius:3px;background:' + s.color + '"></span>' + esc(s.label) + '</span>'
  ).join('') + '</div>';
}

}

  $('#lgType').innerHTML = legendHTML(typeRows, v => shortNum(v));
  bindLegend($('#lgType'), $('#chType'));
  drawVBar($('#chMonths'), monthRows, { height: 260, fmt: fmtMoney });
  $('#slComp').innerHTML = seriesLegendHTML(compSeries);

  bindLegend($('#lgUnits'), $('#chUnits'));
}

/* ================================================================
   بخش ۷ — ویزارد درخواست برنامه (۵ مرحله)
   ================================================================ */
let wiz = null;
function cfgFields(scope){
  return (db.fields || []).filter(f => f.scope === scope && f.enabled !== false).sort((a, b) => a.ord - b.ord);
}
function newProgramSkeleton(){
  const u = curUser();
  return {
    code: null, title: '', year: budgetYear(), mgmtId: '', unitId: '',
    applicantId: hasRole(u, 'applicant') ? u.id : '',
    committerId: '', seniorManagerId: '',
    generalGoals: '', description: '', finBenefit: '', finBenefitDesc: '',
    nonFinBenefit: '', nonFinBenefitDesc: '', risks: '', currentStatus: '', altSolution: '',
    createdAt: '', createdTime: '', createdBy: u.id, status: 'draft',
    submittedAt: '', submittedTime: '', submittedBy: '', suggestedAmount: 0, approvedAmount: 0,
    micros: [], history: []
  };
}
function renderRequest(){
  const u = curUser();
  wiz = null;
  if (state.params && state.params.id){
    const src = findProgram(state.params.id);
    if (src && !canEditProgram(u, src)){
      wiz = null;
      $('#mainContent').innerHTML = pageHead('درخواست برنامه', I.docPlus, '') +
        '<div class="panel"><div class="panel-b">' + emptyState('اجازه ویرایش وجود ندارد', 'این برنامه در وضعیت فعلی قابل ویرایش نیست. برای مشاهده جزئیات از لیست برنامه‌ها اقدام کنید.', I.lock) +
        '<div style="text-align:center;margin-top:-20px;padding-bottom:20px"><button class="btn btn-primary" id="goDetail">' + I.eye + ' مشاهده جزئیات برنامه</button></div></div></div>';
      $('#goDetail').addEventListener('click', () => nav('pdetail', { id: src.code }));
      return;
    }
    if (src) wiz = { prog: clone(src), isNew: false, step: 1, dd: {} };
  }
  if (!wiz) wiz = { prog: newProgramSkeleton(), isNew: true, step: 1, dd: {} };
  renderWizStep();
}
function wizHeaderHTML(){
  const p = wiz.prog;
  return '<div class="panel" style="margin-bottom:18px"><div class="panel-b" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">' +
    '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">' +
    '<span class="chip chip-soft" style="font-size:12.5px">' + I.file.replace('<svg', '<svg style="width:15px;height:15px"') + ' شناسه: ' + (p.code ? toFa(p.code) : 'پس از ذخیره صادر می‌شود') + '</span>' +
    statusBadge(p.status) +
    '<span style="font-size:12.5px;color:var(--muted)">متقاضی: ' + esc(personName(p.applicantId) || '—') + '</span>' +
    '</div>' +
    (wiz.isNew ? '<span class="chip st-amber">پیش‌نویس جدید — ذخیره نشده</span>' : '<button class="btn btn-ghost btn-sm" id="wizView">' + I.eye + ' مشاهده جزئیات</button>') +
    '</div></div>';
}
function stepperHTML(){
  const steps = [
    { t: 'اطلاعات عمومی برنامه', s: 'مشخصات و مزایا' },
    { t: 'ثبت ریزتقاضاها', s: 'افزودن از طریق فرم' },
    { t: 'جزئیات فنی و اجرایی', s: 'داخل فرم ریزتقاضا' },
    { t: 'پیش‌بینی جذب ماهانه', s: 'داخل فرم ریزتقاضا' },
    { t: 'ثبت نهایی برنامه', s: 'مرور و ارسال' }
  ];
  let h = '<div class="stepper">';
  steps.forEach((s, i) => {
    const n = i + 1;
    const cls = wiz.step === n ? ' active' : (wiz.step > n ? ' done' : '');
    h += '<div class="step' + cls + '"><div class="step-dot">' + (wiz.step > n ? I.check : toFa(n)) + '</div>' +
      '<div class="step-title">' + s.t + '<div class="step-sub">' + s.s + '</div></div></div>';
  });
  return h + '</div>';
}
function renderWizStep(){
  const mc = $('#mainContent');
  let html = pageHead(wiz.prog.title ? 'ویرایش برنامه: ' + wiz.prog.title : 'ثبت درخواست برنامه بودجه', I.docPlus, 'مراحل ثبت را به‌ترتیب تکمیل کنید؛ می‌توانید در هر مرحله پیش‌نویس را ذخیره کنید');
  html += wizHeaderHTML() + stepperHTML() + '<div id="wizBody"></div>';
  mc.innerHTML = html;
  $('#wizView') && $('#wizView').addEventListener('click', () => nav('pdetail', { id: wiz.prog.code }));
  const body = $('#wizBody');
  if (wiz.step === 1) renderWizStep1(body);
  else if (wiz.step === 2) renderWizStep2(body);
  else if (wiz.step === 3) renderWizStep3(body);
  else if (wiz.step === 4) renderWizStep4(body);
  else renderWizStep5(body);
}

/* ---------- مرحله ۱: اطلاعات عمومی ---------- */
/* به‌روزرسانی پویای متعهد/مدیر ارشد پس از تغییر متقاضی (نمای مدیر سایت): پیش‌فرض‌گذاری زنجیره اختصاصی */
function wizRefreshApprovers(applicantId){
  if (!wiz || !wiz.dd) return;
  const au = getUser(applicantId);
  ['committerId','seniorManagerId'].forEach(k => {
    const role = k === 'committerId' ? 'committer' : 'senior';
    if (!wiz.dd[k]) return;
    const ck = chainKeyOf(role);
    if (au && hasRole(au, 'applicant') && au[ck] && usersByRole(role).some(x => x.id === au[ck])){
      wiz.prog[k] = au[ck];
      wiz.dd[k].set(au[ck]);
    }
    const h0 = $('#wf-hint-' + k);
    const t = approverScopeText(au, role, true);
    let h = h0;
    if (t && !h){
      const holder = $('#wf-' + k);
      if (holder){ holder.insertAdjacentHTML('beforeend', '<div class="hint" id="wf-hint-' + k + '"></div>'); h = $('#wf-hint-' + k); }
    }
    if (h){
      if (t) h.textContent = t;
      else h.remove();
    }
  });
}
function renderWizStep1(root){
  const p = wiz.prog;
  wiz.dd = {};
  const fields = cfgFields('main');
  let grid = '<div class="form-grid">';
  fields.forEach(f => { grid += fieldHTML(f.key, f.label, f.req, '<div id="wf-' + f.key + '"></div>'); });
  grid += '</div>';
  root.innerHTML = '<div class="panel"><div class="panel-h"><span class="panel-t">' + I.file + ' مرحله ۱ — اطلاعات عمومی برنامه</span></div>' +
    '<div class="panel-b">' + grid + '</div></div>' + wizNavHTML(true, true);

  fields.forEach(f => {
    const holder = $('#wf-' + f.key, root);
    if (f.key === 'title'){
      holder.innerHTML = '<input class="input" id="wf-in" maxlength="' + (f.max || 150) + '" value="' + esc(p.title) + '" placeholder="مثال: نوسازی و اورهال کمپرسورهای تقویت فشار گاز">';
      $('#wf-in', holder).addEventListener('input', e => { p.title = e.target.value; });
    }
    else if (f.key === 'year'){
      const opts = activeYears().map(y => ({ v: String(y), label: toFa(y) }));
      wiz.dd[f.key] = makeDD(holder, { options: opts, value: String(p.year), placeholder: 'انتخاب سال', onChange: v => { p.year = +v; } });
    }
    else if (f.key === 'managementId'){
      wiz.dd[f.key] = makeDD(holder, {
        options: db.base.managements.filter(x => x.active).map(x => ({ v: x.id, label: x.name })),
        value: p.mgmtId, placeholder: 'انتخاب مدیریت',
        onChange: v => {
          p.mgmtId = v; p.unitId = '';
          if (wiz.dd.unitId){
            wiz.dd.unitId.setOptions(unitsOf(v).map(x => ({ v: x.id, label: x.name })));
            wiz.dd.unitId.setPlaceholder(v ? 'انتخاب واحد' : 'ابتدا مدیریت را انتخاب کنید');
            wiz.dd.unitId.set('');
            wiz.dd.unitId.disable(!v);
          }
        }
      });
    }
    else if (f.key === 'unitId'){
      wiz.dd[f.key] = makeDD(holder, {
        options: unitsOf(p.mgmtId).map(x => ({ v: x.id, label: x.name })),
        value: p.unitId, placeholder: 'ابتدا مدیریت را انتخاب کنید',
        onChange: v => { p.unitId = v; }
      });
      if (!p.mgmtId) wiz.dd[f.key].disable(true);
    }
    else if (f.key === 'applicantId' || f.key === 'committerId' || f.key === 'seniorManagerId'){
      const me = curUser();
      if (f.key === 'applicantId'){
        if (hasRole(me, 'applicant')){
          wiz.dd[f.key] = makeDD(holder, {
            options: [{ v: me.id, label: me.fn + ' ' + me.ln + ' — ' + me.pos }],
            value: me.id, placeholder: 'متقاضی',
            onChange: v => { p.applicantId = v; }
          });
          wiz.dd[f.key].disable(true);
          holder.insertAdjacentHTML('beforeend', '<div class="hint">درخواست به نام خود شما ثبت می‌شود و فقط متعهد و مدیر ارشد مربوط به شما در گردش کار قابل انتخاب است.</div>');
        } else {
          wiz.dd[f.key] = makeDD(holder, {
            options: usersByRole('applicant').map(x => ({ v: x.id, label: x.fn + ' ' + x.ln + ' — ' + x.pos })),
            value: p.applicantId, placeholder: 'انتخاب از فهرست پرسنل (متقاضی)',
            onChange: v => { p.applicantId = v; wizRefreshApprovers(v); }
          });
        }
      } else {
        const role = f.key === 'committerId' ? 'committer' : 'senior';
        const isApp = hasRole(me, 'applicant');
        const au = isApp ? me : getUser(p.applicantId);
        const opts = (isApp ? approverScope(me, role) : usersByRole(role)).map(x => ({ v: x.id, label: x.fn + ' ' + x.ln + ' — ' + x.pos }));
        wiz.dd[f.key] = makeDD(holder, {
          options: opts,
          value: p[f.key], placeholder: 'انتخاب از فهرست پرسنل (' + ROLES[role] + ')',
          onChange: v => { p[f.key] = v; }
        });
        const hint = approverScopeText(au, role, !isApp);
        if (hint) holder.insertAdjacentHTML('beforeend', '<div class="hint" id="wf-hint-' + f.key + '">' + esc(hint) + '</div>');
      }
    }
    else if (f.type === 'select'){
      const list = db.base[f.list] || [];
      wiz.dd[f.key] = makeDD(holder, {
        options: list.filter(x => x.active).map(x => ({ v: x.id, label: x.name })),
        value: p[f.key], placeholder: 'انتخاب کنید',
        onChange: v => { p[f.key] = v; }
      });
    }
    else {
      holder.innerHTML = '<textarea class="input" data-maxlen="' + (f.max || 600) + '" rows="3" placeholder="' + esc('توضیح مربوط به «' + f.label + '»') + '">' + esc(p[f.key] || '') + '</textarea>';
      $('textarea', holder).addEventListener('input', e => { p[f.key] = e.target.value; });
    }
  });
  bindCounters(root);
  bindWizNav(root, { canSave: true });
}
function wizNavHTML(back, mid){
  const isReturned = wiz.prog.status === 'returned';
  const uRole = (curUser() || {}).role;
  const budgetEdit = uRole === 'budget' && !wiz.isNew;
  const lastLabel = budgetEdit ? 'ذخیره تغییرات برنامه'
    : wiz.step === 5 ? (isReturned ? 'ثبت نهایی و ارسال مجدد برای متعهد' : 'ثبت نهایی و ارسال برای متعهد') : 'مرحله بعد';
  return '<div class="wiz-nav"><div class="wn-l">' +
    (back ? '<button class="btn btn-ghost" id="wizPrev">' + I.back + ' مرحله قبل</button>' : '') +
    (mid !== false ? '<button class="btn btn-outline" id="wizSave">' + I.save + ' ذخیره پیش‌نویس</button>' : '') +
    '</div><div class="wn-r">' +
    (wiz.step === 5 ? '<button class="btn btn-success" id="wizSubmit">' + I.send + ' ' + lastLabel + '</button>'
      : '<button class="btn btn-primary" id="wizNext">مرحله بعد ' + I.chevL + '</button>') +
    '</div></div>';
}
function bindWizNav(root, opt){
  $('#wizPrev') && $('#wizPrev').addEventListener('click', () => { if (wiz.step > 1){ wiz.step--; renderWizStep(); } });
  $('#wizNext') && $('#wizNext').addEventListener('click', () => {
    const errs = validateStep1();
    if (errs.length){
      errs.forEach(e => setFieldError(root, e.id, e.msg));
      toast('لطفاً خطاهای مشخص‌شده را برطرف کنید', 'error');
      return;
    }
    wiz.step = Math.min(wiz.step + 1, 5);
    renderWizStep();
  });
  $('#wizSave') && $('#wizSave').addEventListener('click', saveWizDraft);
  $('#wizSubmit') && $('#wizSubmit').addEventListener('click', () => {
    /* مسئول کنترل بودجه: ویرایش بدون بازگرداندن برنامه به ابتدای گردش کار */
    if (hasRole(curUser() || {}, 'budget') && !wiz.isNew){ saveWizDraft(); return; }
    submitWizProgram();
  });
}
function validateStep1(){
  const p = wiz.prog, errs = [];
  const req = (id, val, msg) => { if (!val) errs.push({ id, msg: msg || 'این فیلد ضروری است' }); };
  req('title', p.title && p.title.trim());
  req('year', p.year);
  req('managementId', p.mgmtId);
  req('unitId', p.unitId, 'انتخاب واحد ضروری است');
  req('applicantId', p.applicantId);
  req('committerId', p.committerId);
  req('seniorManagerId', p.seniorManagerId);
  if (p.unitId && p.mgmtId){
    const unit = db.base.units.find(x => x.id === p.unitId);
    if (!unit || unit.mgmtId !== p.mgmtId) errs.push({ id: 'unitId', msg: 'واحد انتخاب‌شده متعلق به مدیریت انتخابی نیست' });
  }
  ['applicantId','committerId','seniorManagerId'].forEach(k => {
    if (p[k]){
      const uu = getUser(p[k]);
      if (!uu || !uu.active) errs.push({ id: k, msg: 'کاربر انتخاب‌شده فعال نیست' });
    }
  });
  const cfg = { title: db.fields.find(f => f.key === 'title') };
  if (cfg.title && cfg.title.max && p.title && p.title.length > cfg.title.max) errs.push({ id: 'title', msg: 'حداکثر ' + toFa(cfg.title.max) + ' کاراکتر مجاز است' });
  return errs;
}

/* ---------- ذخیره پیش‌نویس ---------- */
function saveWizDraft(){
  const p = wiz.prog;
  if (!p.title || !p.title.trim()){ toast('برای ذخیره پیش‌نویس، عنوان برنامه ضروری است', 'warn'); return; }
  if (!p.mgmtId || !p.unitId || !p.year){ toast('سال، مدیریت و واحد برای ذخیره پیش‌نویس ضروری است', 'warn'); return; }
  if (wiz.isNew){
    p.code = nextProgCode(p.year || budgetYear());
    p.createdAt = todayJStr(); p.createdTime = nowTimeStr(); p.createdBy = curUser().id;
    p.status = 'draft';
    db.programs.push(p);
    pushHist(p, 'ایجاد پیش‌نویس برنامه', '', '', 'draft');
    wiz.isNew = false;
    saveDB(true);
    toast('پیش‌نویس برنامه با شناسه ' + p.code + ' ذخیره شد', 'success');
  } else {
    const idx = db.programs.findIndex(x => x.code === p.code);
    if (idx !== -1) db.programs[idx] = p;
    pushHist(p, 'ویرایش برنامه', '', '', '');
    saveDB(true);
    toast('تغییرات برنامه ذخیره شد', 'success');
  }
  renderWizStep();
}

/* ---------- مرحله ۲: ریزتقاضاها ---------- */
function renderWizStep2(root){
  const p = wiz.prog;
  const rows = p.micros.map((m, i) => {
    const planSum = Object.values(m.plan || {}).reduce((s, v) => s + (v || 0), 0);
    const diff = m.amount - planSum;
    return '<tr>' +
      '<td style="font-weight:700;color:var(--accent)">' + toFa(m.id) + '</td>' +
      '<td class="ttl-cell" title="' + esc(m.title) + '">' + esc(m.title) + '</td>' +
      '<td>' + esc(listName('requestTypes', m.typeId) || '—') + '</td>' +
      '<td>' + esc(listName('priorities', m.prioId) || '—') + '</td>' +
      '<td class="num">' + fmtInt(m.amount) + '</td>' +
      '<td>' + toFa(m.start) + ' تا ' + toFa(m.end) + '</td>' +
      '<td class="num">' + fmtInt(planSum) + '</td>' +
      '<td>' + (diff === 0 ? '<span class="chip st-green">تطابق</span>' : '<span class="chip st-red">اختلاف ' + fmtInt(diff) + '</span>') + '</td>' +
      '<td><div class="act-cell">' +
      '<button class="icon-btn" data-act="view" data-i="' + i + '" title="مشاهده جزئیات">' + I.eye + '</button>' +
      '<button class="icon-btn" data-act="edit" data-i="' + i + '" title="ویرایش">' + I.edit + '</button>' +
      '<button class="icon-btn" data-act="del" data-i="' + i + '" title="حذف">' + I.trash + '</button>' +
      '</div></td></tr>';
  }).join('');
  const totalEst = p.micros.reduce((s, m) => s + m.amount, 0);
  root.innerHTML = '<div class="panel"><div class="panel-h"><span class="panel-t">' + I.list + ' مرحله ۲ — ریزتقاضاهای بودجه</span>' +
    '<button class="btn btn-primary" id="addMicro">' + I.plus + ' افزودن ریزتقاضا</button></div>' +
    '<div class="panel-b tight"><div class="tbl-scroll"><table class="tbl">' +
    '<thead><tr><th>شناسه</th><th>عنوان تقاضا</th><th>نوع تقاضا</th><th>اولویت</th><th>مبلغ برآورد (' + esc(CUR()) + ')</th><th>بازه جذب</th><th>جمع جذب ماهانه</th><th>وضعیت</th><th>عملیات</th></tr></thead>' +
    '<tbody>' + (rows || '') + '</tbody>' +
    (p.micros.length ? '<tfoot><tr><td colspan="4">جمع کل برآورد</td><td class="num">' + fmtInt(totalEst) + '</td><td colspan="4"></td></tr></tfoot>' : '') +
    '</table></div>' +
    (p.micros.length ? '' : emptyState('هنوز ریزتقاضایی ثبت نشده است', 'برای افزودن ریزتقاضا روی دکمه «افزودن ریزتقاضا» کلیک کنید.', I.list)) +
    '</div></div>' + wizNavHTML(true);
  $('#addMicro').addEventListener('click', () => openMicroModal(-1));
  $$('#wizBody [data-act]').forEach(b => b.addEventListener('click', () => {
    const i = +b.getAttribute('data-i'), act = b.getAttribute('data-act');
    if (act === 'view') openMicroModal(i, true);
    else if (act === 'edit') openMicroModal(i);
    else if (act === 'del'){
      confirmDlg({ title: 'حذف ریزتقاضا', danger: true, okLabel: 'حذف', msg: 'ریزتقاضای «<b>' + esc(p.micros[i].title) + '</b>» حذف شود؟ این عمل قابل بازگشت نیست.' })
        .then(ok => { if (ok){ p.micros.splice(i, 1); toast('ریزتقاضا حذف شد', 'success'); renderWizStep2($('#wizBody')); } });
    }
  }));
  bindWizNav(root);
}

/* ---------- مرحله ۳ و ۴: خلاصه فنی و جذب (تکمیلی در مودال ریزتقاضا) ---------- */
function renderWizStep3(root){
  const p = wiz.prog;
  const rows = p.micros.map((m, i) =>
    '<div class="micro-acc"><div class="ma-head"><span class="chip chip-soft">' + toFa(m.id) + '</span>' +
    '<span class="ma-title">' + esc(m.title) + '</span>' +

    '<div class="kv"><div class="k">شرح نیازمندی‌ها</div><div class="v">' + esc((m.tech || {}).reqDesc || 'ثبت نشده') + '</div></div>' +
    '</div></div></div>'
  ).join('');

function wizWarnings(){
  const p = wiz.prog, warns = [], errs = [];
  if (!p.micros.length) errs.push('هیچ ریزتقاضایی برای این برنامه ثبت نشده است.');
  p.micros.forEach(m => {
    const planSum = Object.values(m.plan || {}).reduce((s, v) => s + (v || 0), 0);
    const diff = m.amount - planSum;
    if (diff !== 0)
      (db.settings.policy === 'block' ? errs : warns).push('ریزتقاضای «' + m.title + '»: جمع جذب ماهانه با مبلغ برآورد ' + fmtInt(Math.abs(diff)) + ' ' + CUR() + ' اختلاف دارد.');
  });
  if (errs.length === 0 && !p.micros.some(m => m.amount > 0)) warns.push('هیچ مبلغ برآورد مثبتی ثبت نشده است.');
  if (p.committerId && p.committerId === p.seniorManagerId)
    warns.push('متعهد و مدیر ارشد این برنامه یک نفر است («' + personName(p.committerId) + '»)؛ این فرد باید به‌ترتیب ابتدا در نقش متعهد و سپس در نقش مدیر ارشد بررسی و تأیید کند.');
  return { errs, warns };
}

function submitWizProgram(){
  const p = wiz.prog;
  const { errs, warns } = wizWarnings();
  if (errs.length){ toast('برطرف کردن خطاها قبل از ارسال الزامی است', 'error'); return; }
  const doSubmit = () => {
    if (!p.code){
      p.code = nextProgCode(p.year || budgetYear());
      p.createdAt = todayJStr(); p.createdTime = nowTimeStr(); p.createdBy = curUser().id;
      db.programs.push(p);
    } else {
      const idx = db.programs.findIndex(x => x.code === p.code);
      if (idx !== -1) db.programs[idx] = p;
    }
    const from = p.status;
    p.status = 'pending_committer';
    p.submittedAt = todayJStr(); p.submittedTime = nowTimeStr(); p.submittedBy = curUser().id;
    pushHist(p, from === 'returned' ? 'اصلاح و ارسال مجدد برای متعهد' : 'ثبت نهایی و ارسال برای متعهد', '', from, 'pending_committer', { actedRole: p.applicantId === curUser().id ? 'applicant' : '', sig: sigRecordCurrent() });
    /* اعلان گردش کار: متعهدِ برنامه (و متقاضی در صورت ثبت توسط دیگران) */
    wfNotify(p, [p.committerId],
      'برنامه «' + p.title + '» (' + toFa(p.code) + ') برای بررسی و تأیید شما در کارتابل ثبت شد.',
      { cls: 'ic-amber', icon: 'inbox', sub: 'متقاضی: ' + personName(p.applicantId) + ' — مبلغ برآورد: ' + fmtInt(progTotals(p).est) + ' ' + CUR() });
    if (p.applicantId && p.applicantId !== curUser().id)
      wfNotify(p, [p.applicantId],
        'برنامه «' + p.title + '» (' + toFa(p.code) + ') ثبت نهایی و برای متعهد ارسال شد.',
        { cls: 'ic-info', icon: 'send', sub: 'متعهد: ' + personName(p.committerId) });
    saveDB(true);
    toast('برنامه با شناسه ' + p.code + ' ثبت نهایی و به کارتابل متعهد ارسال شد', 'success');
    nav('programs');
  };
  if (warns.length){
    confirmDlg({
      title: 'ارسال با هشدار', danger: true, okLabel: 'با اطلاع کامل ارسال کن',
      msg: warns.map(x => '• ' + esc(x)).join('<br>') + '<br><br>آیا از ارسال برنامه مطمئن هستید؟'
    }).then(ok => { if (ok) doSubmit(); });
  } else {
    confirmDlg({
      title: 'ثبت نهایی برنامه', okIcon: I.send,
      msg: 'برنامه «<b>' + esc(p.title) + '</b>» با ' + toFa(p.micros.length) + ' ریزتقاضا و مبلغ برآورد <b>' + fmtInt(progTotals(p).est) + ' ' + esc(CUR()) + '</b> برای متعهد ارسال شود؟'
    }).then(ok => { if (ok) doSubmit(); });
  }
}

   بخش ۸ — مودال ریزتقاضا: اطلاعات پایه / جزئیات فنی / جذب ماهانه
   ================================================================ */
let mm = null;
function normalizeJDate(s, endDay){
  if (!s) return s;
  const t = toEn(String(s)).trim();
  const m = t.match(/^(\d{4})\/(\d{1,2})$/);
  if (m){
    const y = +m[1], mo = +m[2];
    const day = endDay ? jMonthLen(y, mo) : 1;
    return y + '/' + pad2(mo) + '/' + pad2(day);
  }
  return s;
}
function newMicroSkeleton(){
  return {
    id: null, title: '', amount: null, typeId: '', start: '', end: '',
    prioId: '', domId: '', items: '', unitId: '', periodId: '', year: budgetYear(),
    tech: { summary: '', reqId: '', reqDesc: '' }, plan: {}, approved: false,
    ahp: { answers: {}, status: 'pending', score: null, rank: null, by: '', byId: '', date: '', time: '', comment: '' }
  };
}
function openMicroModal(idx, readonly){
  const isNew = idx < 0;
  mm = {
    idx, isNew, readonly: !!readonly,
    data: isNew ? newMicroSkeleton() : clone(wiz.prog.micros[idx]),
    step: 1, dirty: false, dd: {}, prevStart: null, prevEnd: null
  };
  if (!isNew){ mm.prevStart = mm.data.start; mm.prevEnd = mm.data.end; }
  if (!mm.data.year) mm.data.year = wiz.prog.year;
  mm.data.start = normalizeJDate(mm.data.start, false);
  mm.data.end = normalizeJDate(mm.data.end, true);
  mm.prevStart = mm.data.start; mm.prevEnd = mm.data.end;
  const title = readonly ? 'مشاهده جزئیات ریزتقاضا' : (isNew ? 'افزودن ریزتقاضای جدید' : 'ویرایش ریزتقاضا');
  openModal({
    title, size: 'lg', icon: I.list,
    dirty: () => mm && mm.dirty && !mm.readonly,
    onDiscard: () => { mm = null; },
    onClose: () => { mm = null; },
    footerButtons: [{ label: 'بستن', cls: 'btn-ghost' }]
  });
  mm.ov = modalStack[modalStack.length - 1].ov;
  mmRenderAll();
}
function mmStepperHTML(){
  const steps = [
    { t: 'اطلاعات ریزتقاضا', s: 'مرحله ۲ برنامه' },
    { t: 'جزئیات فنی و اجرایی', s: 'مرحله ۳ برنامه' },
    { t: 'معیارهای اولویت‌بندی', s: 'مرحله ۳ ریزتقاضا' },
    { t: 'پیش‌بینی جذب ماهانه', s: 'مرحله ۴ برنامه' }
  ];
  let h = '<div class="stepper" style="margin-bottom:16px">';
  steps.forEach((s, i) => {
    const n = i + 1;
    const cls = mm.step === n ? ' active' : (mm.step > n ? ' done' : '');
    h += '<div class="step' + cls + '"><div class="step-dot">' + (mm.step > n ? I.check : toFa(n)) + '</div><div class="step-title">' + s.t + '<div class="step-sub">' + s.s + '</div></div></div>';
  });
  return h + '</div>';
}
function mmRenderAll(){
  const body = $('.modal-body', mm.ov);
  body.innerHTML = mmStepperHTML() + '<div id="mmBody"></div>';
  mmRenderStep();
  mmRenderFooter();
}
function mmRenderFooter(){
  const foot = $('.modal-foot', mm.ov);
  if (mm.readonly){
    foot.innerHTML = '<button class="btn btn-ghost" id="mmClose">بستن</button>';
    $('#mmClose').addEventListener('click', () => { mm.dirty = false; closeTopModal(true); });
    return;
  }
  let h = '<button class="btn btn-ghost" id="mmCancel">' + I.x + ' انصراف</button>';
  if (mm.step > 1) h = '<button class="btn btn-outline" id="mmPrev">' + I.back + ' مرحله قبل</button>' + h;
  if (mm.step < 4) h += '<button class="btn btn-primary" id="mmNext">مرحله بعد ' + I.chevL + '</button>';
  else h += '<button class="btn btn-success" id="mmApprove">' + I.checkC + ' تأیید ریزتقاضا</button>';
  foot.innerHTML = h;
  $('#mmCancel').addEventListener('click', () => requestCloseModal());
  $('#mmPrev') && $('#mmPrev').addEventListener('click', () => { mm.step--; mmRenderAll(); });
  $('#mmNext') && $('#mmNext').addEventListener('click', () => {
    const errs = mmValidateStep(mm.step);
    if (errs.length){ errs.forEach(e => setFieldError($('#mmBody'), e.id, e.msg)); toast('لطفاً خطاهای این مرحله را برطرف کنید', 'error'); return; }
    clearFieldErrors($('#mmBody'));
    mm.step++; mmRenderAll();
  });
  $('#mmApprove') && $('#mmApprove').addEventListener('click', mmApprove);
}
function mmValidateStep(step){
  const d = mm.data, errs = [];
  if (step === 1){
    if (!d.title || !d.title.trim()) errs.push({ id: 'm-title', msg: 'عنوان تقاضا ضروری است' });
    const amt = parseMoney(d.amount);
    if (amt === null || isNaN(amt)) errs.push({ id: 'm-amount', msg: 'مبلغ برآورد معتبر وارد کنید' });
    else if (amt < 0) errs.push({ id: 'm-amount', msg: 'مبلغ نمی‌تواند منفی باشد' });
    if (!d.typeId) errs.push({ id: 'm-type', msg: 'نوع تقاضا ضروری است' });
    if (!d.prioId) errs.push({ id: 'm-prio', msg: 'اولویت ضروری است' });
    if (!d.year) errs.push({ id: 'm-year', msg: 'سال بودجه ضروری است' });
    if (d.title && d.title.length > 200) errs.push({ id: 'm-title', msg: 'حداکثر ۲۰۰ کاراکتر مجاز است' });
  }
  if (step === 4){
    const a = parseJ(d.start), b = parseJ(d.end);
    if (!d.start || !a) errs.push({ id: 'm-start', msg: 'تاریخ شروع جذب معتبر وارد کنید (نمونه: ۱۴۰۵/۰۳/۰۱)' });
    if (!d.end || !b) errs.push({ id: 'm-end', msg: 'تاریخ پایان جذب معتبر وارد کنید' });
    if (a && b && cmpYM({ y: b.jy, m: b.jm }, { y: a.jy, m: a.jm }) < 0)
      errs.push({ id: 'm-end', msg: 'پایان جذب نمی‌تواند قبل از شروع جذب باشد' });
    if (a && b && cmpYM({ y: b.jy, m: b.jm }, { y: a.jy, m: a.jm }) >= 0){
      const n = monthRange({ y: a.jy, m: a.jm }, { y: b.jy, m: b.jm }).length;
      if (n > (db.settings.maxSpan || 36)) errs.push({ id: 'm-end', msg: 'حداکثر بازه جذب ' + toFa(db.settings.maxSpan || 36) + ' ماه مجاز است (بازه فعلی: ' + toFa(n) + ' ماه)' });
    }
  }
  return errs;
}
function mmValidateAll(){
  return mmValidateStep(1).concat(mmValidateStep(4));
}
